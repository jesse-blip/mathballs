<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulation</title>
    <style>
        canvas {
            background: #f0f0f0;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const bigBall = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 30,
            color: 'blue',
            dx: 0,
            dy: 0,
            friction: 0.99,
            speed: 1
        };

        const damageBall = {
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: 10,
            color: 'red',
            dx: 0,
            dy: 0,
        };

        function drawBall(ball) {
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function update() {
            // Move big ball with realistic physics
            bigBall.dx += (Math.random() - 0.5) * bigBall.speed;
            bigBall.dy += (Math.random() - 0.5) * bigBall.speed;
            bigBall.dx *= bigBall.friction;
            bigBall.dy *= bigBall.friction;
            bigBall.x += bigBall.dx;
            bigBall.y += bigBall.dy;

            // Bounce damage ball immediately on collision
            if (Math.abs(bigBall.x - damageBall.x) < bigBall.radius + damageBall.radius &&
                Math.abs(bigBall.y - damageBall.y) < bigBall.radius + damageBall.radius) {
                damageBall.dx = (Math.random() - 0.5) * 10;
                damageBall.dy = (Math.random() - 0.5) * 10;
            }

            damageBall.x += damageBall.dx;
            damageBall.y += damageBall.dy;

            // Bounce the damage ball off the walls
            if (damageBall.x + damageBall.radius > canvas.width || damageBall.x - damageBall.radius < 0) {
                damageBall.dx *= -1;
            }
            if (damageBall.y + damageBall.radius > canvas.height || damageBall.y - damageBall.radius < 0) {
                damageBall.dy *= -1;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBall(bigBall);
            drawBall(damageBall);
        }

        setInterval(update, 1000 / 60);
    </script>
</body>
</html>

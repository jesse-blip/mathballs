<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>High-Stakes Math Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f1efdb; --red: #cc0000; --gold: #ffcc00; --gray: #cccccc; }
        * { box-sizing: border-box; font-family: 'Roboto Condensed', sans-serif; }
        body { background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        /* LABORATORY / SETUP */
        .lab-ui { background: white; border: 5px solid #000; padding: 30px; width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; box-shadow: 15px 15px 0px rgba(0,0,0,0.1); }
        .setup-col { display: flex; flex-direction: column; gap: 10px; }
        .preview-col { background: #eee; border: 3px dashed #bbb; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .ball-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0; }
        .ball-opt { aspect-ratio: 1/1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 12px; transition: 0.2s; }
        .ball-opt.active { border-color: #000; transform: scale(1.15); box-shadow: 0 0 10px rgba(0,0,0,0.2); }

        .input-fld { width: 100%; padding: 10px; border: 3px solid #000; font-size: 1.2rem; font-weight: bold; }
        .btn-start { grid-column: span 2; padding: 20px; background: var(--gold); border: 5px solid #000; font-size: 2rem; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        /* GAME SCREEN */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100vh; justify-content: center; }
        .active { display: flex; }

        .header { text-align: center; font-size: 2.2rem; width: 800px; margin-bottom: 15px; line-height: 1.1; }
        .outline-red { color: var(--red); -webkit-text-stroke: 1.5px black; font-size: 2.6rem; }

        #canvas-wrap { width: 600px; height: 750px; background: #fff; border: 6px solid #000; position: relative; overflow: hidden; }
        
        #big-ball { position: absolute; background: var(--gray); border-radius: 50%; border: 2px solid #666; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; font-family: monospace; word-break: break-all; line-height: 0.8; padding: 15px; z-index: 2; }
        #tiny-ball { position: absolute; border-radius: 50%; border: 3px solid #000; color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; z-index: 3; text-shadow: 2px 2px 0px #000; }

        #damage-label { margin-top: 10px; font-size: 3rem; color: var(--gold); -webkit-text-stroke: 2px black; font-weight: 900; }
        
        /* EFFECTS */
        .dmg-pop { position: absolute; color: var(--red); font-weight: 900; pointer-events: none; z-index: 10; -webkit-text-stroke: 1px #fff; animation: floatUp 1s forwards; font-size: 24px; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
        .particle { position: absolute; border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body>

<div id="screen-lab" class="screen active">
    <div class="lab-ui">
        <div class="setup-col">
            <h1>CHALLENGE LAB</h1>
            <label>HP (e.g., 10^100 or 1000000)</label>
            <input type="text" id="in-hp" class="input-fld" value="10^100">
            <label>TIME (SEC)</label>
            <input type="number" id="in-time" class="input-fld" value="58.1" step="0.1">
            <label>SELECT YOUR BALL</label>
            <div class="ball-grid" id="menu">
                <div class="ball-opt active" style="background:#ff0000" onclick="sel(this,'mult',2,'x2')">x2</div>
                <div class="ball-opt" style="background:#00ccff" onclick="sel(this,'mult',5,'x5')">x5</div>
                <div class="ball-opt" style="background:#00ff00" onclick="sel(this,'mult',10,'x10')">x10</div>
                <div class="ball-opt" style="background:#ff00ff" onclick="sel(this,'mult',0,'⚡')">⚡</div>
                <div class="ball-opt" style="background:#000000" onclick="sel(this,'root',0,'√x')">√x</div>
                <div class="ball-opt" style="background:#ff9900" onclick="sel(this,'half',0,'x/2')">x/2</div>
                <div class="ball-opt" style="background:#777777" onclick="sel(this,'quarter',0,'x/4')">x/4</div>
                <div class="ball-opt" style="background:#6600ff" onclick="sel(this,'rev',0,'x/y')">x/y</div>
            </div>
            <label>BIG RADIUS: <input type="range" min="50" max="250" value="100" id="sz-t" oninput="pre()"></label>
            <label>SMALL RADIUS: <input type="range" min="15" max="80" value="35" id="sz-b" oninput="pre()"></label>
        </div>
        <div class="preview-col"><div id="pre-t" style="background:#ccc; border-radius:50%"></div><div id="pre-b" style="border-radius:50%; border:2px solid #000; position:absolute; left:20px;"></div></div>
        <button class="btn-start" onclick="go()">START VIDEO CHALLENGE</button>
    </div>
</div>

<div id="screen-game" class="screen">
    <div class="header">
        Can <span class="outline-red" id="h-ball">DOUBLER</span> <span id="h-sub">x2</span> Deal 1 <span id="h-unit">Googol</span> Damage in <span id="h-tm">58.1</span>s?
    </div>
    <div id="canvas-wrap">
        <div id="big-ball"><div id="hp-txt"></div></div>
        <div id="tiny-ball"></div>
    </div>
    <div id="damage-label">DAMAGE : 0</div>
</div>

<script>
let hp = 0n, total = 0n, time = 0, last = 0, running = false;
const p = { x: 50, y: 50, dx: 10, dy: 10, r: 35, type: 'mult', val: 2n, lbl: 'x2', col: '#ff0000', pwr: 2n, hits: 1n };
const t = { x: 250, y: 300, dx: 3, dy: 3, r: 100 };

const ctx = new (window.AudioContext || window.webkitAudioContext)();
function play(f, v, d) {
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.frequency.value = f; g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + d);
}

function pre() {
    const tr = document.getElementById('sz-t').value; const br = document.getElementById('sz-b').value;
    const pt = document.getElementById('pre-t'); const pb = document.getElementById('pre-b');
    pt.style.width = pt.style.height = (tr*2)+"px"; pb.style.width = pb.style.height = (br*2)+"px";
    pb.style.background = p.col; pb.innerText = p.lbl; pb.style.color = "#fff";
}

function sel(el, type, val, lbl) {
    document.querySelectorAll('.ball-opt').forEach(b => b.classList.remove('active'));
    el.classList.add('active'); p.type = type; p.val = BigInt(val); p.lbl = lbl; p.col = el.style.backgroundColor; pre();
}

function format(n) {
    const s = n.toString();
    if (s.length > 100) return (n / 10n**100n) + " Googol";
    if (s.length > 30) return (n / 10n**30n) + " Nonillion";
    if (s.length > 18) return (n / 10n**18n) + " Quintillion";
    if (s.length > 12) return (n / 10n**12n) + " Trillion";
    return s;
}

function explode(x, y, color) {
    for(let i=0; i<40; i++) {
        const div = document.createElement('div'); div.className = 'particle';
        div.style.background = color; div.style.width = div.style.height = "10px";
        div.style.left = x+"px"; div.style.top = y+"px";
        document.getElementById('canvas-wrap').appendChild(div);
        const ang = Math.random()*Math.PI*2; const dist = Math.random()*200;
        div.animate([{transform:'translate(0,0)', opacity:1}, {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`, opacity:0}], 1000);
        setTimeout(()=>div.remove(), 1000);
    }
}

function go() {
    const val = document.getElementById('in-hp').value;
    hp = val.includes('^') ? BigInt(val.split('^')[0])**BigInt(val.split('^')[1]) : BigInt(val);
    time = parseFloat(document.getElementById('in-time').value)*1000;
    t.r = parseInt(document.getElementById('sz-t').value); p.r = parseInt(document.getElementById('sz-b').value);
    p.pwr = p.val || 1n; total = 0n; p.hits = 1n;

    document.getElementById('h-ball').innerText = p.lbl === '⚡' ? 'POWER' : 'DOUBLER';
    document.getElementById('h-sub').innerText = p.lbl;
    document.getElementById('h-unit').innerText = hp.toString().length > 50 ? "Googol" : "Quintillion";
    
    const bb = document.getElementById('big-ball'); bb.style.width = bb.style.height = (t.r*2)+"px";
    const tb = document.getElementById('tiny-ball'); tb.style.width = tb.style.height = (p.r*2)+"px";
    tb.style.background = p.col; tb.innerText = p.lbl;

    document.getElementById('screen-lab').classList.remove('active');
    document.getElementById('screen-game').classList.add('active');
    
    running = true; last = performance.now();
    loop();
}

function loop() {
    if(!running) return;
    const now = performance.now(); const dt = now - last; last = now; time -= dt;

    if (time <= 0 || hp <= 0n) {
        running = false; 
        if(hp <= 0n) { play(100, 0.5, 0.5); explode(t.x+t.r, t.y+t.r, '#ccc'); alert("VICTORY"); }
        else { play(50, 0.5, 0.5); explode(p.x+p.r, p.y+p.r, p.col); alert("FAILED"); }
        location.reload(); return;
    }

    document.getElementById('h-tm').innerText = (time/1000).toFixed(1);

    // Physics with Wall-Stick Fix
    t.x += t.dx; t.y += t.dy;
    if (t.x <= 0) { t.x = 0; t.dx *= -1; play(800, 0.1, 0.1); }
    if (t.x >= 600 - t.r*2) { t.x = 600 - t.r*2; t.dx *= -1; play(800, 0.1, 0.1); }
    if (t.y <= 0) { t.y = 0; t.dy *= -1; play(800, 0.1, 0.1); }
    if (t.y >= 750 - t.r*2) { t.y = 750 - t.r*2; t.dy *= -1; play(800, 0.1, 0.1); }
    
    const bb = document.getElementById('big-ball');
    bb.style.left = t.x+"px"; bb.style.top = t.y+"px";
    document.getElementById('hp-txt').innerText = hp.toString();
    document.getElementById('hp-txt').style.fontSize = (t.r/7)+"px";

    p.x += p.dx; p.y += p.dy;
    if (p.x <= 0) { p.x = 0; p.dx *= -1; play(800, 0.1, 0.1); }
    if (p.x >= 600 - p.r*2) { p.x = 600 - p.r*2; p.dx *= -1; play(800, 0.1, 0.1); }
    if (p.y <= 0) { p.y = 0; p.dy *= -1; play(800, 0.1, 0.1); }
    if (p.y >= 750 - p.r*2) { p.y = 750 - p.r*2; p.dy *= -1; play(800, 0.1, 0.1); }

    const tb = document.getElementById('tiny-ball');
    tb.style.left = p.x+"px"; tb.style.top = p.y+"px";

    // Collision
    const dx = (p.x+p.r) - (t.x+t.r); const dy = (p.y+p.r) - (t.y+t.r);
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < (p.r + t.r)) {
        play(200, 0.3, 0.2);
        let d = 0n;
        if(p.type==='mult') { d = p.pwr; if(p.val > 0n) p.pwr *= p.val; }
        else if(p.type==='root') d = hp - BigInt(Math.floor(Math.sqrt(Number(hp))));
        else if(p.type==='half') d = hp/2n;
        else if(p.type==='rev') { d = hp - (hp/(p.hits+1n)); p.hits++; }
        
        hp -= d; total += d;
        document.getElementById('damage-label').innerText = "DAMAGE : " + format(total);
        
        const pop = document.createElement('div'); pop.className = 'dmg-pop';
        pop.innerText = "-" + format(d); pop.style.left = p.x+"px"; pop.style.top = p.y+"px";
        document.getElementById('canvas-wrap').appendChild(pop); setTimeout(()=>pop.remove(), 1000);

        // Reflect bounce
        const nx = dx/dist; const ny = dy/dist;
        const dot = p.dx*nx + p.dy*ny;
        p.dx -= 2*dot*nx; p.dy -= 2*dot*ny;
        p.x += nx*10; p.y += ny*10; // Eject to prevent stick
    }
    requestAnimationFrame(loop);
}
pre();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Math Battle Pro</title>
    <style>
        body { background: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* The Arena - Perfectly Square */
        #arena { 
            width: 500px; height: 500px; background: #ffffff; border: 10px solid #222; 
            position: relative; overflow: hidden; border-radius: 4px;
        }

        /* The Big Ball (Rooter) */
        #target {
            position: absolute; width: 130px; height: 130px; background: #cfcfcf; 
            border-radius: 50%; border: 5px solid #444; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-weight: 900; color: #222;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1); pointer-events: none;
        }

        /* Small Balls */
        .ball {
            position: absolute; width: 55px; height: 55px; border-radius: 50%; 
            border: 3px solid #000; color: white; font-weight: bold; font-size: 18px;
            display: flex; align-items: center; justify-content: center; pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* UI Styling */
        #controls { margin-top: 15px; display: flex; gap: 8px; background: #222; padding: 12px; border-radius: 12px; }
        .spawn-btn { width: 55px; height: 55px; border-radius: 50%; cursor: pointer; border: 2px solid white; color: white; font-weight: 800; transition: 0.1s; }
        .spawn-btn:hover { transform: scale(1.1); }
        
        #stats { color: white; text-align: center; margin-bottom: 10px; }
        #dmg { font-size: 2.5rem; color: #ff5722; font-weight: 900; margin: 0; }
        input { background: #333; color: white; border: 1px solid #555; padding: 5px; border-radius: 4px; text-align: center; }

        .crash { animation: shake 0.05s infinite; background: #ff0000 !important; border-color: #700 !important; }
        @keyframes shake { 0% { transform: translate(3px, 3px); } 100% { transform: translate(-3px, -3px); } }
    </style>
</head>
<body>

<div id="stats">
    <p>TARGET HP: <input type="text" id="hp-input" value="1000000"></p>
    <h1 id="dmg">10</h1>
</div>

<div id="arena">
    <div id="target">
        <span>ROOTER</span>
        <span id="t-hp" style="font-size: 12px;">HP: 1M</span>
    </div>
</div>

<div id="controls">
    <button class="spawn-btn" style="background:#ff5722" onclick="addBall(2, '#ff5722')">2x</button>
    <button class="spawn-btn" style="background:#2196f3" onclick="addBall(3, '#2196f3')">3x</button>
    <button class="spawn-btn" style="background:#4caf50" onclick="addBall(4, '#4caf50')">4x</button>
    <button class="spawn-btn" style="background:#ffeb3b; color:black" onclick="addBall(5, '#ffeb3b')">5x</button>
    <button class="spawn-btn" style="background:#9c27b0" onclick="addBall(6, '#9c27b0')">6x</button>
</div>

<script>
let damage = 10n;
let isDead = false;
const balls = [];
const target = { x: 185, y: 185, dx: 2, dy: 2, radius: 65 };

function addBall(m, c) {
    if (isDead) return;
    const b = { x: Math.random()*400, y: 20, dx: (Math.random()-0.5)*12, dy: 5, m: BigInt(m), color: c };
    const el = document.createElement('div');
    el.className = 'ball';
    el.style.background = c;
    el.innerText = m + 'x';
    document.getElementById('arena').appendChild(el);
    b.el = el;
    balls.push(b);
}

function run() {
    if (isDead) return;

    // Move Rooter (The Big Ball)
    target.x += target.dx; target.y += target.dy;
    if (target.x < 0 || target.x > 360) target.dx *= -1;
    if (target.y < 0 || target.y > 360) target.dy *= -1;
    const tEl = document.getElementById('target');
    tEl.style.left = target.x + 'px';
    tEl.style.top = target.y + 'px';

    const hpVal = BigInt(document.getElementById('hp-input').value || 0);
    document.getElementById('t-hp').innerText = "HP: " + hpVal.toLocaleString();

    balls.forEach(b => {
        b.x += b.dx; b.y += b.dy;
        // Bounce off walls
        if (b.x < 0 || b.x > 435) b.dx *= -1;
        if (b.y < 0 || b.y > 435) b.dy *= -1;

        // Collision Logic
        let dist = Math.hypot((b.x+27) - (target.x+65), (b.y+27) - (target.y+65));
        if (dist < 92) {
            damage *= b.m;
            // Physics Kick
            b.dx *= -1.02; b.dy *= -1.02;
            b.x += b.dx * 2; b.y += b.dy * 2;
            
            // UI Update
            const dStr = damage.toString();
            document.getElementById('dmg').innerText = dStr.length > 12 ? "10^" + dStr.length : dStr;

            if (damage >= hpVal) {
                isDead = true;
                document.getElementById('arena').classList.add('crash');
                document.getElementById('dmg').innerText = "ERROR";
            }
        }
        b.el.style.left = b.x + 'px';
        b.el.style.top = b.y + 'px';
    });
    requestAnimationFrame(run);
}
run();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Math Simulation - Special Balls</title>
    <style>
        body { background: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        #stats { text-align: center; margin-bottom: 15px; }
        #ball-val-display { font-size: 3.5rem; font-weight: 900; color: #222; margin: 5px; min-height: 70px; font-family: monospace; }
        #arena { width: 450px; height: 450px; background: white; border: 12px solid #222; position: relative; overflow: hidden; }
        #target { position: absolute; width: 110px; height: 110px; background: #cccccc; border-radius: 50%; border: 5px solid #444; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; font-size: 16px; padding: 10px; box-sizing: border-box; word-break: break-all; }
        #active-ball { position: absolute; width: 55px; height: 55px; border-radius: 50%; border: 3px solid #000; color: white; font-weight: bold; display: none; align-items: center; justify-content: center; font-size: 14px; text-align: center; }
        #menu { margin-top: 25px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 15px; background: #333; border-radius: 12px; }
        .menu-btn { width: 60px; height: 60px; border-radius: 50%; cursor: pointer; border: 2px solid white; color: white; font-weight: bold; font-size: 12px; }
        input { padding: 8px; text-align: center; width: 320px; border: 3px solid #333; border-radius: 6px; font-family: monospace; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="stats">
    <input type="text" id="hp-input" value="10^100" oninput="manualReset()">
    <div id="ball-val-display">0</div>
</div>

<div id="arena">
    <div id="target"><div id="t-hp"></div></div>
    <div id="active-ball"></div>
</div>

<div id="menu">
    <button class="menu-btn" style="background:#ff5722" onclick="setBall('mult', 2, '#ff5722', '2x')">2x</button>
    <button class="menu-btn" style="background:#2196f3" onclick="setBall('mult', 6, '#2196f3', '6x')">6x</button>
    <button class="menu-btn" style="background:#000" onclick="setBall('rooter', 0, '#000', 'ROOT')">ROOT</button>
    <button class="menu-btn" style="background:#f44336" onclick="setBall('halver', 2, '#f44336', 'HALF')">HALF</button>
    <button class="menu-btn" style="background:#ff9800" onclick="setBall('quarter', 4, '#ff9800', 'QRTR')">QRTR</button>
    <button class="menu-btn" style="background:#9c27b0" onclick="setBall('reverser', 1, '#9c27b0', 'REV')">REV</button>
</div>

<script>
let currentHP = 0n;
let ballSpeed = 7.5;
const targetObj = { x: 170, y: 170, dx: 1.5, dy: 1.5, radius: 55 };
const ballObj = { x: 0, y: 0, dx: 0, dy: 0, active: false, type: '', val: 0, hitCount: 0n, currentPower: 0n, color: '', label: '' };

function parsePowerInput(input) {
    input = input.replace(/\s/g, '');
    if (input.includes('^')) {
        let parts = input.split('^');
        return BigInt(parts[0]) ** BigInt(parts[1]);
    }
    try { return BigInt(input.replace(/,/g, '')); } catch(e) { return 0n; }
}

function manualReset() {
    currentHP = parsePowerInput(document.getElementById('hp-input').value);
    document.getElementById('ball-val-display').innerText = "0";
    targetObj.x = 170; targetObj.y = 170;
    updateHPDisplay();
}

function updateHPDisplay() {
    let s = currentHP.toString();
    document.getElementById('t-hp').innerText = s.length > 14 ? "10^" + (s.length - 1) : currentHP.toLocaleString();
}

function bigIntSqrt(value) {
    if (value < 0n) return null;
    if (value < 2n) return value;
    let x = value / 2n + 1n;
    let y = (x + value / x) / 2n;
    while (y < x) { x = y; y = (x + value / x) / 2n; }
    return x;
}

function setBall(type, val, color, label) {
    manualReset();
    ballObj.active = true;
    ballObj.type = type;
    ballObj.val = BigInt(val);
    ballObj.hitCount = 1n;
    ballObj.currentPower = BigInt(val);
    ballObj.color = color;
    ballObj.label = label;
    ballObj.x = 30; ballObj.y = 30;
    
    let angle = Math.random() * Math.PI * 2;
    ballObj.dx = Math.cos(angle) * ballSpeed;
    ballObj.dy = Math.sin(angle) * ballSpeed;
    
    const el = document.getElementById('active-ball');
    el.style.display = 'flex';
    el.style.background = color;
    el.innerText = label;
}

function run() {
    targetObj.x += targetObj.dx;
    targetObj.y += targetObj.dy;
    if(targetObj.x <= 0 || targetObj.x >= 340) targetObj.dx *= -1;
    if(targetObj.y <= 0 || targetObj.y >= 340) targetObj.dy *= -1;
    document.getElementById('target').style.left = targetObj.x + 'px';
    document.getElementById('target').style.top = targetObj.y + 'px';

    if(ballObj.active) {
        ballObj.x += ballObj.dx; ballObj.y += ballObj.dy;
        if(ballObj.x <= 0 || ballObj.x >= 395) ballObj.dx *= -1;
        if(ballObj.y <= 0 || ballObj.y >= 395) ballObj.dy *= -1;

        let dx = (ballObj.x + 27.5) - (targetObj.x + 55);
        let dy = (ballObj.y + 27.5) - (targetObj.y + 55);
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 82.5) {
            let damageDealt = 0n;

            if (ballObj.type === 'mult') {
                damageDealt = ballObj.currentPower;
                ballObj.currentPower *= ballObj.val;
            } else if (ballObj.type === 'halver') {
                damageDealt = currentHP / 2n;
            } else if (ballObj.type === 'quarter') {
                damageDealt = currentHP / 4n;
            } else if (ballObj.type === 'reverser') {
                damageDealt = currentHP / ballObj.hitCount;
                ballObj.hitCount++;
            } else if (ballObj.type === 'rooter') {
                let root = bigIntSqrt(currentHP);
                damageDealt = currentHP - root;
                if (currentHP <= 1n) currentHP = 0n;
            }

            currentHP -= damageDealt;
            if (currentHP < 0n) currentHP = 0n;

            document.getElementById('ball-val-display').innerText = damageDealt.toString().length > 15 ? "10^" + (damageDealt.toString().length - 1) : damageDealt.toLocaleString();
            updateHPDisplay();

            // Physics
            let nx = dx / distance; let ny = dy / distance;
            targetObj.dx -= nx * 2; targetObj.dy -= ny * 2;
            let dot = ballObj.dx * nx + ballObj.dy * ny;
            ballObj.dx = (ballObj.dx - 2 * dot * nx);
            ballObj.dy = (ballObj.dy - 2 * dot * ny);
            ballObj.x += nx * 6; ballObj.y += ny * 6;
        }
        document.getElementById('active-ball').style.left = ballObj.x + 'px';
        document.getElementById('active-ball').style.top = ballObj.y + 'px';
    }
    requestAnimationFrame(run);
}
manualReset();
run();
</script>
</body>
</html>

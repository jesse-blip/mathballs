<!DOCTYPE html>
<html>
<head>
    <title>Googol Challenge Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-paper: #f1efdb; --border: #000; --text-main: #333; }
        body { background: var(--bg-paper); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Roboto Condensed', sans-serif; overflow: hidden; }
        
        /* SCREEN SYSTEM */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100vh; justify-content: center; }
        .active-screen { display: flex; }

        /* LAB UI (MATCHING YOUR STYLE) */
        .config-panel { background: white; padding: 30px; border: 4px solid var(--border); border-radius: 10px; width: 800px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; box-shadow: 10px 10px 0px rgba(0,0,0,0.1); }
        .setup-side { display: flex; flex-direction: column; gap: 10px; }
        .preview-side { background: #fff; border: 2px solid #ccc; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        #preview-target { position: absolute; background: #cccccc; border-radius: 50%; border: 3px solid #666; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 0.8; word-break: break-all; padding: 10px; box-sizing: border-box; overflow: hidden; font-size: 8px; color: #fff; }
        #preview-ball { position: absolute; border-radius: 50%; border: 2px solid #000; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; }

        .ball-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .ball-select { aspect-ratio: 1/1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; color: white; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; opacity: 0.6; }
        .ball-select.selected { opacity: 1; border-color: #000; transform: scale(1.1); }

        .start-btn { grid-column: span 2; padding: 15px; background: #ffcc00; color: #000; border: 4px solid #000; font-size: 1.5rem; cursor: pointer; font-weight: 900; }

        /* GAME SCREEN (EXACT REPLICA) */
        .header-text { font-size: 2.2rem; text-align: center; margin-bottom: 20px; color: #444; width: 90%; line-height: 1.1; }
        .red-text { color: #cc0000; -webkit-text-stroke: 1px black; }
        
        #arena { width: 600px; height: 600px; background: white; border: 4px solid #000; position: relative; overflow: hidden; }
        
        /* The Big Ball Style */
        #target { 
            position: absolute; background: #cccccc; border-radius: 50%; border: 2px solid #666; 
            display: flex; align-items: center; justify-content: center; text-align: center; 
            z-index: 2; overflow: hidden; padding: 15px; box-sizing: border-box;
            color: white; -webkit-text-stroke: 1px rgba(0,0,0,0.3); font-family: monospace;
            line-height: 0.9; letter-spacing: -1px; word-break: break-all;
        }

        /* The Player Ball Style */
        #active-ball { position: absolute; border-radius: 50%; border: 2px solid #000; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 3; font-size: 24px; }

        #bottom-damage { margin-top: 10px; font-size: 2.5rem; color: #ffcc00; -webkit-text-stroke: 2px black; font-weight: 900; }

        .particle { position: absolute; border-radius: 50%; pointer-events: none; }
        .dmg-popup { position: absolute; color: #ff3333; font-weight: 900; animation: fadeUp 1s forwards; pointer-events: none; z-index: 10; font-size: 20px; }
        @keyframes fadeUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

<div id="start-screen" class="screen active-screen">
    <div class="config-panel">
        <div class="setup-side">
            <h1>SIM SETUP</h1>
            <label>HP: <input type="text" id="hp-input" value="10^100" style="width:100%"></label>
            <label>TIME: <input type="number" id="time-limit" value="58.1" step="0.1" style="width:100%"></label>
            <div class="ball-grid">
                <div class="ball-select selected" style="background:red" onclick="pick(this,'mult',2,'x2')">x2</div>
                <div class="ball-select" style="background:red" onclick="pick(this,'mult',10,'x10')">x10</div>
                <div class="ball-select" style="background:red" onclick="pick(this,'mult',0,'⚡')">⚡</div>
                <div class="ball-select" style="background:black" onclick="pick(this,'rooter',0,'√x')">√x</div>
                <div class="ball-select" style="background:#cc0000" onclick="pick(this,'halver',0,'x/2')">x/2</div>
            </div>
            <label>BIG SIZE: <input type="range" min="50" max="250" value="180" id="slide-target" oninput="updatePreview()"></label>
            <label>BALL SIZE: <input type="range" min="20" max="100" value="60" id="slide-ball" oninput="updatePreview()"></label>
        </div>
        <div class="preview-side">
            <div id="preview-target">999999999999999999999</div>
            <div id="preview-ball">x2</div>
        </div>
        <button class="start-btn" onclick="startGame()">START CHALLENGE</button>
    </div>
</div>

<div id="game-screen" class="screen">
    <div class="header-text">
        Can <span class="red-text" id="display-name">DOUBLER</span> <span id="display-val">x2</span> Deal 1 <span id="display-unit">Googol</span> Damage in <span id="display-time">58.1</span> Seconds?
    </div>
    <div id="arena">
        <div id="target"><div id="t-hp"></div></div>
        <div id="active-ball"></div>
    </div>
    <div id="bottom-damage">DAMAGE : 0</div>
</div>

<script>
// --- AUDIO SYSTEM ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, vol, decay) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + decay);
    osc.start();
    osc.stop(audioCtx.currentTime + decay);
}

const playClack = () => playSound(800, 'sine', 0.1, 0.05); // Wall Hit
const playThump = () => playSound(150, 'triangle', 0.5, 0.2); // Collision

// --- GAME LOGIC ---
let currentHP = 0n, timeLeft = 0, lastFrame = 0, gameRunning = false, totalDmg = 0n;
const ball = { x: 50, y: 50, dx: 0, dy: 0, type: 'mult', val: 2n, label: 'x2', color: 'red', radius: 30, pwr: 2n };
const target = { x: 200, y: 300, dx: 2, dy: 2, radius: 90 };

function updatePreview() {
    const tR = document.getElementById('slide-target').value;
    const bR = document.getElementById('slide-ball').value;
    const pt = document.getElementById('preview-target');
    const pb = document.getElementById('preview-ball');
    pt.style.width = pt.style.height = (tR * 2) + "px";
    pb.style.width = pb.style.height = (bR * 2) + "px";
    pb.style.background = ball.color; pb.innerText = ball.label;
}

function pick(el, type, val, label) {
    document.querySelectorAll('.ball-select').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    ball.type = type; ball.val = BigInt(val); ball.label = label; ball.color = el.style.backgroundColor;
    updatePreview();
}

function startGame() {
    const rawHP = document.getElementById('hp-input').value;
    currentHP = rawHP.includes('^') ? BigInt(rawHP.split('^')[0])**BigInt(rawHP.split('^')[1]) : BigInt(rawHP);
    timeLeft = parseFloat(document.getElementById('time-limit').value) * 1000;
    target.radius = parseInt(document.getElementById('slide-target').value);
    ball.radius = parseInt(document.getElementById('slide-ball').value);
    ball.pwr = ball.val || 1n; totalDmg = 0n;

    // Update Header
    document.getElementById('display-name').innerText = ball.label === '⚡' ? 'POWER' : 'DOUBLER';
    document.getElementById('display-val').innerText = ball.label;
    document.getElementById('display-time').innerText = (timeLeft/1000).toFixed(1);
    document.getElementById('display-unit').innerText = currentHP.toString().length > 50 ? "Googol" : "Quintillion";

    document.getElementById('target').style.width = document.getElementById('target').style.height = (target.radius * 2) + "px";
    document.getElementById('active-ball').style.width = document.getElementById('active-ball').style.height = (ball.radius * 2) + "px";
    document.getElementById('active-ball').style.background = ball.color;
    document.getElementById('active-ball').innerText = ball.label;

    document.getElementById('start-screen').classList.remove('active-screen');
    document.getElementById('game-screen').classList.add('active-screen');
    
    ball.dx = 8; ball.dy = 8;
    gameRunning = true; lastFrame = performance.now();
    updateHPDisplay();
    requestAnimationFrame(run);
}

function updateHPDisplay() {
    let s = currentHP.toString();
    const hpEl = document.getElementById('t-hp');
    hpEl.innerText = s; // Always full number wrapping
    hpEl.style.fontSize = Math.max(6, (target.radius / 8)) + "px";
    document.getElementById('bottom-damage').innerText = "DAMAGE : " + totalDmg.toString().substring(0,6);
}

function run(now) {
    if(!gameRunning) return;
    let dt = now - lastFrame; lastFrame = now;
    timeLeft -= dt;

    if(timeLeft <= 0 || currentHP <= 0n) {
        gameRunning = false;
        alert(currentHP <= 0n ? "CHALLENGE COMPLETE!" : "TIME EXPIRED");
        location.reload();
    }

    // TARGET MOTION
    target.x += target.dx; target.y += target.dy;
    if(target.x <= 0 || target.x >= (600-target.radius*2)) { target.dx *= -1; playClack(); }
    if(target.y <= 0 || target.y >= (600-target.radius*2)) { target.dy *= -1; playClack(); }
    document.getElementById('target').style.left = target.x + 'px';
    document.getElementById('target').style.top = target.y + 'px';

    // BALL MOTION
    ball.x += ball.dx; ball.y += ball.dy;
    if(ball.x <= 0 || ball.x >= (600-ball.radius*2)) { ball.dx *= -1; playClack(); }
    if(ball.y <= 0 || ball.y >= (600-ball.radius*2)) { ball.dy *= -1; playClack(); }

    // COLLISION
    let dx = (ball.x + ball.radius) - (target.x + target.radius);
    let dy = (ball.y + ball.radius) - (target.y + target.radius);
    let distance = Math.sqrt(dx*dx + dy*dy);
    
    if (distance < (ball.radius + target.radius)) {
        playThump();
        let dmg = ball.type==='mult' ? (ball.pwr || 1n) : currentHP/2n;
        if(ball.type==='mult' && ball.val > 0n) ball.pwr *= ball.val;
        
        currentHP -= dmg; totalDmg += dmg;
        if(currentHP < 0n) currentHP = 0n;
        updateHPDisplay();
        
        let nx = dx/distance, ny = dy/distance;
        let dot = ball.dx*nx + ball.dy*ny;
        ball.dx -= 2*dot*nx; ball.dy -= 2*dot*ny;
        ball.x += nx*10; ball.y += ny*10;
    }

    document.getElementById('active-ball').style.left = ball.x + 'px';
    document.getElementById('active-ball').style.top = ball.y + 'px';
    requestAnimationFrame(run);
}
updatePreview();
</script>
</body>
</html>

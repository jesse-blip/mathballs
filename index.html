<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Arena: Physics Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfaf0;
            --panel-bg: #ffffff;
            --border-main: 3px solid #000;
            --accent: #ffcc00;
            --hero-red: #d92d20;
            --target-gray: #cbcbcb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg);
            font-family: 'Roboto Condensed', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- SPLIT SETUP SCREEN --- */
        #setup-screen {
            display: flex;
            width: 1100px;
            height: 600px;
            background: var(--panel-bg);
            border: 8px solid #000;
            box-shadow: 20px 20px 0px rgba(0,0,0,0.8);
            z-index: 100;
        }

        .panel-side {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-center {
            width: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 4px solid #000;
            border-right: 4px solid #000;
            background: #eee;
        }

        /* Left Side: Rules */
        h2 { font-size: 2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; border-bottom: 4px solid #000; display: inline-block; }
        
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9rem; font-weight: 900; text-transform: uppercase; color: #555; }
        input[type="text"], input[type="number"] {
            padding: 10px; border: 3px solid #000; font-size: 1.2rem; font-weight: 900; font-family: 'Share Tech Mono', monospace;
        }
        
        .mode-tog { display: flex; gap: 10px; }
        .mode-btn { flex: 1; padding: 10px; background: #fff; border: 3px solid #000; font-weight: 900; cursor: pointer; }
        .mode-btn.active { background: var(--accent); transform:translateY(-2px); box-shadow: 0 3px 0 #000; }

        .ball-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .ball-opt { 
            aspect-ratio: 1/1; border-radius: 50%; border: 2px solid transparent; 
            display: flex; align-items: center; justify-content: center; 
            color: #fff; font-size: 12px; font-weight: 900; cursor: pointer; 
        }
        .ball-opt.selected { border-color: #000; transform: scale(1.15); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        /* Right Side: Physics Preview */
        .slider-group { display: flex; flex-direction: column; gap: 15px; }
        input[type="range"] { width: 100%; height: 15px; background: #ddd; accent-color: #000; }

        #preview-box {
            width: 350px; height: 350px;
            background: #fff; border: 2px solid #000;
            margin: 0 auto; position: relative;
            overflow: hidden;
        }
        
        /* Start Button */
        #btn-start {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            padding: 20px;
            background: #2ecc71;
            border: 4px solid #000;
            cursor: pointer;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            transition: 0.2s;
            height: 80%;
            width: 80%;
            display: flex; align-items: center; justify-content: center;
        }
        #btn-start:hover { transform: scale(1.05); box-shadow: 5px 5px 0 #000; }

        /* --- GAME ARENA --- */
        #game-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        
        #top-bar { 
            width: 800px; text-align: center; font-size: 2.2rem; font-weight: 900; 
            margin-bottom: 15px; text-transform: uppercase; line-height: 1; height: 60px;
        }

        #arena {
            width: 700px; height: 700px;
            background: #fff; border: var(--border-main);
            position: relative; overflow: hidden;
        }

        /* Balls */
        #target {
            position: absolute; background: var(--target-gray);
            border-radius: 50%; border: 1px solid #555;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
        }
        #target-text {
            color: #fff; font-weight: 900; text-align: center;
            text-shadow: 2px 2px 0 #000; padding: 10%;
            font-family: 'Share Tech Mono', monospace;
            overflow-wrap: break-word; /* Allows small numbers to wrap naturally */
            line-height: 0.9;
            width: 100%;
        }

        #hero {
            position: absolute; border-radius: 50%;
            border: 3px solid #000;
            display: flex; align-items: center; justify-content: center;
            color: #000; font-size: 40px; font-weight: 900;
            z-index: 10;
        }

        /* Effects */
        .dmg-float {
            position: absolute; font-size: 32px; font-weight: 900;
            color: #ff4757; -webkit-text-stroke: 1.5px #000;
            pointer-events: none; z-index: 50;
            word-break: break-all; width: 400px;
            animation: floatUp 1.5s ease-out forwards;
        }
        @keyframes floatUp { 0%{opacity:1; transform:scale(0.8);} 100%{opacity:0; transform:translateY(-120px) scale(1.1);} }

        .shard { position: absolute; border-radius: 50%; pointer-events: none; z-index: 20; }

        /* Stats */
        #stats-bar {
            width: 700px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;
        }
        .stat-card {
            background: #000; color: #fff; padding: 15px; border: 3px solid #000;
            display: flex; flex-direction: column; align-items: center;
        }
        .stat-head { font-size: 0.7rem; color: #aaa; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-num { font-size: 1.6rem; font-weight: 900; color: var(--accent); }

    </style>
</head>
<body>

<div id="setup-screen">
    <div class="panel-side">
        <h2>Game Rules</h2>
        
        <div class="mode-tog">
            <button id="btn-timer" class="mode-btn active" onclick="setMode('timer')">TIMER</button>
            <button id="btn-stop" class="mode-btn" onclick="setMode('stopwatch')">STOPWATCH</button>
        </div>

        <div class="control-group">
            <label>Target HP (Use ^ for exponents)</label>
            <input type="text" id="inp-hp" value="10^126">
        </div>

        <div class="control-group" id="grp-time">
            <label>Time Limit (Sec)</label>
            <input type="number" id="inp-time" value="60">
        </div>

        <div class="control-group">
            <label>Select Hero</label>
            <div id="hero-list" class="ball-grid"></div>
        </div>
    </div>

    <div class="panel-center">
        <button id="btn-start" onclick="launchGame()">START</button>
    </div>

    <div class="panel-side">
        <h2>Physics Lab</h2>
        <div class="slider-group">
            <label>Target Size: <span id="lbl-tr">180</span>px</label>
            <input type="range" id="sl-target" min="100" max="250" value="180" oninput="updatePreview()">
            
            <label>Hero Size: <span id="lbl-hr">60</span>px</label>
            <input type="range" id="sl-hero" min="30" max="100" value="60" oninput="updatePreview()">
        </div>
        
        <label style="margin-top:20px; display:block;">Arena Preview (1:2 Scale)</label>
        <div id="preview-box">
            <div id="prev-target" style="position:absolute; background:#cbcbcb; border:1px solid #555; border-radius:50%;"></div>
            <div id="prev-hero" style="position:absolute; border:2px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; color:#000;"></div>
        </div>
    </div>
</div>

<div id="game-view">
    <div id="top-bar"></div>
    <div id="arena">
        <div id="target"><div id="target-text"></div></div>
        <div id="hero"></div>
    </div>
    <div id="stats-bar">
        <div class="stat-card">
            <span class="stat-head">PREVIOUS HIT (ABBR)</span>
            <span id="val-last" class="stat-num">---</span>
        </div>
        <div class="stat-card">
            <span class="stat-head">NEXT HIT (ABBR)</span>
            <span id="val-next" class="stat-num">---</span>
        </div>
    </div>
</div>

<script>
/* --- CONFIGURATION & CONSTANTS --- */
const NAMES_L = ["", "Thousand", "Million", "Billion", "Trillion", "Quadrillion", "Quintillion", "Sextillion", "Septillion", "Octillion", "Nonillion", "Decillion", "Undecillion", "Duodecillion", "Tredecillion", "Quattuordecillion", "Quindecillion", "Sexdecillion", "Septendecillion", "Octodecillion", "Novemdecillion", "Vigintillion", "Unvigintillion", "Duovigintillion", "Tresvigintillion", "Quattuorvigintillion", "Quinvigintillion", "Sexvigintillion", "Septenvigintillion", "Octovigintillion", "Novemvigintillion", "Trigintillion", "Untrigintillion", "Duotrigintillion", "Trestrigintillion", "Quadragintillion", "Unquadragintillion", "Duoquadragintillion", "Tresquadragintillion", "Quattuorquadragintillion", "Quinquadragintillion", "Sexquadragintillion", "Septenquadragintillion", "Octoquadragintillion", "Novemquadragintillion", "Quinquagintillion", "Unquinquagintillion", "Duoquinquagintillion", "Tresquinquagintillion", "Quattuorquinquagintillion", "Quinquinquagintillion", "Sexquinquagintillion", "Septenquinquagintillion", "Octoquinquagintillion", "Novemquinquagintillion", "Sexagintillion", "Septuagintillion", "Octogintillion", "Nonagintillion", "Centillion"];
const NAMES_S = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Od", "Nd", "Vg", "Uvg", "Dvg", "Tvg", "Qvg", "Qivg", "Sxg", "Spg", "Ovg", "Nvg", "Tg", "Utg", "Dtg", "Ttg", "Qtg", "Uq", "Dq", "Tq", "Qq", "Qiq", "Sxq", "Spq", "Oq", "Nq", "Qing"];

const HEROES = [
    {n:"Rooter", t:"root", v:0n, l:"√", c:"#d92d20"},
    {n:"Doubler", t:"mult", v:2n, l:"2x", c:"#e67e22"},
    {n:"Tripler", t:"mult", v:3n, l:"3x", c:"#f1c40f"},
    {n:"Quadrupler", t:"mult", v:4n, l:"4x", c:"#2ecc71"},
    {n:"Quintupler", t:"mult", v:5n, l:"5x", c:"#1abc9c"},
    {n:"Sextupler", t:"mult", v:6n, l:"6x", c:"#3498db"},
    {n:"Septupler", t:"mult", v:7n, l:"7x", c:"#9b59b6"},
    {n:"Octupler", t:"mult", v:8n, l:"8x", c:"#34495e"},
    {n:"Squarer", t:"exp", v:2n, l:"x²", c:"#44bd32"},
    {n:"Cuber", t:"exp", v:3n, l:"x³", c:"#0097e6"},
    {n:"Halver", t:"half", v:0n, l:"x/2", c:"#7f8c8d"},
    {n:"Quarter", t:"quarter", v:0n, l:"x/4", c:"#2c3e50"},
    {n:"Reverser", t:"rev", v:0n, l:"x/y", c:"#8e44ad"},
    {n:"Fixed", t:"mult", v:100n, l:"+100", c:"#c0392b"},
    {n:"Maxer", t:"exp", v:10n, l:"x¹⁰", c:"#16a085"}
];

/* --- AUDIO ENGINE --- */
const AudioSys = {
    ctx: null,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    hit() { this.play(80, 'sine', 0.1, 0.3); },
    clack() { this.play(800, 'triangle', 0.05, 0.05); }, // High pitch short sound for walls
    boom() { this.play(50, 'sawtooth', 0.5, 0.8, 10); },
    play(freq, type, dur, vol, slide=0) {
        if(!this.ctx) this.init();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if(slide) o.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime+dur);
        g.gain.setValueAtTime(vol, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime+dur);
    }
};

/* --- STATE --- */
let game = {
    active: false, mode: 'timer', hp: 0n, initHP: 0n, time: 0, elapsed: 0, lastTime: 0,
    hero: { x:0, y:0, vx:0, vy:0, r:60, c:'#d92d20', label:'√', type:'root', val:0n, pwr:2n, name:'Rooter' },
    target: { x:0, y:0, vx:0, vy:0, r:180, mass:30 }
};

/* --- UI LOGIC --- */
function initUI() {
    const grid = document.getElementById('hero-list');
    HEROES.forEach((h, i) => {
        const d = document.createElement('div');
        d.className = `ball-opt ${i===0?'selected':''}`;
        d.style.background = h.c; d.innerText = h.l;
        d.onclick = () => {
            document.querySelectorAll('.ball-opt').forEach(b => b.classList.remove('selected'));
            d.classList.add('selected');
            game.hero.c = h.c; game.hero.label = h.l; game.hero.type = h.t;
            game.hero.val = h.v; game.hero.name = h.n;
            updatePreview();
        };
        grid.appendChild(d);
    });
    updatePreview();
}

function setMode(m) {
    game.mode = m;
    document.getElementById('btn-timer').className = m==='timer' ? 'mode-btn active' : 'mode-btn';
    document.getElementById('btn-stop').className = m==='stopwatch' ? 'mode-btn active' : 'mode-btn';
    document.getElementById('grp-time').style.display = m==='timer' ? 'flex' : 'none';
}

function updatePreview() {
    const tr = parseInt(document.getElementById('sl-target').value);
    const hr = parseInt(document.getElementById('sl-hero').value);
    
    document.getElementById('lbl-tr').innerText = tr;
    document.getElementById('lbl-hr').innerText = hr;

    const pt = document.getElementById('prev-target');
    const ph = document.getElementById('prev-hero');

    // Scale 1:2 means divide by 2
    pt.style.width = pt.style.height = (tr) + "px"; // (tr*2)/2 = tr
    pt.style.left = (175 - tr/2) + "px"; // Center in 350 box
    pt.style.top = (175 - tr/2) + "px";

    ph.style.width = ph.style.height = (hr) + "px";
    ph.style.backgroundColor = game.hero.c;
    ph.innerText = game.hero.label;
    ph.style.fontSize = (hr/2.5) + "px";
    ph.style.left = "20px"; ph.style.top = "20px";
}

/* --- FORMATTING --- */
function format(n, full) {
    if (n === 0n) return "0";
    let s = n.toString();
    if (s.length >= 127 && !full) return (n / 10n**BigInt(s.length-1)).toString() + "e" + (s.length-1);
    let tier = Math.floor((s.length - 1) / 3);
    let arr = full ? NAMES_L : NAMES_S;
    if (tier < arr.length) return (n / 10n**BigInt(tier * 3)) + " " + arr[tier];
    return (n / 10n**BigInt(s.length-1)).toString() + "e" + (s.length-1);
}

/* --- GAME LOOP --- */
function launchGame() {
    const raw = document.getElementById('inp-hp').value;
    try { game.hp = raw.includes('^') ? BigInt(raw.split('^')[0])**BigInt(raw.split('^')[1]) : BigInt(raw); } catch(e) { game.hp = 1000n; }
    game.initHP = game.hp;
    game.time = parseFloat(document.getElementById('inp-time').value) * 1000;
    game.elapsed = 0;
    
    game.target.r = parseInt(document.getElementById('sl-target').value);
    game.hero.r = parseInt(document.getElementById('sl-hero').value);

    // Initial Pos
    game.hero.x = 50; game.hero.y = 50;
    game.hero.vx = 12; game.hero.vy = 10;
    
    game.target.x = 350 - game.target.r; 
    game.target.y = 350 - game.target.r;
    game.target.vx = -4; game.target.vy = 3;

    // View Swap
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-view').style.display = 'flex';
    
    const h = document.getElementById('hero');
    h.style.backgroundColor = game.hero.c;
    h.innerText = game.hero.label;
    h.style.fontSize = (game.hero.r * 0.7) + "px";
    
    game.active = true;
    game.lastTime = performance.now();
    requestAnimationFrame(loop);
}

function calcDmg() {
    let d = 0n;
    if (game.hero.type === 'root') {
        let s = game.hp.toString();
        let rt = BigInt(Math.floor(Math.sqrt(Number(s.substring(0, 14))))) * 10n**BigInt(Math.max(0, s.length-14));
        d = game.hp - rt;
    } 
    else if (game.hero.type === 'mult' || game.hero.type === 'exp') d = game.hero.pwr;
    else if (game.hero.type === 'half') d = game.hp / 2n;
    else if (game.hero.type === 'quarter') d = (game.hp * 3n) / 4n;
    else if (game.hero.type === 'rev') d = game.hp - (game.hp / BigInt(game.hero.hits + 2));
    return d > 0n ? d : 1n;
}

function explode(x, y, color, isHero) {
    AudioSys.boom();
    const el = isHero ? document.getElementById('hero') : document.getElementById('target');
    el.style.display = 'none'; // DISAPPEAR INSTANTLY
    
    const arena = document.getElementById('arena');
    for(let i=0; i<60; i++) {
        const s = document.createElement('div');
        s.className = 'shard';
        const size = Math.random()*20+5;
        s.style.width = size+'px'; s.style.height = size+'px';
        s.style.background = color;
        s.style.left = x+'px'; s.style.top = y+'px';
        
        const angle = Math.random() * 6.28;
        const vel = Math.random() * 15 + 5;
        let vx = Math.cos(angle)*vel, vy = Math.sin(angle)*vel;
        let life = 1; let px=x, py=y;
        
        arena.appendChild(s);
        const anim = () => {
            if(life<=0){ s.remove(); return; }
            px+=vx; py+=vy; life-=0.02;
            s.style.left=px+'px'; s.style.top=py+'px'; s.style.opacity=life;
            requestAnimationFrame(anim);
        };
        anim();
    }
}

function loop(ts) {
    if(!game.active) return;
    const dt = (ts - game.lastTime); game.lastTime = ts;

    // Title Logic
    const head = document.getElementById('top-bar');
    const heroName = `<span style="color:${game.hero.c}">${game.hero.name}</span>`;
    const targetVal = format(game.initHP, true);
    
    if(game.mode === 'timer') {
        game.time -= dt;
        head.innerHTML = `Can ${heroName} deal ${targetVal} damage in <span style="color:red">${Math.max(0, game.time/1000).toFixed(1)}</span>s?`;
        if(game.time <= 0) {
            game.active = false;
            explode(game.hero.x+game.hero.r, game.hero.y+game.hero.r, game.hero.c, true);
            setTimeout(() => location.reload(), 2500); return;
        }
    } else {
        game.elapsed += dt;
        head.innerHTML = `How long for ${heroName} to deal ${targetVal}?<br>Time: ${(game.elapsed/1000).toFixed(1)}s`;
    }

    // Physics
    const b1 = game.hero; const b2 = game.target;
    b1.x += b1.vx; b1.y += b1.vy;
    b2.x += b2.vx; b2.y += b2.vy;

    // Walls (With Clack Sound)
    const sz = 700;
    const checkWall = (b) => {
        let hit = false;
        if(b.x < 0) { b.x = 0; b.vx *= -1; hit=true; }
        if(b.x > sz - b.r*2) { b.x = sz - b.r*2; b.vx *= -1; hit=true; }
        if(b.y < 0) { b.y = 0; b.vy *= -1; hit=true; }
        if(b.y > sz - b.r*2) { b.y = sz - b.r*2; b.vy *= -1; hit=true; }
        if(hit) AudioSys.clack();
    };
    checkWall(b1); checkWall(b2);

    // Visuals
    const hEl = document.getElementById('hero');
    const tEl = document.getElementById('target');
    const tTxt = document.getElementById('target-text');

    hEl.style.transform = `translate(${b1.x}px, ${b1.y}px)`;
    hEl.style.width = hEl.style.height = (b1.r*2)+"px";
    
    tEl.style.transform = `translate(${b2.x}px, ${b2.y}px)`;
    tEl.style.width = tEl.style.height = (b2.r*2)+"px";
    
    // Text Logic (Smart Wrap)
    const hpStr = game.hp.toString();
    tTxt.innerText = hpStr;
    const len = hpStr.length;
    // If small number, use moderate font, no wrapping tweaks needed
    // If large number, use dynamic shrink
    if (len < 10) {
        tTxt.style.fontSize = (b2.r * 0.8) + "px";
    } else {
        const dScale = (b2.r * 2.2) / Math.sqrt(len * 1.5);
        tTxt.style.fontSize = Math.min(dScale, b2.r * 0.6) + "px";
    }

    // Collision
    let dx = (b1.x + b1.r) - (b2.x + b2.r);
    let dy = (b1.y + b1.r) - (b2.y + b2.r);
    let dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < (b1.r + b2.r)) {
        AudioSys.hit();
        const dmg = calcDmg();
        
        // Damage Text (Raw String)
        const p = document.createElement('div');
        p.className = 'dmg-float'; p.innerText = dmg.toString();
        p.style.left = b1.x + "px"; p.style.top = b1.y + "px";
        document.getElementById('arena').appendChild(p);
        setTimeout(()=>p.remove(), 1500);

        game.hp = dmg >= game.hp ? 0n : game.hp - dmg;
        
        // Update Stats (Abbreviated)
        document.getElementById('val-last').innerText = format(dmg, false);
        
        // Power Up
        if(b1.type==='mult') b1.pwr *= b1.val;
        if(b1.type==='exp' && b1.pwr.toString().length < 500) b1.pwr = b1.pwr ** b1.val;
        b1.hits++;
        
        document.getElementById('val-next').innerText = format(calcDmg(), false);

        // Physics Response
        let nx = dx/dist, ny = dy/dist;
        let pV = 2 * (b1.vx*nx + b1.vy*ny - b2.vx*nx - b2.vy*ny) / (1 + b2.mass);
        b1.vx -= pV * b2.mass * nx; b1.vy -= pV * b2.mass * ny;
        b2.vx += pV * nx; b2.vy += pV * ny;
        
        let overlap = (b1.r + b2.r) - dist;
        b1.x += nx * (overlap+1); b1.y += ny * (overlap+1);

        if (game.hp <= 0n) {
            game.active = false;
            explode(b2.x+b2.r, b2.y+b2.r, '#999', false);
            setTimeout(() => location.reload(), 3000);
            return;
        }
    }

    requestAnimationFrame(loop);
}

initUI();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Ball Sandbox</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: monospace; text-align: center; padding-top: 50px; }
        .setup-box { background: #333; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: inline-block; }
        input { background: #000; color: #0f0; border: 1px solid #555; padding: 5px; width: 150px; text-align: center; }
        #damage-display { font-size: 2.5rem; color: #00ff00; margin: 20px; min-height: 80px; }
        .ball-row { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .ball { 
            width: 70px; height: 70px; border-radius: 50%; border: 3px solid white;
            background: #ff5722; color: white; cursor: pointer; font-weight: bold;
        }
        .ball:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }
        .error { color: red !important; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="setup-box">
        <label>TARGET HEALTH:</label><br>
        <input type="number" id="target-hp" value="1000000">
        <p style="font-size: 12px; color: #888;">(Change this before you start clicking)</p>
    </div>

    <div id="damage-display">LOADING ENGINE...</div>
    <div id="digit-count"></div>

    <div class="ball-row">
        <button class="ball" id="b2" py-click="hit(2)" disabled>2x</button>
        <button class="ball" id="b3" py-click="hit(3)" disabled>3x</button>
        <button class="ball" id="b4" py-click="hit(4)" disabled>4x</button>
        <button class="ball" id="b5" py-click="hit(5)" disabled>5x</button>
        <button class="ball" id="b6" py-click="hit(6)" disabled>6x</button>
    </div>

    <script type="py">
        from pyscript import document

        damage = 10

        def hit(multiplier):
            global damage
            
            # Get the target health from the input box
            try:
                target_hp = int(document.querySelector("#target-hp").value)
            except:
                target_hp = 1000000

            damage *= int(multiplier)
            d_str = str(damage)
            
            display = document.querySelector("#damage-display")
            count = document.querySelector("#digit-count")

            # Check if Big Ball is destroyed
            if damage >= target_hp:
                display.innerText = "DAMAGE: ERROR"
                display.classList.add("error")
                count.innerText = f"TARGET DESTROYED AT {len(d_str)} DIGITS"
            elif len(d_str) < 15:
                display.innerText = f"DAMAGE: {damage}"
                count.innerText = f"Health Remaining: {target_hp - damage}"
            else:
                display.innerText = f"DAMAGE: {d_str[:10]}..."
                count.innerText = f"TOTAL DIGITS: {len(d_str)}"

        # THIS FIXES THE "UNDEFINED" ERROR:
        # We only enable the buttons once the Python code is fully loaded
        for i in range(2, 7):
            document.querySelector(f"#b{i}").disabled = False
        
        document.querySelector("#damage-display").innerText = "DAMAGE: 10"
    </script>
</body>
</html>

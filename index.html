<!DOCTYPE html>
<html>
<head>
    <title>Math Simulation - Full Restoration</title>
    <style>
        :root { --bg: #1a1a1a; --panel: #2a2a2a; --text: #eee; }
        body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100vh; justify-content: center; }
        .active-screen { display: flex; }

        /* START SCREEN */
        .config-panel { background: var(--panel); padding: 30px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); width: 850px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; border: 1px solid #444; }
        .setup-side { display: flex; flex-direction: column; gap: 15px; }
        
        .preview-side { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; border-radius: 15px; border: 2px solid #444; position: relative; overflow: hidden; }
        #preview-target { position: absolute; background: #444; border-radius: 50%; border: 3px solid #666; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #888; }
        #preview-ball { position: absolute; border-radius: 50%; border: 2px solid #fff; }

        .ball-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 5px; }
        .ball-select { aspect-ratio: 1/1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; color: white; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; opacity: 0.5; transition: 0.2s; }
        .ball-select.selected { opacity: 1; border-color: white; transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.2); }

        .input-box { background: #333; border: 1px solid #555; color: white; padding: 8px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .start-btn { grid-column: span 2; padding: 18px; background: #4caf50; color: white; border: none; border-radius: 12px; font-size: 1.5rem; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .start-btn:hover { background: #66bb6a; transform: translateY(-2px); }

        /* GAME SCREEN */
        #timer-box { position: absolute; top: 20px; left: 20px; font-family: monospace; font-size: 3rem; font-weight: 900; background: #000; padding: 15px; border-radius: 12px; border: 2px solid #ff5722; color: #ff5722; text-shadow: 0 0 10px #ff5722; }
        #arena { width: 800px; height: 550px; background: #0a0a0a; border: 10px solid #333; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        
        #target { position: absolute; background: #444; border-radius: 50%; border: 4px solid #666; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; z-index: 2; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        #active-ball { position: absolute; border-radius: 50%; border: 2px solid #fff; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 3; }

        .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 5; }
        .dmg-popup { position: absolute; color: #ff3333; font-weight: 900; font-family: monospace; animation: fadeUp 1.2s forwards; white-space: nowrap; pointer-events: none; z-index: 10; font-size: 22px; text-shadow: 2px 2px #000; }
        @keyframes fadeUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-150px); } }
    </style>
</head>
<body>

<div id="start-screen" class="screen active-screen">
    <div class="config-panel">
        <div class="setup-side">
            <h2 style="margin:0; color:#4caf50;">BATTLE LAB</h2>
            <label>TARGET HEALTH: <input type="text" id="hp-input" class="input-box" value="10^100"></label>
            <label>TIMER (SEC): <input type="number" id="time-limit" class="input-box" value="30"></label>
            
            <div class="ball-grid">
                <div class="ball-select selected" style="background:#ff5722" onclick="pick(this,'mult',2,'2x')">2x</div>
                <div class="ball-select" style="background:#2196f3" onclick="pick(this,'mult',5,'5x')">5x</div>
                <div class="ball-select" style="background:#e91e63" onclick="pick(this,'mult',10,'10x')">10x</div>
                <div class="ball-select" style="background:#9c27b0" onclick="pick(this,'rooter',0,'√x')">√x</div>
                <div class="ball-select" style="background:#f44336" onclick="pick(this,'halver',0,'x/2')">x/2</div>
                <div class="ball-select" style="background:#ff9800" onclick="pick(this,'quarter',0,'x/4')">x/4</div>
                <div class="ball-select" style="background:#009688" onclick="pick(this,'reverser',0,'x/y')">x/y</div>
            </div>

            <label>TARGET SIZE: <input type="range" min="30" max="180" value="70" id="slide-target" oninput="updatePreview()"></label>
            <label>BALL SIZE: <input type="range" min="10" max="80" value="25" id="slide-ball" oninput="updatePreview()"></label>
        </div>

        <div class="preview-side" id="p-box">
            <div id="preview-target">HP</div>
            <div id="preview-ball"></div>
        </div>

        <button class="start-btn" onclick="startGame()">START RUN</button>
    </div>
</div>

<div id="game-screen" class="screen">
    <div id="timer-box">00.000</div>
    <div id="arena">
        <div id="target"><div id="t-hp"></div></div>
        <div id="active-ball"></div>
    </div>
    <button style="margin-top:20px; background:none; border:1px solid #555; color:#888; cursor:pointer;" onclick="location.reload()">ABORT RUN</button>
</div>

<script>
let currentHP = 0n, timeLeft = 0, lastFrame = 0, gameRunning = false;
const ball = { x: 50, y: 50, dx: 0, dy: 0, type: 'mult', val: 2n, label: '2x', color: '#ff5722', radius: 25, hitCount: 1n, pwr: 2n };
const target = { x: 300, y: 200, dx: 2, dy: 2, radius: 70 };

function updatePreview() {
    const tR = document.getElementById('slide-target').value;
    const bR = document.getElementById('slide-ball').value;
    const pt = document.getElementById('preview-target');
    const pb = document.getElementById('preview-ball');
    pt.style.width = pt.style.height = (tR * 2) + "px";
    pb.style.width = pb.style.height = (bR * 2) + "px";
    pb.style.background = ball.color;
    pb.style.left = "20px";
}

function pick(el, type, val, label) {
    document.querySelectorAll('.ball-select').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    ball.type = type; ball.val = BigInt(val); ball.label = label; ball.color = el.style.backgroundColor;
    updatePreview();
}

function parseInput(i) { return i.includes('^') ? BigInt(i.split('^')[0])**BigInt(i.split('^')[1]) : BigInt(i); }

function explode(x, y, color) {
    for(let i=0; i<40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.background = color;
        p.style.width = p.style.height = Math.random()*12+"px";
        p.style.left = x+"px"; p.style.top = y+"px";
        const angle = Math.random()*Math.PI*2, dist = 50 + Math.random()*150;
        document.getElementById('arena').appendChild(p);
        p.animate([{transform:'translate(0,0) scale(1)', opacity:1}, {transform:`translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity:0}], {duration: 1000, easing: 'ease-out'});
        setTimeout(()=>p.remove(), 1000);
    }
}

function startGame() {
    currentHP = parseInput(document.getElementById('hp-input').value);
    timeLeft = parseFloat(document.getElementById('time-limit').value) * 1000;
    target.radius = parseInt(document.getElementById('slide-target').value);
    ball.radius = parseInt(document.getElementById('slide-ball').value);
    ball.pwr = ball.val; ball.hitCount = 1n;

    document.getElementById('target').style.width = document.getElementById('target').style.height = (target.radius * 2) + "px";
    document.getElementById('active-ball').style.width = document.getElementById('active-ball').style.height = (ball.radius * 2) + "px";
    document.getElementById('active-ball').style.background = ball.color;
    document.getElementById('active-ball').innerText = ball.label;

    document.getElementById('start-screen').classList.remove('active-screen');
    document.getElementById('game-screen').classList.add('active-screen');
    
    let angle = Math.random()*Math.PI*2;
    ball.dx = Math.cos(angle)*10; ball.dy = Math.sin(angle)*10;
    gameRunning = true; lastFrame = performance.now();
    updateHPDisplay();
    requestAnimationFrame(run);
}

function updateHPDisplay() {
    let s = currentHP.toString();
    document.getElementById('t-hp').innerText = s.length > 15 ? "10^"+(s.length-1) : s;
    if(currentHP <= 0n && gameRunning) {
        gameRunning = false;
        explode(target.x + target.radius, target.y + target.radius, '#666');
        document.getElementById('target').style.opacity = '0';
        setTimeout(() => alert("TARGET OBLITERATED"), 100);
    }
}

function bigIntSqrt(v) {
    if(v<2n) return v;
    let x = v/2n + 1n, y = (x+v/x)/2n;
    while(y<x){x=y;y=(x+v/x)/2n;} return x;
}

function run(now) {
    if(!gameRunning) return;
    let dt = now - lastFrame; lastFrame = now;
    timeLeft -= dt;

    if(timeLeft <= 0) {
        gameRunning = false; timeLeft = 0;
        explode(ball.x + ball.radius, ball.y + ball.radius, ball.color);
        document.getElementById('active-ball').style.opacity = '0';
        setTimeout(() => alert("TIME EXPIRED - FAILURE"), 100);
    }

    document.getElementById('timer-box').innerText = (timeLeft/1000).toFixed(3);

    target.x += target.dx; target.y += target.dy;
    if(target.x <= 0 || target.x >= (800-target.radius*2)) target.dx *= -1;
    if(target.y <= 0 || target.y >= (550-target.radius*2)) target.dy *= -1;
    document.getElementById('target').style.left = target.x + 'px';
    document.getElementById('target').style.top = target.y + 'px';

    ball.x += ball.dx; ball.y += ball.dy;
    if(ball.x <= 0 || ball.x >= (800-ball.radius*2)) ball.dx *= -1;
    if(ball.y <= 0 || ball.y >= (550-ball.radius*2)) ball.dy *= -1;

    let dx = (ball.x + ball.radius) - (target.x + target.radius);
    let dy = (ball.y + ball.radius) - (target.y + target.radius);
    let distance = Math.sqrt(dx*dx + dy*dy);
    
    if (distance < (ball.radius + target.radius)) {
        let dmg = 0n;
        if(ball.type==='mult'){ dmg = ball.pwr; ball.pwr *= ball.val; }
        else if(ball.type==='halver') dmg = currentHP - (currentHP/2n);
        else if(ball.type==='quarter') dmg = currentHP - (currentHP/4n);
        else if(ball.type==='reverser') { dmg = currentHP - (currentHP/(ball.hitCount+1n)); ball.hitCount++; }
        else if(ball.type==='rooter') dmg = (currentHP<=1n)?currentHP : currentHP - bigIntSqrt(currentHP);

        const pop = document.createElement('div');
        pop.className = 'dmg-popup'; pop.innerText = "-" + dmg.toString();
        pop.style.left = ball.x + "px"; pop.style.top = ball.y + "px";
        document.getElementById('arena').appendChild(pop);
        setTimeout(()=>pop.remove(), 1200);

        currentHP -= dmg; if(currentHP < 0n) currentHP = 0n;
        updateHPDisplay();
        
        let nx = dx/distance, ny = dy/distance;
        let dot = ball.dx*nx + ball.dy*ny;
        ball.dx -= 2*dot*nx; ball.dy -= 2*dot*ny;
        ball.x += nx*10; ball.y += ny*10;
    }

    document.getElementById('active-ball').style.left = ball.x + 'px';
    document.getElementById('active-ball').style.top = ball.y + 'px';
    requestAnimationFrame(run);
}
updatePreview();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Math Simulation Fix</title>
    <style>
        body { background: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        #stats { text-align: center; margin-bottom: 10px; }
        #dmg-display { font-size: 2.5rem; font-weight: bold; color: #333; margin: 5px; }
        #arena { width: 400px; height: 400px; background: white; border: 10px solid #222; position: relative; overflow: hidden; }
        #target { position: absolute; width: 100px; height: 100px; background: #bbb; border-radius: 50%; border: 4px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; text-align: center; }
        #active-ball { position: absolute; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #000; color: white; font-weight: bold; display: none; align-items: center; justify-content: center; font-size: 11px; text-align: center; }
        #menu { margin-top: 20px; display: flex; gap: 10px; padding: 10px; background: #333; border-radius: 8px; }
        .menu-btn { width: 50px; height: 50px; border-radius: 50%; cursor: pointer; border: 2px solid white; color: white; font-weight: bold; }
        input { padding: 5px; text-align: center; width: 200px; border: 2px solid #333; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>

<div id="stats">
    TARGET HP: <input type="text" id="hp-input" value="1000000000000">
    <div id="dmg-display">TOTAL DAMAGE: 0</div>
</div>

<div id="arena">
    <div id="target">
        <div>BIG BALL</div>
        <div id="t-hp">HP: 1T</div>
    </div>
    <div id="active-ball"></div>
</div>

<div id="menu">
    <button class="menu-btn" style="background:#ff5722" onclick="setBall(2, '#ff5722')">2x</button>
    <button class="menu-btn" style="background:#2196f3" onclick="setBall(3, '#2196f3')">3x</button>
    <button class="menu-btn" style="background:#4caf50" onclick="setBall(4, '#4caf50')">4x</button>
    <button class="menu-btn" style="background:#ffeb3b; color:black" onclick="setBall(5, '#ffeb3b')">5x</button>
    <button class="menu-btn" style="background:#9c27b0" onclick="setBall(6, '#9c27b0')">6x</button>
</div>

<script>
let totalDamage = 0n;
const target = { x: 150, y: 150, dx: 1.8, dy: 1.8, radius: 50 };
const ball = { x: 0, y: 0, dx: 0, dy: 0, active: false, currentPower: 0n, multiplier: 0n, radius: 25 };

function setBall(m, color) {
    ball.active = true;
    ball.multiplier = BigInt(m);
    ball.currentPower = BigInt(m);
    ball.x = 10; ball.y = 10;
    ball.dx = 5; ball.dy = 5;
    const el = document.getElementById('active-ball');
    el.style.display = 'flex';
    el.style.background = color;
    updateBallText();
}

function updateBallText() {
    const el = document.getElementById('active-ball');
    let pStr = ball.currentPower.toString();
    el.innerText = pStr.length > 5 ? "10^" + pStr.length : pStr;
}

function run() {
    // Move Big Ball
    target.x += target.dx; target.y += target.dy;
    if(target.x <= 0 || target.x >= 300) target.dx *= -1;
    if(target.y <= 0 || target.y >= 300) target.dy *= -1;
    
    const tEl = document.getElementById('target');
    tEl.style.left = target.x + 'px';
    tEl.style.top = target.y + 'px';

    if(ball.active) {
        ball.x += ball.dx; ball.y += ball.dy;
        
        // Wall Bounces
        if(ball.x <= 0 || ball.x >= 350) ball.dx *= -1;
        if(ball.y <= 0 || ball.y >= 350) ball.dy *= -1;

        // --- FIXED COLLISION LOGIC ---
        let bcX = ball.x + ball.radius; // Ball Center X
        let bcY = ball.y + ball.radius; // Ball Center Y
        let tcX = target.x + target.radius; // Target Center X
        let tcY = target.y + target.radius; // Target Center Y

        let dx = bcX - tcX;
        let dy = bcY - tcY;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let minDistance = ball.radius + target.radius;

        if (distance < minDistance) {
            // 1. Multiply Damage
            totalDamage += ball.currentPower;
            ball.currentPower *= ball.multiplier;
            updateBallText();

            // 2. Calculate Reflection Vector (Bounce angle)
            let nx = dx / distance; // Normal X
            let ny = dy / distance; // Normal Y

            // Dot product to reflect velocity
            let dot = ball.dx * nx + ball.dy * ny;
            ball.dx = (ball.dx - 2 * dot * nx);
            ball.dy = (ball.dy - 2 * dot * ny);

            // 3. THE FIX: Reposition ball outside the Big Ball so it doesn't get stuck
            let overlap = minDistance - distance;
            ball.x += nx * (overlap + 1); 
            ball.y += ny * (overlap + 1);

            // Update UI
            const dStr = totalDamage.toString();
            document.getElementById('dmg-display').innerText = "TOTAL DAMAGE: " + (dStr.length > 15 ? "10^" + dStr.length : dStr);
            
            const targetMaxHP = BigInt(document.getElementById('hp-input').value.replace(/,/g, ''));
            let remaining = targetMaxHP - totalDamage;
            document.getElementById('t-hp').innerText = "HP: " + (remaining > 0n ? remaining.toLocaleString() : "0");
        }

        const bEl = document.getElementById('active-ball');
        bEl.style.left = ball.x + 'px';
        bEl.style.top = ball.y + 'px';
    }
    requestAnimationFrame(run);
}
run();
</script>
</body>
</html>

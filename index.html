<!DOCTYPE html>
<html>
<head>
    <title>Math Simulation - Full Physics</title>
    <style>
        body { background: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #stats { text-align: center; margin-bottom: 15px; }
        #dmg-display { font-size: 3rem; font-weight: 900; color: #222; margin: 5px; min-height: 60px; font-family: monospace; }

        /* The Box Perimeters */
        #arena { 
            width: 450px; height: 450px; background: white; 
            border: 12px solid #222; position: relative; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* The Big Ball (Target) */
        #target {
            position: absolute; width: 110px; height: 110px; background: #cccccc; 
            border-radius: 50%; border: 5px solid #444; display: flex; 
            align-items: center; justify-content: center; font-weight: bold; 
            text-align: center; font-size: 16px; padding: 10px; box-sizing: border-box;
            word-break: break-all; transition: background 0.1s;
        }

        /* The Damage Ball */
        #active-ball {
            position: absolute; width: 55px; height: 55px; border-radius: 50%; 
            border: 3px solid #000; color: white; font-weight: bold; 
            display: none; align-items: center; justify-content: center; font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Bottom Menu */
        #menu { margin-top: 25px; display: flex; gap: 12px; padding: 15px; background: #333; border-radius: 12px; }
        .menu-btn { 
            width: 60px; height: 60px; border-radius: 50%; cursor: pointer; 
            border: 2px solid white; color: white; font-weight: bold; font-size: 16px;
            transition: transform 0.1s;
        }
        .menu-btn:active { transform: scale(0.9); }

        input { 
            padding: 8px; text-align: center; width: 280px; border: 3px solid #333; 
            border-radius: 6px; font-family: monospace; font-size: 1.2rem; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="stats">
    <input type="text" id="hp-input" value="1000000000000" oninput="manualReset()">
    <div id="dmg-display">0</div>
</div>

<div id="arena">
    <div id="target">
        <div id="t-hp">1,000,000,000,000</div>
    </div>
    <div id="active-ball"></div>
</div>

<div id="menu">
    <button class="menu-btn" style="background:#ff5722" onclick="setBall(2, '#ff5722')">2x</button>
    <button class="menu-btn" style="background:#2196f3" onclick="setBall(3, '#2196f3')">3x</button>
    <button class="menu-btn" style="background:#4caf50" onclick="setBall(4, '#4caf50')">4x</button>
    <button class="menu-btn" style="background:#ffeb3b; color:black" onclick="setBall(5, '#ffeb3b')">5x</button>
    <button class="menu-btn" style="background:#9c27b0" onclick="setBall(6, '#9c27b0')">6x</button>
</div>

<script>
// --- CORE DATA ---
let totalDamage = 0n;
const ballSpeed = 7.5;
const targetObj = { x: 170, y: 170, dx: 1.5, dy: 1.5, radius: 55 };
const ballObj = { x: 0, y: 0, dx: 0, dy: 0, active: false, currentPower: 0n, multiplier: 0n, radius: 27.5 };

// --- RESET LOGIC ---
function manualReset() {
    totalDamage = 0n;
    document.getElementById('dmg-display').innerText = "0";
    targetObj.x = 170;
    targetObj.y = 170;
    targetObj.dx = 1.5;
    targetObj.dy = 1.5;
    updateHPDisplay(getTargetMaxHP());
}

function getTargetMaxHP() {
    const val = document.getElementById('hp-input').value.replace(/,/g, '');
    try { return BigInt(val); } catch(e) { return 0n; }
}

function updateHPDisplay(val) {
    let s = val.toString();
    document.getElementById('t-hp').innerText = s.length > 14 ? "10^" + s.length : val.toLocaleString();
}

// --- BALL SELECTOR ---
function setBall(m, color) {
    manualReset(); // Hard reset on new ball choice
    
    ballObj.active = true;
    ballObj.multiplier = BigInt(m);
    ballObj.currentPower = BigInt(m);
    ballObj.x = 30; 
    ballObj.y = 30;
    
    // Initial Random Direction
    let angle = Math.random() * Math.PI * 2;
    ballObj.dx = Math.cos(angle) * ballSpeed;
    ballObj.dy = Math.sin(angle) * ballSpeed;
    
    const el = document.getElementById('active-ball');
    el.style.display = 'flex';
    el.style.background = color;
    el.innerText = m + "x";
    
    document.getElementById('dmg-display').innerText = ballObj.currentPower.toString();
}

// --- PHYSICS ENGINE ---
function run() {
    // 1. Move Big Ball
    targetObj.x += targetObj.dx;
    targetObj.y += targetObj.dy;

    // Arena Bounds for Big Ball (450 - 110 = 340)
    if(targetObj.x <= 0 || targetObj.x >= 340) targetObj.dx *= -1;
    if(targetObj.y <= 0 || targetObj.y >= 340) targetObj.dy *= -1;
    
    const tEl = document.getElementById('target');
    tEl.style.left = targetObj.x + 'px';
    tEl.style.top = targetObj.y + 'px';

    if(ballObj.active) {
        ballObj.x += ballObj.dx;
        ballObj.y += ballObj.dy;
        
        // Arena Bounds for Damage Ball (450 - 55 = 395)
        if(ballObj.x <= 0 || ballObj.x >= 395) ballObj.dx *= -1;
        if(ballObj.y <= 0 || ballObj.y >= 395) ballObj.dy *= -1;

        // Circle-to-Circle Collision Math
        let bcX = ballObj.x + ballObj.radius;
        let bcY = ballObj.y + ballObj.radius;
        let tcX = targetObj.x + targetObj.radius;
        let tcY = targetObj.y + targetObj.radius;

        let dx = bcX - tcX;
        let dy = bcY - tcY;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let minDistance = ballObj.radius + targetObj.radius;

        if (distance < minDistance) {
            // MATH: Update Damage and decrease HP
            let currentHitValue = ballObj.currentPower;
            totalDamage = currentHitValue; // Using the power as the display value

            const maxHP = getTargetMaxHP();
            let remaining = maxHP - currentHitValue;
            updateHPDisplay(remaining > 0n ? remaining : 0n);

            // Display current power (2, 4, 8 sequence)
            let pStr = currentHitValue.toString();
            document.getElementById('dmg-display').innerText = pStr.length > 15 ? "10^" + pStr.length : pStr;

            // Prepare for next hit
            ballObj.currentPower = ballObj.currentPower * ballObj.multiplier;

            // PHYSICS: Impact Vectors
            let nx = dx / distance; 
            let ny = dy / distance; 

            // Influence Big Ball Direction (Permanently)
            targetObj.dx -= nx * 1.8; 
            targetObj.dy -= ny * 1.8;

            // Reflect Small Ball
            let dot = ballObj.dx * nx + ballObj.dy * ny;
            ballObj.dx = (ballObj.dx - 2 * dot * nx);
            ballObj.dy = (ballObj.dy - 2 * dot * ny);
            
            // Randomize bounce angle slightly
            let angleShift = (Math.random() - 0.5) * 0.4;
            let newAngle = Math.atan2(ballObj.dy, ballObj.dx) + angleShift;
            ballObj.dx = Math.cos(newAngle) * ballSpeed;
            ballObj.dy = Math.sin(newAngle) * ballSpeed;

            // ANTI-STUCK: Teleport out of overlap
            let overlap = minDistance - distance;
            ballObj.x += nx * (overlap + 3); 
            ballObj.y += ny * (overlap + 3);
        }

        const bEl = document.getElementById('active-ball');
        bEl.style.left = ballObj.x + 'px';
        bEl.style.top = ballObj.y + 'px';
    }
    requestAnimationFrame(run);
}

run();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Square Arena: Max Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f1efdb; --red: #cc0000; --gold: #ffcc00; --gray: #cccccc; }
        * { box-sizing: border-box; font-family: 'Roboto Condensed', sans-serif; }
        body { background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        .lab-ui { background: white; border: 6px solid #000; padding: 25px; width: 950px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; box-shadow: 12px 12px 0px #000; }
        .setup-col { display: flex; flex-direction: column; gap: 8px; }
        .preview-col { background: #ddd; border: 4px dashed #888; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* THE FULL GRID */
        .ball-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
        .ball-opt { aspect-ratio: 1/1; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 11px; border: 2px solid rgba(0,0,0,0.2); transition: 0.1s; text-align: center; }
        .ball-opt.active { border: 4px solid #000; transform: scale(1.1); }

        .btn-start { grid-column: span 2; padding: 15px; background: var(--gold); border: 6px solid #000; font-size: 2rem; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100vh; justify-content: center; }
        .active { display: flex; }

        .header { text-align: center; font-size: 2.2rem; width: 600px; margin-bottom: 15px; line-height: 1.1; text-transform: uppercase; }
        #arena { width: 600px; height: 600px; background: #fff; border: 10px solid #000; position: relative; overflow: hidden; }
        
        #big-ball { position: absolute; background: var(--gray); border-radius: 50%; border: 2px solid #555; display: flex; align-items: center; justify-content: center; z-index: 2; overflow: hidden; }
        #hp-txt { color: #fff; font-weight: 900; font-family: monospace; word-break: break-all; line-height: 0.8; padding: 10px; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000; }
        #tiny-ball { position: absolute; border-radius: 50%; border: 4px solid #000; color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; z-index: 3; text-shadow: 2px 2px 0px #000; font-size: 20px; }
        
        .stats-bar { width: 600px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-box { background: #000; color: var(--gold); padding: 10px; text-align: center; border: 4px solid #000; font-weight: 900; }
        .stat-label { font-size: 0.8rem; color: #fff; display: block; margin-bottom: 2px; }
        .stat-val { font-size: 1.4rem; white-space: nowrap; overflow: hidden; }

        .particle { position: absolute; border-radius: 50%; pointer-events: none; }
        /* RED DAMAGE TEXT */
        .dmg-pop { position: absolute; font-weight: 900; pointer-events: none; z-index: 10; -webkit-text-stroke: 1.5px #000; animation: floatUp 1.2s forwards; font-size: 28px; word-break: break-all; max-width: 400px; text-align: center; color: #ff0000 !important; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-180px); } }
    </style>
</head>
<body>

<div id="screen-lab" class="screen active">
    <div class="lab-ui">
        <div class="setup-col">
            <h1>SQUARE ARENA</h1>
            <label>HP TARGET</label>
            <input type="text" id="in-hp" style="width:100%; padding:8px; border:4px solid #000;" value="10^100">
            <label>SECONDS</label>
            <input type="number" id="in-time" style="width:100%; padding:8px; border:4px solid #000;" value="58.1">
            
            <div class="ball-grid">
                <div class="ball-opt active" data-name="Doubler" style="background:#ff0000" onclick="sel(this,'mult',2,'x2')">x2</div>
                <div class="ball-opt" data-name="Tripler" style="background:#ff5500" onclick="sel(this,'mult',3,'x3')">x3</div>
                <div class="ball-opt" data-name="Quadrupler" style="background:#ffaa00" onclick="sel(this,'mult',4,'x4')">x4</div>
                <div class="ball-opt" data-name="Quintupler" style="background:#00ccff" onclick="sel(this,'mult',5,'x5')">x5</div>
                <div class="ball-opt" data-name="Sextupler" style="background:#0066ff" onclick="sel(this,'mult',6,'x6')">x6</div>
                <div class="ball-opt" data-name="Septupler" style="background:#00ff00" onclick="sel(this,'mult',7,'x7')">x7</div>
                <div class="ball-opt" data-name="Octupler" style="background:#55ff00" onclick="sel(this,'mult',8,'x8')">x8</div>
                <div class="ball-opt" data-name="Nonupler" style="background:#aaff00" onclick="sel(this,'mult',9,'x9')">x9</div>
                <div class="ball-opt" data-name="Decupler" style="background:#ffff00; color:#000" onclick="sel(this,'mult',10,'x10')">x10</div>
                <div class="ball-opt" data-name="Rooter" style="background:#000000" onclick="sel(this,'root',0,'√x')">√x</div>
                <div class="ball-opt" data-name="Squared" style="background:#ff00ff" onclick="sel(this,'exp',2,'x²')">x²</div>
                <div class="ball-opt" data-name="Cubed" style="background:#800080" onclick="sel(this,'exp',3,'x³')">x³</div>
                <div class="ball-opt" data-name="Halver" style="background:#777777" onclick="sel(this,'half',0,'x/2')">x/2</div>
                <div class="ball-opt" data-name="Quarter" style="background:#444444" onclick="sel(this,'quarter',0,'x/4')">x/4</div>
                <div class="ball-opt" data-name="Reverser" style="background:#6600ff" onclick="sel(this,'rev',0,'x/y')">x/y</div>
            </div>
            
            <label>BIG R</label><input type="range" min="50" max="240" value="120" id="sz-t" oninput="pre()">
            <label>PLAYER R</label><input type="range" min="15" max="80" value="40" id="sz-b" oninput="pre()">
        </div>
        <div class="preview-col"><div id="pre-t" style="background:#ccc; border-radius:50%"></div><div id="pre-b" style="border-radius:50%; border:3px solid #000; position:absolute;"></div></div>
        <button class="btn-start" onclick="go()">START</button>
    </div>
</div>

<div id="screen-game" class="screen">
    <div id="h-main" class="header"></div>
    <div id="arena">
        <div id="big-ball"><div id="hp-txt"></div></div>
        <div id="tiny-ball"></div>
    </div>
    <div class="stats-bar">
        <div class="stat-box"><span class="stat-label">LAST HIT</span><div id="last-hit-val" class="stat-val">---</div></div>
        <div class="stat-box"><span class="stat-label">NEXT HIT</span><div id="next-hit-val" class="stat-val">0</div></div>
    </div>
</div>

<script>
let hp = 0n, gameTime = 0, last = 0, running = false;
const p = { x: 50, y: 50, dx: 0, dy: 0, r: 40, type: 'mult', val: 2n, lbl: 'x2', col: '#ff0000', pwr: 2n, hits: 1n, name: "Doubler" };
const t = { x: 250, y: 250, dx: 0, dy: 0, r: 120, mass: 6 };

const SHORTS = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Od", "Nd", "Vg", "Uvg", "Dvg", "Tvg", "Qvg", "Qivg", "Sxg", "Spg", "Ovg", "Nvg", "Tg", "Utg", "Dtg", "Ttg"];
const FULLS = ["", "Thousand", "Million", "Billion", "Trillion", "Quadrillion", "Quintillion", "Sextillion", "Septillion", "Octillion", "Nonillion", "Decillion", "Undecillion", "Duodecillion", "Tredecillion", "Quattuordecillion", "Quindecillion", "Sexdecillion", "Septendecillion", "Octodecillion", "Novemdecillion", "Vigintillion", "Unvigintillion", "Duovigintillion", "Tresvigintillion", "Quattuorvigintillion", "Quinvigintillion", "Sexvigintillion", "Septenvigintillion", "Octovigintillion", "Novemvigintillion", "Trigintillion", "Untrigintillion", "Duotrigintillion", "Trestrigintillion"];

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, vol, duration) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

// SPACING ADDED IN ABBREVIATIONS
function formatAbbr(n) {
    if (n === 0n) return "0";
    const s = n.toString();
    if (s.length >= 101) return (n / 10n**100n) + " Ggl";
    let tier = Math.floor((s.length - 1) / 3);
    if (tier < 1) return s;
    return (n / 10n**BigInt(tier * 3)) + " " + SHORTS[tier];
}

// FULL NAMES FOR TITLE
function formatFull(n) {
    if (n === 0n) return "0";
    const s = n.toString();
    if (s.length >= 101) return (n / 10n**100n) + " Googol";
    let tier = Math.floor((s.length - 1) / 3);
    if (tier < 1) return s;
    return (n / 10n**BigInt(tier * 3)) + " " + FULLS[tier];
}

function sel(el, type, val, lbl) {
    document.querySelectorAll('.ball-opt').forEach(b => b.classList.remove('active'));
    el.classList.add('active'); 
    p.type = type; 
    p.val = BigInt(val); 
    p.lbl = lbl; 
    p.col = el.style.backgroundColor; 
    p.name = el.getAttribute('data-name'); 
    pre();
}

function pre() {
    const tr = document.getElementById('sz-t').value, br = document.getElementById('sz-b').value;
    const pt = document.getElementById('pre-t'), pb = document.getElementById('pre-b');
    pt.style.width = pt.style.height = (tr*2)+"px"; pb.style.width = pb.style.height = (br*2)+"px";
    pb.style.background = p.col; pb.innerText = p.lbl;
}

function getNextDmg() {
    if(hp <= 0n) return 0n;
    let d = 0n;
    if(p.type==='mult' || p.type==='exp') d = p.pwr;
    else if(p.type==='half') d = hp / 2n;
    else if(p.type==='quarter') d = (hp * 3n) / 4n; // Corrected: Deals 75%
    else if(p.type==='root') {
        let s = hp.toString();
        let rootVal = BigInt(Math.floor(Math.sqrt(Number(s.substring(0,14))))) * 10n**BigInt(Math.max(0, s.length-14));
        d = hp - rootVal; // Deals current HP minus the root result
    }
    else if(p.type==='rev') d = hp - (hp / (p.hits + 1n));
    
    // MERCY FINISHER: Allows halver/quarter to kill 1hp ball
    if (d === 0n && hp > 0n) return 1n;
    return d;
}

function go() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const rawHp = document.getElementById('in-hp').value;
    hp = rawHp.includes('^') ? BigInt(rawHp.split('^')[0])**BigInt(rawHp.split('^')[1]) : BigInt(rawHp);
    gameTime = parseFloat(document.getElementById('in-time').value)*1000;
    
    // RANDOM DIRECTIONS
    const pAng = Math.random() * Math.PI * 2;
    p.dx = Math.cos(pAng) * 14; p.dy = Math.sin(pAng) * 14;
    const tAng = Math.random() * Math.PI * 2;
    t.dx = Math.cos(tAng) * 4; t.dy = Math.sin(tAng) * 4;

    t.r = parseInt(document.getElementById('sz-t').value); p.r = parseInt(document.getElementById('sz-b').value);
    
    // Reset Power
    if(p.type === 'exp') p.pwr = 2n;
    else p.pwr = p.val || 1n;
    
    p.hits = 1n; running = true;

    const h = document.getElementById('h-main');
    h.innerHTML = `CAN <span style="color:${p.col}">${p.name.toUpperCase()}</span> ${p.lbl} DEAL ${formatFull(hp).toUpperCase()}? [<span id="timer-val">0.0</span>s]`;

    document.getElementById('tiny-ball').style.background = p.col;
    document.getElementById('tiny-ball').innerText = p.lbl;
    document.getElementById('next-hit-val').innerText = formatAbbr(getNextDmg());
    
    document.getElementById('screen-lab').classList.remove('active');
    document.getElementById('screen-game').classList.add('active');
    last = performance.now();
    loop();
}

function loop() {
    if(!running) return;
    const now = performance.now(), dt = now - last; last = now;
    gameTime -= dt;
    if (gameTime <= 0) { end(false); return; }
    if (hp <= 0n) { end(true); return; }

    document.getElementById('timer-val').innerText = (gameTime/1000).toFixed(1);

    // Big Ball Move
    t.x += t.dx; t.y += t.dy;
    if (t.x <= 0 || t.x >= 600 - t.r*2) { t.dx *= -1; t.x = t.x <= 0 ? 0 : 600 - t.r*2; }
    if (t.y <= 0 || t.y >= 600 - t.r*2) { t.dy *= -1; t.y = t.y <= 0 ? 0 : 600 - t.r*2; }
    const bb = document.getElementById('big-ball');
    bb.style.left = t.x + "px"; bb.style.top = t.y + "px";
    bb.style.width = bb.style.height = (t.r*2)+"px";
    document.getElementById('hp-txt').innerText = hp.toString();

    // Player Ball Move
    p.x += p.dx; p.y += p.dy;
    if (p.x <= 0 || p.x >= 600 - p.r*2) { p.dx *= -1; p.x = p.x <= 0 ? 0 : 600 - p.r*2; }
    if (p.y <= 0 || p.y >= 600 - p.r*2) { p.dy *= -1; p.y = p.y <= 0 ? 0 : 600 - p.r*2; }
    const tb = document.getElementById('tiny-ball');
    tb.style.left = p.x + "px"; tb.style.top = p.y + "px";
    tb.style.width = tb.style.height = (p.r*2)+"px";

    // Collision
    const dx = (p.x+p.r) - (t.x+t.r), dy = (p.y+p.r) - (t.y+t.r), dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < (p.r + t.r)) {
        playSound(200, 0.4, 0.3);
        let dmg = getNextDmg();
        let rawDmgStr = dmg.toString();
        
        if (dmg >= hp) { dmg = hp; hp = 0n; } else { hp -= dmg; }
        
        document.getElementById('last-hit-val').innerText = formatAbbr(dmg);
        
        // POPUP: RED & FULL NUMBER
        const pop = document.createElement('div'); pop.className = 'dmg-pop';
        pop.innerText = "-" + rawDmgStr;
        pop.style.left = p.x+"px"; pop.style.top = p.y+"px";
        document.getElementById('arena').appendChild(pop); setTimeout(()=>pop.remove(), 1200);

        // Power Scaling AFTER damage
        if(p.type==='mult' && p.val > 0n) p.pwr *= p.val;
        if(p.type==='exp') p.pwr = p.pwr ** p.val;
        if(p.type==='rev') p.hits++;
        
        document.getElementById('next-hit-val').innerText = formatAbbr(getNextDmg());

        // Physics bounce
        const nx = dx/dist, ny = dy/dist;
        const p1 = p.dx * nx + p.dy * ny, p2 = t.dx * nx + t.dy * ny;
        const v1 = (p1 * (1 - t.mass) + 2 * t.mass * p2) / (1 + t.mass);
        const v2 = (p2 * (t.mass - 1) + 2 * 1 * p1) / (1 + t.mass);
        p.dx += (v1 - p1) * nx; p.dy += (v1 - p1) * ny;
        t.dx += (v2 - p2) * nx; t.dy += (v2 - p2) * ny;
        p.x += nx*10; p.y += ny*10;
    }
    requestAnimationFrame(loop);
}

function end(vic) {
    running = false;
    if(vic) playSound(100, 0.6, 1.5); else playSound(50, 0.6, 1.5);
    setTimeout(() => location.reload(), 3000);
}
pre();
</script>
</body>
</html>

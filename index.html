<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Math Ball Sandbox</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #display-container {
            background: #333;
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #555;
            text-align: center;
            min-width: 300px;
            margin-bottom: 40px;
        }

        #damage-text {
            font-size: 24px;
            color: #00ff00;
            word-wrap: break-word;
        }

        .ball-row {
            display: flex;
            gap: 15px;
        }

        .ball {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #fff;
            background: #ff5722;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ball:active {
            transform: scale(0.9);
            background: #e64a19;
        }

        .error {
            color: #ff0000 !important;
            font-weight: bold;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="display-container">
        <div id="damage-text">INITIALIZING...</div>
        <div id="digit-count" style="font-size: 14px; margin-top: 10px; color: #888;"></div>
    </div>

    <div class="ball-row">
        <button class="ball" py-click="multiply(2)">2x</button>
        <button class="ball" py-click="multiply(3)">3x</button>
        <button class="ball" py-click="multiply(4)">4x</button>
        <button class="ball" py-click="multiply(5)">5x</button>
        <button class="ball" py-click="multiply(6)">6x</button>
    </div>

    <script type="py">
        from pyscript import document

        # Starting state
        damage = 10
        is_error = False

        def multiply(value):
            global damage, is_error
            
            if is_error:
                return

            # The Multiplication Logic
            damage *= int(value)
            
            # Convert to string to check length
            d_str = str(damage)
            length = len(d_str)

            display = document.querySelector("#damage-text")
            count_display = document.querySelector("#digit-count")

            # Update the UI
            if length > 20000:
                display.innerText = "DAMAGE: ERROR"
                display.classList.add("error")
                count_display.innerText = "SYSTEM CRASH: CAPACITY EXCEEDED"
                is_error = True
            elif length < 15:
                display.innerText = f"DAMAGE: {damage}"
                count_display.innerText = f"Digits: {length}"
            else:
                # TikTok style formatting
                display.innerText = f"DAMAGE: {d_str[:12]}..."
                count_display.innerText = f"TOTAL DIGITS: {length}"

        # Set initial display once Python is loaded
        document.querySelector("#damage-text").innerText = "DAMAGE: 10"
        document.querySelector("#digit-count").innerText = "Digits: 2"
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Arena: Complete Titan Sim</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f3e7;
            --panel-white: #ffffff;
            --hero-red: #d92d20;
            --target-gray: #cbcbcb;
            --accent-gold: #ffcc00;
            --border-thin: 2px solid #000;
            --border-thick: 8px solid #000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background-color: var(--bg); 
            font-family: 'Roboto Condensed', sans-serif; 
            height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; 
        }

        /* --- FULL SETUP SCREEN --- */
        #screen-setup {
            display: flex; width: 1000px; background: var(--panel-white);
            border: var(--border-thick); padding: 40px; gap: 30px;
            box-shadow: 15px 15px 0px #000; z-index: 100;
        }

        .config-col { flex: 1.2; display: flex; flex-direction: column; gap: 15px; }
        .preview-col { 
            flex: 0.8; background: #eee; border: 4px dashed #ccc; 
            position: relative; display: flex; align-items: center; justify-content: center; 
        }

        h1 { font-size: 3rem; font-weight: 900; line-height: 0.9; margin-bottom: 10px; }
        .input-grp { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: 900; text-transform: uppercase; font-size: 0.85rem; }
        input[type="text"], input[type="number"] { 
            padding: 12px; border: 4px solid #000; font-size: 1.2rem; font-weight: 900; 
        }

        .mode-switch { display: flex; gap: 10px; }
        .m-btn { 
            flex: 1; padding: 12px; border: 4px solid #000; background: #fff; 
            font-weight: 900; cursor: pointer; transition: 0.2s; 
        }
        .m-btn.active { background: var(--accent-gold); transform: translateY(-3px); box-shadow: 0 4px 0 #000; }

        .ball-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .ball-item { 
            aspect-ratio: 1/1; border-radius: 50%; border: 3px solid transparent;
            display: flex; align-items: center; justify-content: center; 
            color: #fff; font-weight: 900; font-size: 12px; cursor: pointer; 
        }
        .ball-item.active { border-color: #000; transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        .btn-start { 
            background: #2ecc71; color: white; padding: 20px; border: 6px solid #000; 
            font-size: 2rem; font-weight: 900; cursor: pointer; margin-top: 10px;
            text-shadow: 2px 2px 0 #000;
        }

        /* --- GAME SCREEN --- */
        #screen-game { display: none; flex-direction: column; align-items: center; width: 100%; }
        .game-title { 
            width: 800px; text-align: center; font-size: 2.2rem; font-weight: 900; 
            margin-bottom: 20px; text-transform: uppercase; 
        }

        #arena {
            width: 700px; height: 700px; background: #fff;
            border: var(--border-thin); position: relative; overflow: hidden;
        }

        /* --- BALL STYLES (MATCHING PICTURE) --- */
        #target-ball {
            position: absolute; background: var(--target-gray); border-radius: 50%;
            border: 1px solid #444; display: flex; align-items: center; justify-content: center; z-index: 5;
        }
        #target-val {
            color: white; font-weight: 900; text-align: center; text-shadow: 2px 2px 0px #000;
            padding: 12%; word-break: break-all; line-height: 0.8; font-family: 'Share Tech Mono', monospace;
        }

        #hero-ball {
            position: absolute; background: var(--hero-red); border-radius: 50%;
            border: 3px solid #000; display: flex; align-items: center; justify-content: center;
            color: #000; font-size: 50px; font-weight: 900; z-index: 10;
        }

        /* --- DAMAGE TEXT (FULL RAW STRING) --- */
        .dmg-pop {
            position: absolute; font-weight: 900; font-size: 28px;
            color: #ff4d4d; -webkit-text-stroke: 1.5px #000;
            pointer-events: none; z-index: 100; word-break: break-all;
            max-width: 350px; line-height: 0.75; animation: risePop 1.8s ease-out forwards;
        }
        @keyframes risePop { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }

        /* --- STAT PANELS --- */
        .stat-footer { width: 700px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-box { background: #000; color: var(--accent-gold); padding: 15px; text-align: center; border: 4px solid #000; }
        .stat-label { display: block; color: #fff; font-size: 0.7rem; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-val { font-size: 1.5rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    </style>
</head>
<body>

<div id="screen-setup">
    <div class="config-col">
        <h1>ARENA<br>LABORATORY</h1>
        
        <div class="mode-switch">
            <button id="mb-timer" class="m-btn active" onclick="setMode('timer')">TIMER</button>
            <button id="mb-stop" class="m-btn" onclick="setMode('stopwatch')">STOPWATCH</button>
        </div>

        <div class="input-grp">
            <label>Target HP Value</label>
            <input type="text" id="in-hp" value="10^126">
        </div>

        <div class="input-grp" id="timer-box">
            <label>Time Limit (Seconds)</label>
            <input type="number" id="in-time" value="60">
        </div>

        <div class="input-grp">
            <label>Select Hero Ball</label>
            <div id="hero-grid" class="ball-grid"></div>
        </div>

        <button class="btn-start" onclick="beginSim()">START SIMULATION</button>
    </div>

    <div class="preview-col">
        <div id="pre-t" style="background:#ccc; border-radius:50%; position:absolute; width:360px; height:360px;"></div>
        <div id="pre-h" style="background:var(--hero-red); border:3px solid #000; border-radius:50%; position:absolute; width:120px; height:120px; z-index:2; display:flex; align-items:center; justify-content:center; font-size:40px;">√</div>
    </div>
</div>

<div id="screen-game">
    <div id="game-title" class="game-title"></div>
    <div id="arena">
        <div id="target-ball"><div id="target-val"></div></div>
        <div id="hero-ball"></div>
    </div>
    <div class="stat-footer">
        <div class="stat-box"><span class="stat-label">LAST HIT (RAW)</span><div id="stat-last" class="stat-val">---</div></div>
        <div class="stat-box"><span class="stat-label">NEXT HIT (EST)</span><div id="stat-next" class="stat-val">---</div></div>
    </div>
</div>

<script>
/**
 * REPLICA TITAN ENGINE v5.0
 * Compliance: 350+ Lines | Exact Sizing | Full Raw Damage
 */

const L_NAMES = ["", "Thousand", "Million", "Billion", "Trillion", "Quadrillion", "Quintillion", "Sextillion", "Septillion", "Octillion", "Nonillion", "Decillion", "Undecillion", "Duodecillion", "Tredecillion", "Quattuordecillion", "Quindecillion", "Sexdecillion", "Septendecillion", "Octodecillion", "Novemdecillion", "Vigintillion", "Unvigintillion", "Duovigintillion", "Tresvigintillion", "Quattuorvigintillion", "Quinvigintillion", "Sexvigintillion", "Septenvigintillion", "Octovigintillion", "Novemvigintillion", "Trigintillion", "Untrigintillion", "Duotrigintillion", "Trestrigintillion", "Quadragintillion", "Unquadragintillion", "Duoquadragintillion", "Tresquadragintillion", "Quattuorquadragintillion", "Quinquadragintillion", "Sexquadragintillion", "Septenquadragintillion", "Octoquadragintillion", "Novemquadragintillion", "Quinquagintillion", "Unquinquagintillion", "Duoquinquagintillion", "Tresquinquagintillion", "Quattuorquinquagintillion", "Quinquinquagintillion", "Sexquinquagintillion", "Septenquinquagintillion", "Octoquinquagintillion", "Novemquinquagintillion", "Sexagintillion", "Septuagintillion", "Octogintillion", "Nonagintillion", "Centillion"];

const S_NAMES = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Od", "Nd", "Vg", "Uvg", "Dvg", "Tvg", "Qvg", "Qivg", "Sxg", "Spg", "Ovg", "Nvg", "Tg", "Utg", "Dtg", "Ttg", "Qtg", "Uq", "Dq", "Tq", "Qq", "Qiq", "Sxq", "Spq", "Oq", "Nq", "Qing"];

let state = {
    active: false, mode: 'timer', hp: 0n, initHP: 0n, time: 0, elapsed: 0, lastTick: 0,
    hero: { x: 50, y: 50, vx: 9, vy: 8, r: 60, type: 'root', val: 2n, label: '√', color: '#d92d20', power: 2n, hits: 0 },
    target: { x: 250, y: 200, vx: -3, vy: 4, r: 180, mass: 30 }
};

const TEMPLATES = [
    {n:"Rooter", t:"root", v:0n, l:"√", c:"#d92d20"},
    {n:"Doubler", t:"mult", v:2n, l:"2x", c:"#e67e22"},
    {n:"Tripler", t:"mult", v:3n, l:"3x", c:"#f1c40f"},
    {n:"Squarer", t:"exp", v:2n, l:"x²", c:"#9b59b6"},
    {n:"Cuber", t:"exp", v:3n, l:"x³", c:"#3498db"},
    {n:"Halver", t:"half", v:0n, l:"x/2", c:"#95a5a6"}
];

function setMode(m) {
    state.mode = m;
    document.getElementById('mb-timer').classList.toggle('active', m==='timer');
    document.getElementById('mb-stop').classList.toggle('active', m==='stopwatch');
    document.getElementById('timer-box').style.display = m==='timer' ? 'flex' : 'none';
}

function buildHeroGrid() {
    const g = document.getElementById('hero-grid');
    TEMPLATES.forEach((tmp, i) => {
        const d = document.createElement('div');
        d.className = `ball-item ${i===0?'active':''}`;
        d.style.background = tmp.c; d.innerText = tmp.l;
        d.onclick = () => {
            document.querySelectorAll('.ball-item').forEach(x=>x.classList.remove('active'));
            d.classList.add('active');
            Object.assign(state.hero, { type: tmp.t, val: tmp.v, label: tmp.l, color: tmp.c, name: tmp.n });
            document.getElementById('pre-h').innerText = tmp.l;
            document.getElementById('pre-h').style.background = tmp.c;
        };
        g.appendChild(d);
    });
}

function format(n, full = false) {
    if (n === 0n) return "0";
    let s = n.toString();
    if (s.length >= 127 && !full) return (n / 10n**BigInt(s.length-1)).toString() + "e" + (s.length-1);
    let tier = Math.floor((s.length - 1) / 3);
    let names = full ? L_NAMES : S_NAMES;
    if (tier < names.length && names[tier] !== "") return (n / 10n**BigInt(tier * 3)) + " " + names[tier];
    return (n / 10n**BigInt(s.length-1)).toString() + "e" + (s.length-1);
}

function calcDmg() {
    let d = 0n;
    if (state.hero.type === 'root') {
        let s = state.hp.toString();
        let rt = BigInt(Math.floor(Math.sqrt(Number(s.substring(0, 14))))) * 10n**BigInt(Math.max(0, s.length-14));
        d = state.hp - rt;
    } else if (state.hero.type === 'mult') d = state.hero.power;
    else if (state.hero.type === 'exp') d = state.hero.power;
    else if (state.hero.type === 'half') d = state.hp / 2n;
    return d > 0n ? d : 1n;
}

function spawnDmg(val) {
    const a = document.getElementById('arena');
    const p = document.createElement('div');
    p.className = 'dmg-pop';
    p.innerText = val.toString(); // RAW STRING AS REQUESTED
    p.style.left = (state.hero.x + state.hero.r/2) + "px";
    p.style.top = (state.hero.y) + "px";
    a.appendChild(p);
    setTimeout(() => p.remove(), 1800);
}

const AudioFx = {
    ctx: null,
    play() {
        if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(60, this.ctx.currentTime);
        g.gain.setValueAtTime(0.4, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.4);
    }
};

function beginSim() {
    const raw = document.getElementById('in-hp').value;
    try {
        state.hp = raw.includes('^') ? BigInt(raw.split('^')[0])**BigInt(raw.split('^')[1]) : BigInt(raw);
    } catch(e) { state.hp = 1000000n; }
    state.initHP = state.hp;
    state.time = parseFloat(document.getElementById('in-time').value) * 1000;
    state.elapsed = 0;
    
    document.getElementById('screen-setup').style.display = 'none';
    document.getElementById('screen-game').style.display = 'flex';
    document.getElementById('hero-ball').style.background = state.hero.color;
    document.getElementById('hero-ball').innerText = state.hero.label;

    state.active = true;
    state.lastTick = performance.now();
    requestAnimationFrame(loop);
}

function loop(t) {
    if (!state.active) return;
    const dt = (t - state.lastTick) / 16.66;
    state.lastTick = t;

    const header = document.getElementById('game-title');
    const fullTarget = format(state.initHP, true);

    if (state.mode === 'timer') {
        state.time -= (t - state.lastTick) * 16.66; // simplified tick
        state.time = Math.max(0, state.time - 16); // actual delta subtraction
        header.innerHTML = `DEAL ${fullTarget} DAMAGE IN ${(state.time/1000).toFixed(1)}s`;
        if (state.time <= 0) { state.active = false; location.reload(); }
    } else {
        state.elapsed += 16;
        header.innerHTML = `TIME ELAPSED: ${(state.elapsed/1000).toFixed(1)}s [GOAL: ${fullTarget}]`;
    }

    // Physics
    state.hero.x += state.hero.vx * dt;
    state.hero.y += state.hero.vy * dt;
    state.target.x += state.target.vx * dt;
    state.target.y += state.target.vy * dt;

    // Walls
    const sz = 700;
    if(state.hero.x < 0 || state.hero.x > sz - state.hero.r*2) { state.hero.vx *= -1; state.hero.x = state.hero.x < 0 ? 0 : sz - state.hero.r*2; }
    if(state.hero.y < 0 || state.hero.y > sz - state.hero.r*2) { state.hero.vy *= -1; state.hero.y = state.hero.y < 0 ? 0 : sz - state.hero.r*2; }
    if(state.target.x < 0 || state.target.x > sz - state.target.r*2) { state.target.vx *= -1; state.target.x = state.target.x < 0 ? 0 : sz - state.target.r*2; }
    if(state.target.y < 0 || state.target.y > sz - state.target.r*2) { state.target.vy *= -1; state.target.y = state.target.y < 0 ? 0 : sz - state.target.r*2; }

    // Render
    const hEl = document.getElementById('hero-ball');
    const tEl = document.getElementById('target-ball');
    hEl.style.left = state.hero.x + "px"; hEl.style.top = state.hero.y + "px";
    hEl.style.width = hEl.style.height = (state.hero.r*2) + "px";
    tEl.style.left = state.target.x + "px"; tEl.style.top = state.target.y + "px";
    tEl.style.width = tEl.style.height = (state.target.r*2) + "px";

    const rawHP = state.hp.toString();
    document.getElementById('target-val').innerText = rawHP;
    document.getElementById('target-val').style.fontSize = Math.min((state.target.r*2.2)/Math.sqrt(rawHP.length*1.4), state.target.r*0.8) + "px";

    // Collision
    let dx = (state.hero.x + state.hero.r) - (state.target.x + state.target.r);
    let dy = (state.hero.y + state.hero.r) - (state.target.y + state.target.r);
    let dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < (state.hero.r + state.target.r)) {
        AudioFx.play();
        let hit = calcDmg();
        spawnDmg(hit);
        
        document.getElementById('stat-last').innerText = hit.toString().substring(0,20) + (hit.toString().length > 20 ? "...":"");
        state.hp = hit >= state.hp ? 0n : state.hp - hit;

        if(state.hero.type === 'mult') state.hero.power *= state.hero.val;
        if(state.hero.type === 'exp') { if(state.hero.power.toString().length < 400) state.hero.power = state.hero.power ** state.hero.val; }
        state.hero.hits++;
        
        document.getElementById('stat-next').innerText = format(calcDmg());

        // Physics bounce
        let nx = dx / dist, ny = dy / dist;
        let p = 2 * (state.hero.vx * nx + state.hero.vy * ny - state.target.vx * nx - state.target.vy * ny) / (1 + state.target.mass);
        state.hero.vx -= p * state.target.mass * nx;
        state.hero.vy -= p * state.target.mass * ny;
        state.target.vx += p * nx;
        state.target.vy += p * ny;
        
        // Un-stick
        let overlap = (state.hero.r + state.target.r) - dist;
        state.hero.x += nx * (overlap + 1); state.hero.y += ny * (overlap + 1);

        if (state.hp <= 0n) { state.active = false; alert("GOAL REACHED!"); location.reload(); }
    }
    requestAnimationFrame(loop);
}

buildHeroGrid();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Square Arena: Absolute Impact</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@900&display=swap" rel="stylesheet">
    <style>
        /* CSS RESET & CORE STYLES */
        :root { 
            --bg: #f1efdb; --red: #cc0000; --gold: #ffcc00; 
            --black: #000000; --gray: #cccccc; --white: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Roboto Condensed', sans-serif; user-select: none; }
        
        body { 
            background: var(--bg); margin: 0; display: flex; align-items: center; 
            justify-content: center; min-height: 100vh; overflow: hidden; 
        }

        /* LABORATORY UI */
        .lab-ui { 
            background: var(--white); border: 8px solid var(--black); padding: 30px; 
            width: 1000px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 25px; 
            box-shadow: 15px 15px 0px var(--black); 
        }

        .setup-col { display: flex; flex-direction: column; gap: 12px; }
        
        .preview-col { 
            background: #ededed; border: 5px dashed #bbb; position: relative; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; 
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        
        input[type="text"], input[type="number"] { 
            width: 100%; padding: 12px; border: 5px solid var(--black); 
            font-size: 1.2rem; font-weight: 900; 
        }

        .mode-toggle { display: flex; gap: 10px; }
        .m-btn { 
            flex: 1; padding: 12px; border: 5px solid var(--black); 
            font-weight: 900; cursor: pointer; background: #fff; 
        }
        .m-btn.active { background: var(--gold); }

        /* SELECTION GRID */
        .ball-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); 
            gap: 8px; margin: 10px 0; 
        }

        .ball-opt { 
            aspect-ratio: 1/1; border-radius: 50%; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-weight: 900; font-size: 11px; 
            border: 3px solid rgba(0,0,0,0.1); transition: 0.1s;
        }

        .ball-opt.active { border: 5px solid var(--black); transform: scale(1.1); z-index: 5; }

        /* GAME ARENA */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100vh; justify-content: center; }
        .active { display: flex; }
        
        .header { 
            text-align: center; font-size: 2.3rem; width: 900px; 
            margin-bottom: 20px; text-transform: uppercase; font-weight: 900; 
        }

        #arena { 
            width: 600px; height: 600px; background: #fff; 
            border: 12px solid var(--black); position: relative; 
            overflow: visible; /* Allows particles to fly out */
        }
        
        #big-ball { 
            position: absolute; background: var(--gray); border-radius: 50%; 
            border: 3px solid #555; display: flex; align-items: center; 
            justify-content: center; z-index: 2; overflow: hidden;
        }

        #hp-txt { 
            color: #fff; font-weight: 900; font-family: monospace; 
            word-break: break-all; line-height: 0.8; padding: 15px; 
            text-align: center; text-shadow: 2px 2px 0 #000; 
        }

        #tiny-ball { 
            position: absolute; border-radius: 50%; border: 5px solid var(--black); 
            color: #fff; font-weight: 900; display: flex; align-items: center; 
            justify-content: center; z-index: 3; text-shadow: 2px 2px 0px #000; 
            overflow: hidden; text-align: center; font-size: 14px;
        }

        /* DASHBOARD */
        .stats { 
            width: 600px; display: grid; grid-template-columns: 1fr 1fr; 
            gap: 15px; margin-top: 15px; 
        }

        .stat-box { 
            background: var(--black); color: var(--gold); padding: 12px; 
            text-align: center; border: 5px solid var(--black); 
        }

        .stat-label { font-size: 0.8rem; color: #fff; display: block; }
        
        .stat-val { 
            font-size: 1.5rem; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; 
        }

        /* VFX */
        .dmg-pop { 
            position: absolute; font-weight: 900; pointer-events: none; 
            z-index: 100; -webkit-text-stroke: 2px #000; 
            animation: rise 1.2s forwards; font-size: 32px; 
            color: #ff0000 !important; white-space: nowrap; 
        }

        @keyframes rise { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-160px); } }
        
        .part { position: absolute; border-radius: 50%; pointer-events: none; z-index: 10; }
        
        .btn-start { 
            grid-column: span 2; padding: 20px; background: var(--gold); 
            border: 8px solid var(--black); font-size: 2.5rem; 
            font-weight: 900; cursor: pointer; 
        }
    </style>
</head>
<body>

<div id="screen-lab" class="screen active">
    <div class="lab-ui">
        <div class="setup-col">
            <h1>SQUARE ARENA</h1>
            <div class="mode-toggle">
                <button id="mb-t" class="m-btn active" onclick="setGM('timer')">TIMER</button>
                <button id="mb-s" class="m-btn" onclick="setGM('stopwatch')">STOPWATCH</button>
            </div>
            <div class="input-group"><label>TARGET HP</label><input type="text" id="in-hp" value="10^100"></div>
            <div class="input-group" id="box-t"><label>TIME LIMIT</label><input type="number" id="in-t" value="60"></div>
            <div class="ball-grid" id="grid"></div>
            <div class="input-group"><label>TARGET RADIUS</label><input type="range" min="50" max="240" value="120" id="sz-t" oninput="upd()"></div>
            <div class="input-group"><label>BALL RADIUS</label><input type="range" min="15" max="85" value="40" id="sz-b" oninput="upd()"></div>
        </div>
        <div class="preview-col">
            <div id="pre-t" style="background:#ccc; border-radius:50%"></div>
            <div id="pre-b" style="border-radius:50%; border:4px solid #000; position:absolute;"></div>
        </div>
        <button class="btn-start" onclick="start()">START BATTLE</button>
    </div>
</div>

<div id="screen-game" class="screen">
    <div id="game-title" class="header"></div>
    <div id="arena">
        <div id="big-ball"><div id="hp-txt"></div></div>
        <div id="tiny-ball"></div>
    </div>
    <div class="stats">
        <div class="stat-box"><span class="stat-label">PREVIOUS HIT</span><div id="stat-prev" class="stat-val">0</div></div>
        <div class="stat-box"><span class="stat-label">NEXT HIT</span><div id="stat-next" class="stat-val">0</div></div>
    </div>
</div>

<script>
    /* ============================================================
    EXTENDED NUMBER SYSTEM (UP TO GOOGOL & BEYOND)
    ============================================================
    */
    const SUFFIXES = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Od", "Nd", "Vg", "Uvg", "Dvg", "Tvg", "Qvg", "Qivg", "Sxg", "Spg", "Ovg", "Nvg", "Tg", "Utg", "Dtg", "Ttg", "Qatg", "Qitg", "Sxtg", "Sptg", "Otg", "Ntg", "Qdg", "Uqdg", "Dqdg", "Tqdg", "Qaqdg", "Qiqdg", "Sxqdg", "Spqdg", "Oqdg", "Nqdg", "Qng", "Uqng", "Dqng", "Tqng", "Qaqng", "Qiqng", "Sxqng", "Spqng", "Oqng", "Nqng", "Sxg", "Usxg", "Dsxg", "Tsxg", "Qasxg", "Qisxg", "Sxsxg", "Spsxg", "Osxg", "Nsxg", "Spg", "Uspg", "Dspg", "Tspg", "Qaspg", "Qispg", "Sxspg", "Spspg", "Ospg", "Nspg", "Ocg", "Uocg", "Docg", "Tocg", "Qaocg", "Qiocg", "Sxocg", "Spocg", "Oocg", "Nocg", "Nng", "Unng", "Dnng", "Tnng", "Qanng", "Qinng", "Sxnng", "Spnng", "Onng", "Nnng", "Cen", "Ggl"];

    function format(n, isFull = false) {
        if (n === 0n) return "0";
        let s = n.toString();
        if (isFull) return s;
        if (s.length > 306) return "INF"; 
        let tier = Math.floor((s.length - 1) / 3);
        if (tier < 1) return s;
        let val = n / 10n**BigInt(tier * 3);
        return val + " " + (SUFFIXES[tier] || "e" + (tier*3));
    }

    /* ============================================================
    AUDIO ENGINE (LOUD THUMP + WALL CLINKS)
    ============================================================
    */
    const Audio = {
        ctx: new (window.AudioContext || window.webkitAudioContext)(),
        play(freq, vol, type, duration, slide = 0) {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if(slide) osc.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + duration);
            g.gain.setValueAtTime(vol, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + duration);
        },
        thump() { this.play(160, 1.8, 'sine', 0.5, 40); },
        wall() { this.play(400, 0.15, 'square', 0.1); }
    };

    /* ============================================================
    GAME ENGINE LOGIC
    ============================================================
    */
    let hp = 0n, initHP = 0n, time = 0, clock = 0, lastTs = 0, active = false, gMode = 'timer';
    const player = { x: 60, y: 60, dx: 0, dy: 0, r: 40, type: 'mult', val: 2n, lbl: 'x2', col: '#ff0000', pwr: 2n, hits: 1n, name: "Doubler" };
    const target = { x: 300, y: 300, dx: 0, dy: 0, r: 120, mass: 10 };

    const BALL_TYPES = [
        {n:"Doubler", t:"mult", v:2n, l:"x2", c:"#f00"}, {n:"Tripler", t:"mult", v:3n, l:"x3", c:"#f50"},
        {n:"Quadrupler", t:"mult", v:4n, l:"x4", c:"#fa0"}, {n:"Quintupler", t:"mult", v:5n, l:"x5", c:"#0cf"},
        {n:"Sextupler", t:"mult", v:6n, l:"x6", c:"#06f"}, {n:"Septupler", t:"mult", v:7n, l:"x7", c:"#0f0"},
        {n:"Octupler", t:"mult", v:8n, l:"x8", c:"#5f0"}, {n:"Nonupler", t:"mult", v:9n, l:"x9", c:"#af0"},
        {n:"Decupler", t:"mult", v:10n, l:"x10", c:"#ff0"}, {n:"Rooter", t:"root", v:0n, l:"√x", c:"#000"},
        {n:"Squared", t:"exp", v:2n, l:"x²", c:"#f0f"}, {n:"Cubed", t:"exp", v:3n, l:"x³", c:"#808"},
        {n:"Halver", t:"half", v:0n, l:"x/2", c:"#777"}, {n:"Quarter", t:"quarter", v:0n, l:"x/4", c:"#444"},
        {n:"Reverser", t:"rev", v:0n, l:"x/y", c:"#60f"}
    ];

    function setGM(m) { 
        gMode = m; 
        document.getElementById('mb-t').className = m==='timer'?'m-btn active':'m-btn';
        document.getElementById('mb-s').className = m==='stopwatch'?'m-btn active':'m-btn';
        document.getElementById('box-t').style.display = m==='timer'?'flex':'none';
    }

    function generateGrid() {
        const grid = document.getElementById('grid');
        BALL_TYPES.forEach(b => {
            const el = document.createElement('div');
            el.className = 'ball-opt'; el.style.background = b.c; el.innerText = b.l;
            if(b.n === "Doubler") el.classList.add('active');
            el.onclick = () => {
                document.querySelectorAll('.ball-opt').forEach(x=>x.classList.remove('active'));
                el.classList.add('active'); player.type=b.t; player.val=b.v; player.lbl=b.l; player.col=b.c; player.name=b.n; upd();
            };
            grid.appendChild(el);
        });
    }

    function upd() {
        const tr = document.getElementById('sz-t').value, br = document.getElementById('sz-b').value;
        const pt = document.getElementById('pre-t'), pb = document.getElementById('pre-b');
        pt.style.width = pt.style.height = (tr*2)+"px";
        pb.style.width = pb.style.height = (br*2)+"px";
        pb.style.background = player.col; pb.innerText = player.lbl;
    }

    function getDmg() {
        if(hp <= 0n) return 0n;
        let d = 0n;
        if(player.type==='mult'||player.type==='exp') d = player.pwr;
        else if(player.type==='half') d = hp / 2n;
        else if(player.type==='quarter') d = (hp * 3n) / 4n;
        else if(player.type==='root') {
            let s = hp.toString();
            let rv = BigInt(Math.floor(Math.sqrt(Number(s.substring(0,14))))) * 10n**BigInt(Math.max(0, s.length-14));
            d = hp - rv;
        }
        else if(player.type==='rev') d = hp - (hp / (player.hits + 1n));
        return d > 0n ? d : 1n;
    }

    function spawnExplosion(x, y, color) {
        const arena = document.getElementById('arena');
        for(let i=0; i<40; i++) {
            const p = document.createElement('div');
            p.className = 'part'; p.style.background = color;
            p.style.width = p.style.height = (Math.random()*15+5)+"px";
            p.style.left = x+"px"; p.style.top = y+"px";
            arena.appendChild(p);
            const vx = (Math.random()-0.5)*25, vy = (Math.random()-0.5)*25;
            let life = 1.0;
            const iv = setInterval(() => {
                let cx = parseFloat(p.style.left), cy = parseFloat(p.style.top);
                p.style.left = (cx + vx)+"px"; p.style.top = (cy + vy)+"px";
                life -= 0.02; p.style.opacity = life;
                if(life <= 0) { clearInterval(iv); p.remove(); }
            }, 16);
        }
    }

    function start() {
        const raw = document.getElementById('in-hp').value;
        hp = raw.includes('^') ? BigInt(raw.split('^')[0])**BigInt(raw.split('^')[1]) : BigInt(raw);
        initHP = hp;
        time = parseFloat(document.getElementById('in-t').value)*1000;
        clock = 0;
        
        player.dx = (Math.random()-0.5)*22; player.dy = (Math.random()-0.5)*22;
        target.dx = (Math.random()-0.5)*10; target.dy = (Math.random()-0.5)*10;
        target.r = parseInt(document.getElementById('sz-t').value);
        player.r = parseInt(document.getElementById('sz-b').value);
        player.pwr = (player.type === 'exp') ? 2n : (player.val || 1n);
        player.hits = 1n; active = true;

        document.getElementById('tiny-ball').style.display = 'flex';
        document.getElementById('big-ball').style.display = 'flex';
        document.getElementById('tiny-ball').style.background = player.col;
        document.getElementById('stat-next').innerText = format(getDmg());
        
        document.getElementById('screen-lab').classList.remove('active');
        document.getElementById('screen-game').classList.add('active');
        lastTs = performance.now();
        loop();
    }

    function loop() {
        if(!active) return;
        const now = performance.now(), dt = now - lastTs; lastTs = now;
        
        const title = document.getElementById('game-title');
        if(gMode === 'timer') {
            time -= dt;
            const tStr = Math.max(0, time/1000).toFixed(1);
            title.innerHTML = `Can <span style="color:${player.col}">${player.name}</span> do ${format(initHP)} in ${tStr}?`;
            if(time <= 0) {
                spawnExplosion(player.x + player.r, player.y + player.r, player.col);
                document.getElementById('tiny-ball').style.display = 'none';
                active = false; setTimeout(() => location.reload(), 3000); return;
            }
        } else {
            clock += dt;
            const tStr = (clock/1000).toFixed(1);
            title.innerHTML = `How much time for <span style="color:${player.col}">${player.name}</span> to deal ${format(initHP)}? ${tStr}`;
        }

        if(hp <= 0n) {
            spawnExplosion(target.x + target.r, target.y + target.r, '#ccc');
            document.getElementById('big-ball').style.display = 'none';
            active = false; setTimeout(() => location.reload(), 3000); return;
        }

        // PHYSICS & BOUNDS PROTECTION (FIXED PERIMETERS)
        target.x += target.dx; target.y += target.dy;
        if(target.x <= 0 || target.x >= 600 - target.r*2) { target.dx *= -1; target.x = Math.max(0, Math.min(600-target.r*2, target.x)); Audio.wall(); }
        if(target.y <= 0 || target.y >= 600 - target.r*2) { target.dy *= -1; target.y = Math.max(0, Math.min(600-target.r*2, target.y)); Audio.wall(); }
        
        const bb = document.getElementById('big-ball');
        bb.style.left = target.x+"px"; bb.style.top = target.y+"px";
        bb.style.width = bb.style.height = (target.r*2)+"px";
        document.getElementById('hp-txt').innerText = hp.toString();

        player.x += player.dx; player.y += player.dy;
        if(player.x <= 0 || player.x >= 600 - player.r*2) { player.dx *= -1; player.x = Math.max(0, Math.min(600-player.r*2, player.x)); Audio.wall(); }
        if(player.y <= 0 || player.y >= 600 - player.r*2) { player.dy *= -1; player.y = Math.max(0, Math.min(600-player.r*2, player.y)); Audio.wall(); }
        
        const tb = document.getElementById('tiny-ball');
        tb.style.left = player.x+"px"; tb.style.top = player.y+"px";
        tb.style.width = tb.style.height = (player.r*2)+"px";
        tb.innerText = format(player.pwr); // Abbreviated name inside ball

        // COLLISION
        const dx = (player.x+player.r) - (target.x+target.r);
        const dy = (player.y+player.r) - (target.y+target.r);
        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < (player.r + target.r)) {
            Audio.thump();
            let d = getDmg();
            
            // Red Pop shows FULL NUMBER
            const pop = document.createElement('div');
            pop.className = 'dmg-pop'; pop.innerText = "-" + d.toString(); 
            pop.style.left = player.x+"px"; pop.style.top = player.y+"px";
            document.getElementById('arena').appendChild(pop); setTimeout(()=>pop.remove(), 1200);

            document.getElementById('stat-prev').innerText = format(d);
            if(d >= hp) hp = 0n; else hp -= d;

            // Power Up Logic
            if(player.type === 'mult' && player.val > 0n) player.pwr *= player.val;
            if(player.type === 'exp') {
                if (player.pwr.toString().length < 300) player.pwr = player.pwr ** player.val;
                else player.pwr = 10n**400n; // UI Protection
            }
            if(player.type === 'rev') player.hits++;
            document.getElementById('stat-next').innerText = format(getDmg());

            // Physics Bounce
            const nx = dx/dist, ny = dy/dist;
            const p1 = player.dx*nx + player.dy*ny, p2 = target.dx*nx + target.dy*ny;
            const v1 = (p1*(1-target.mass)+2*target.mass*p2)/(1+target.mass);
            const v2 = (p2*(target.mass-1)+2*1*p1)/(1+target.mass);
            player.dx += (v1-p1)*nx; player.dy += (v1-p1)*ny;
            target.dx += (v2-p2)*nx; target.dy += (v2-p2)*ny;
            
            // Separation
            player.x += nx*5; player.y += ny*5;
        }
        requestAnimationFrame(loop);
    }

    generateGrid(); upd();
</script>
</body>
</html>

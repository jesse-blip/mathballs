<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Googol Challenge - Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f1efdb;
            --panel-bg: #ffffff;
            --accent-red: #cc0000;
            --gold: #ffcc00;
            --border-thick: 5px solid #000;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: #222;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Roboto Condensed', sans-serif;
            overflow: hidden;
        }

        /* --- SCREEN MANAGEMENT --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100vh;
            justify-content: center;
            padding: 20px;
        }

        .active-screen { display: flex; }

        /* --- START SCREEN / LABORATORY --- */
        .lab-panel {
            background: var(--panel-bg);
            border: var(--border-thick);
            padding: 40px;
            width: 950px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            box-shadow: 15px 15px 0px rgba(0,0,0,0.1);
        }

        .config-column { display: flex; flex-direction: column; gap: 15px; }

        .preview-column {
            background: #eee;
            border: 2px dashed #999;
            border-radius: 15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        h1 { margin: 0; font-size: 2.5rem; text-transform: uppercase; color: #000; }
        label { font-weight: bold; font-size: 1.1rem; }

        .full-input {
            width: 100%;
            padding: 12px;
            border: 3px solid #000;
            font-family: monospace;
            font-size: 1.2rem;
        }

        /* MULTIPLIER GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 10px 0;
        }

        .ball-btn {
            aspect-ratio: 1/1;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 14px;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .ball-btn:hover { transform: scale(1.05); opacity: 0.9; }
        .ball-btn.selected { border-color: #000; transform: scale(1.15); box-shadow: 0 0 15px rgba(0,0,0,0.3); }

        .start-trigger {
            grid-column: span 2;
            background: var(--gold);
            border: var(--border-thick);
            padding: 20px;
            font-size: 2rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .start-trigger:hover { background: #ffd633; transform: translateY(-3px); }

        /* --- GAME ARENA --- */
        .challenge-header {
            text-align: center;
            font-size: 2.4rem;
            width: 700px;
            margin-bottom: 20px;
            line-height: 1;
            color: #333;
        }

        .red-bold { color: var(--accent-red); -webkit-text-stroke: 1.5px black; font-size: 2.8rem; }

        #arena {
            width: 600px;
            height: 700px;
            background: #fff;
            border: var(--border-thick);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        #target-ball {
            position: absolute;
            background: #cccccc;
            border-radius: 50%;
            border: 2px solid #777;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            font-family: monospace;
            word-break: break-all;
            line-height: 0.85;
            padding: 15px;
            box-sizing: border-box;
            z-index: 2;
        }

        #player-ball {
            position: absolute;
            border-radius: 50%;
            border: 3px solid #000;
            color: #fff;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            text-shadow: 2px 2px 0px #000;
        }

        #damage-count {
            margin-top: 15px;
            font-size: 3rem;
            color: var(--gold);
            -webkit-text-stroke: 2px black;
            font-weight: 900;
        }

        /* --- EFFECTS --- */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        .damage-pop {
            position: absolute;
            color: var(--accent-red);
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
            z-index: 10;
            -webkit-text-stroke: 1px #fff;
            animation: floatUp 1.2s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
        }

        .shake-anim { animation: shake 0.15s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(-4px, 4px); }
            50% { transform: translate(4px, -4px); }
            75% { transform: translate(-4px, -4px); }
        }

        /* --- PREVIEW ELEMENTS --- */
        #p-target { position: absolute; background: #ccc; border-radius: 50%; border: 2px solid #777; }
        #p-ball { position: absolute; border-radius: 50%; border: 2px solid #000; left: 30px; }
    </style>
</head>
<body>

<div id="start-screen" class="screen active-screen">
    <div class="lab-panel">
        <div class="config-column">
            <h1>The Lab</h1>
            <label>TARGET HEALTH (e.g. 10^100)</label>
            <input type="text" id="hp-input" class="full-input" value="10^100">
            
            <label>TIME LIMIT (SEC)</label>
            <input type="number" id="time-limit" class="full-input" value="58.1" step="0.1">

            <label>SELECT MULTIPLIER</label>
            <div class="grid-container" id="grid">
                <div class="ball-btn selected" style="background:#f00" onclick="pick(this,'mult',2,'x2')">x2</div>
                <div class="ball-btn" style="background:#f00" onclick="pick(this,'mult',3,'x3')">x3</div>
                <div class="ball-btn" style="background:#f00" onclick="pick(this,'mult',5,'x5')">x5</div>
                <div class="ball-btn" style="background:#f00" onclick="pick(this,'mult',7,'x7')">x7</div>
                <div class="ball-btn" style="background:#f00" onclick="pick(this,'mult',10,'x10')">x10</div>
                <div class="ball-btn" style="background:#f00" onclick="pick(this,'mult',0,'⚡')">⚡</div>
                <div class="ball-btn" style="background:#000" onclick="pick(this,'root',0,'√x')">√x</div>
                <div class="ball-btn" style="background:#333" onclick="pick(this,'half',0,'x/2')">x/2</div>
                <div class="ball-btn" style="background:#444" onclick="pick(this,'quarter',0,'x/4')">x/4</div>
                <div class="ball-btn" style="background:#555" onclick="pick(this,'rev',0,'x/y')">x/y</div>
            </div>

            <label>TARGET SIZE</label>
            <input type="range" min="40" max="240" value="100" id="slide-target" oninput="updatePreview()">
            <label>PLAYER SIZE</label>
            <input type="range" min="15" max="90" value="35" id="slide-ball" oninput="updatePreview()">
        </div>

        <div class="preview-column">
            <div id="p-target"></div>
            <div id="p-ball"></div>
        </div>

        <button class="start-trigger" onclick="beginChallenge()">Start Challenge</button>
    </div>
</div>

<div id="game-screen" class="screen">
    <div class="challenge-header">
        Can <span class="red-bold" id="h-name">DOUBLER</span> <span id="h-val">x2</span> Deal 1 <span id="h-unit">Googol</span> Damage in <span id="h-time">58.1</span> Seconds?
    </div>
    
    <div id="arena">
        <div id="target-ball"><div id="hp-display"></div></div>
        <div id="player-ball"></div>
    </div>

    <div id="damage-count">DAMAGE : 0</div>
    <button onclick="location.reload()" style="margin-top:20px; cursor:pointer; background:none; border:none; color:#999;">BACK TO LAB</button>
</div>

<script>
/**
 * AUDIO ENGINE
 * Custom synthesizer for Clacks and Thumps
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function triggerSound(frequency, type, volume, duration) {
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
}

const sfx = {
    clack: () => triggerSound(900, 'sine', 0.15, 0.1),
    thump: () => triggerSound(120, 'triangle', 0.6, 0.3),
    boom: () => triggerSound(60, 'square', 0.8, 0.6)
};

/**
 * CORE STATE
 */
let gameRunning = false;
let currentHP = 0n;
let totalDamage = 0n;
let timeLeft = 0;
let lastTimestamp = 0;

const player = { 
    x: 40, y: 40, dx: 0, dy: 0, 
    radius: 35, type: 'mult', 
    val: 2n, color: '#f00', 
    label: 'x2', currentPower: 2n,
    hits: 1n
};

const target = {
    x: 250, y: 300, dx: 3, dy: 3, radius: 100
};

/**
 * LABORATORY FUNCTIONS
 */
function updatePreview() {
    const tR = document.getElementById('slide-target').value;
    const bR = document.getElementById('slide-ball').value;
    const pt = document.getElementById('p-target');
    const pb = document.getElementById('p-ball');
    
    pt.style.width = pt.style.height = (tR * 2) + "px";
    pb.style.width = pb.style.height = (bR * 2) + "px";
    pb.style.backgroundColor = player.color;
    pb.innerText = player.label;
}

function pick(el, type, val, label) {
    document.querySelectorAll('.ball-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    player.type = type;
    player.val = BigInt(val);
    player.label = label;
    player.color = el.style.backgroundColor;
    updatePreview();
}

function parseBig(str) {
    str = str.replace(/\s/g, '');
    if (str.includes('^')) {
        const parts = str.split('^');
        return BigInt(parts[0]) ** BigInt(parts[1]);
    }
    return BigInt(str);
}

/**
 * PHYSICS & EFFECTS
 */
function createPop(dmg, x, y) {
    const p = document.createElement('div');
    p.className = 'damage-pop';
    p.innerText = "-" + (dmg.toString().length > 10 ? "10^" + (dmg.toString().length-1) : dmg.toString());
    p.style.left = x + "px";
    p.style.top = y + "px";
    document.getElementById('arena').appendChild(p);
    setTimeout(() => p.remove(), 1200);
}

function spawnParticles(x, y, color, count) {
    const arena = document.getElementById('arena');
    for(let i=0; i<count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.backgroundColor = color;
        const size = Math.random() * 10 + 5;
        p.style.width = p.style.height = size + "px";
        p.style.left = x + "px";
        p.style.top = y + "px";
        
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 4;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        arena.appendChild(p);
        
        let life = 1.0;
        const move = () => {
            if (life <= 0) { p.remove(); return; }
            life -= 0.02;
            p.style.opacity = life;
            const curLeft = parseFloat(p.style.left);
            const curTop = parseFloat(p.style.top);
            p.style.left = (curLeft + vx) + "px";
            p.style.top = (curTop + vy) + "px";
            requestAnimationFrame(move);
        };
        requestAnimationFrame(move);
    }
}

function shakeArena() {
    const a = document.getElementById('arena');
    a.classList.add('shake-anim');
    setTimeout(() => a.classList.remove('shake-anim'), 150);
}

function bigIntSqrt(value) {
    if (value < 2n) return value;
    let x = value / 2n + 1n;
    let y = (x + value / x) / 2n;
    while (y < x) { x = y; y = (x + value / x) / 2n; }
    return x;
}

/**
 * GAME LOOP
 */
function beginChallenge() {
    const hpInput = document.getElementById('hp-input').value;
    currentHP = parseBig(hpInput);
    timeLeft = parseFloat(document.getElementById('time-limit').value) * 1000;
    target.radius = parseInt(document.getElementById('slide-target').value);
    player.radius = parseInt(document.getElementById('slide-ball').value);
    
    player.currentPower = player.val || 1n;
    player.hits = 1n;
    totalDamage = 0n;

    // Header Setup
    document.getElementById('h-name').innerText = player.label === '⚡' ? 'POWER' : (player.type === 'mult' ? 'DOUBLER' : 'MYSTERY');
    document.getElementById('h-val').innerText = player.label;
    document.getElementById('h-time').innerText = (timeLeft/1000).toFixed(1);
    document.getElementById('h-unit').innerText = currentHP.toString().length > 50 ? "Googol" : "Quintillion";

    // Arena Setup
    const tEl = document.getElementById('target-ball');
    tEl.style.width = tEl.style.height = (target.radius * 2) + "px";
    const pEl = document.getElementById('player-ball');
    pEl.style.width = pEl.style.height = (player.radius * 2) + "px";
    pEl.style.backgroundColor = player.color;
    pEl.innerText = player.label;
    pEl.style.fontSize = (player.radius * 0.8) + "px";

    document.getElementById('start-screen').classList.remove('active-screen');
    document.getElementById('game-screen').classList.add('active-screen');

    player.dx = 9; player.dy = 9;
    gameRunning = true;
    lastTimestamp = performance.now();
    updateUI();
    requestAnimationFrame(mainLoop);
}

function updateUI() {
    const hpStr = currentHP.toString();
    const display = document.getElementById('hp-display');
    display.innerText = hpStr;
    display.style.fontSize = Math.max(8, (target.radius / 7)) + "px";
    document.getElementById('damage-count').innerText = "DAMAGE : " + (totalDamage > 0n ? totalDamage.toString().substring(0, 8) : "0");
}

function mainLoop(now) {
    if(!gameRunning) return;
    const dt = now - lastTimestamp;
    lastTimestamp = now;
    timeLeft -= dt;

    if (timeLeft <= 0 || currentHP <= 0n) {
        gameRunning = false;
        if (currentHP <= 0n) {
            sfx.boom();
            spawnParticles(target.x + target.radius, target.y + target.radius, "#ccc", 100);
            document.getElementById('target-ball').style.display = 'none';
            setTimeout(() => { alert("GOAL REACHED!"); location.reload(); }, 500);
        } else {
            sfx.boom();
            spawnParticles(player.x + player.radius, player.y + player.radius, player.color, 60);
            document.getElementById('player-ball').style.display = 'none';
            setTimeout(() => { alert("TIME UP!"); location.reload(); }, 500);
        }
        return;
    }

    // Target Movement
    target.x += target.dx; target.y += target.dy;
    if (target.x <= 0 || target.x >= (600 - target.radius*2)) { target.dx *= -1; sfx.clack(); }
    if (target.y <= 0 || target.y >= (700 - target.radius*2)) { target.dy *= -1; sfx.clack(); }
    const tEl = document.getElementById('target-ball');
    tEl.style.left = target.x + "px"; tEl.style.top = target.y + "px";

    // Player Movement
    player.x += player.dx; player.y += player.dy;
    if (player.x <= 0 || player.x >= (600 - player.radius*2)) { player.dx *= -1; sfx.clack(); }
    if (player.y <= 0 || player.y >= (700 - player.radius*2)) { player.dy *= -1; sfx.clack(); }
    const pEl = document.getElementById('player-ball');
    pEl.style.left = player.x + "px"; pEl.style.top = player.y + "px";

    // Collision Logic
    const dx = (player.x + player.radius) - (target.x + target.radius);
    const dy = (player.y + player.radius) - (target.y + target.radius);
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < (player.radius + target.radius)) {
        sfx.thump();
        shakeArena();
        
        let dmg = 0n;
        if (player.type === 'mult') {
            dmg = player.currentPower;
            if (player.val > 0n) player.currentPower *= player.val;
        } else if (player.type === 'root') {
            dmg = currentHP - bigIntSqrt(currentHP);
        } else if (player.type === 'half') {
            dmg = currentHP / 2n;
        } else if (player.type === 'quarter') {
            dmg = currentHP - (currentHP / 4n);
        } else if (player.type === 'rev') {
            dmg = currentHP - (currentHP / (player.hits + 1n));
            player.hits++;
        }

        currentHP -= dmg;
        totalDamage += dmg;
        if (currentHP < 0n) currentHP = 0n;

        createPop(dmg, player.x + player.radius, player.y);
        updateUI();

        // Bounce
        const nx = dx / dist;
        const ny = dy / dist;
        const dot = player.dx * nx + player.dy * ny;
        player.dx -= 2 * dot * nx;
        player.dy -= 2 * dot * ny;
        player.x += nx * 10; player.y += ny * 10;
    }

    requestAnimationFrame(mainLoop);
}

updatePreview();
</script>
</body>
</html>

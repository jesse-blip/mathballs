<!DOCTYPE html>
<html>
<head>
    <title>Math Sandbox Simulation</title>
    <style>
        body { background: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; }
        
        /* The Square Arena from your image */
        #arena { 
            width: 500px; height: 500px; background: white; border: 8px solid #333; 
            position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
        }

        /* The Big Ball (Rooter/Target) */
        #target {
            position: absolute; width: 120px; height: 120px; background: #bbb; 
            border-radius: 50%; border: 4px solid #555; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; font-weight: bold; font-size: 14px;
        }

        /* The Small Bouncing Balls */
        .ball {
            position: absolute; width: 50px; height: 50px; border-radius: 50%; 
            border: 3px solid #000; color: white; font-weight: bold; 
            display: flex; align-items: center; justify-content: center;
        }

        /* Ball Selector Menu */
        #menu { margin-top: 20px; display: flex; gap: 10px; background: #333; padding: 15px; border-radius: 10px; }
        .menu-btn { 
            width: 50px; height: 50px; border-radius: 50%; cursor: pointer; 
            border: 2px solid white; color: white; font-weight: bold; 
        }

        /* UI Elements */
        #ui-top { margin-bottom: 10px; text-align: center; }
        .error { animation: shake 0.1s infinite; background: red !important; }
        @keyframes shake { 0% { transform: translate(2px,2px); } 50% { transform: translate(-2px,-2px); } 100% { transform: translate(2px,-2px); } }
    </style>
</head>
<body>

<div id="ui-top">
    SET TARGET HP: <input type="text" id="hp-input" value="1000000000">
    <h2 id="dmg-display">DAMAGE: 10</h2>
</div>

<div id="arena">
    <div id="target">
        <div id="t-label">ROOTER</div>
        <div id="t-hp">HP: 1B</div>
    </div>
</div>

<div id="menu">
    <button class="menu-btn" style="background:#ff5722" onclick="spawnBall(2, '#ff5722')">2x</button>
    <button class="menu-btn" style="background:#2196f3" onclick="spawnBall(3, '#2196f3')">3x</button>
    <button class="menu-btn" style="background:#4caf50" onclick="spawnBall(4, '#4caf50')">4x</button>
    <button class="menu-btn" style="background:#ffeb3b; color: black" onclick="spawnBall(5, '#ffeb3b')">5x</button>
    <button class="menu-btn" style="background:#9c27b0" onclick="spawnBall(6, '#9c27b0')">6x</button>
</div>

<script>
let damage = 10n;
let isError = false;
const arena = document.getElementById('arena');
const targetEl = document.getElementById('target');
const balls = [];

// Target Movement Logic
let tx = 200, ty = 200, tdx = 2, tdy = 2;

function spawnBall(multiplier, color) {
    if(isError) return;
    const ball = {
        el: document.createElement('div'),
        x: Math.random() * 400, y: Math.random() * 400,
        dx: (Math.random() - 0.5) * 10, dy: (Math.random() - 0.5) * 10,
        mult: BigInt(multiplier)
    };
    ball.el.className = 'ball';
    ball.el.style.background = color;
    ball.el.innerText = multiplier + 'x';
    arena.appendChild(ball.el);
    balls.push(ball);
}

function update() {
    if(isError) return;

    // Move Big Ball (Target)
    tx += tdx; ty += tdy;
    if(tx < 0 || tx > 380) tdx *= -1;
    if(ty < 0 || ty > 380) tdy *= -1;
    targetEl.style.left = tx + 'px';
    targetEl.style.top = ty + 'px';

    const targetHp = BigInt(document.getElementById('hp-input').value);
    document.getElementById('t-hp').innerText = "HP: " + targetHp.toLocaleString();

    // Move Small Balls
    balls.forEach(b => {
        b.x += b.dx; b.y += b.dy;
        if(b.x < 0 || b.x > 450) b.dx *= -1;
        if(b.y < 0 || b.y > 450) b.dy *= -1;

        // Collision Check
        let dist = Math.hypot((b.x+25) - (tx+60), (b.y+25) - (ty+60));
        if(dist < 85) {
            damage *= b.mult;
            b.dx *= -1.05; b.dy *= -1.05; // Bounce and speed up
            
            // Update UI
            document.getElementById('dmg-display').innerText = "DAMAGE: " + (damage.toString().length > 15 ? "10^" + damage.toString().length : damage.toString());
            
            if(damage >= targetHp) {
                isError = true;
                document.getElementById('arena').classList.add('error');
                document.getElementById('dmg-display').innerText = "DAMAGE: ERROR";
            }
        }
        b.el.style.left = b.x + 'px';
        b.el.style.top = b.y + 'px';
    });

    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>

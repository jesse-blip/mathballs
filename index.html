<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQUARE ARENA - THE OG BUILD</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --border: 4px solid #000; --panel: #f4f4f9; --dark: #16213e; --accent: #e94560; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #1a1a2e; font-family: 'Roboto Condensed', sans-serif; overflow: hidden; height: 100vh; }

        /* --- THE 3-PANEL LAYOUT --- */
        #ui-layer { position: absolute; inset: 0; display: flex; padding: 20px; gap: 20px; background: #fff; z-index: 100; }
        
        .side-panel { flex: 0 0 320px; border: var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 8px 8px 0 rgba(0,0,0,0.1); }
        #panel-left { background: var(--panel); }
        #panel-right { background: var(--dark); color: #fff; }
        
        #center-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #eee; border: var(--border); }

        /* INPUTS & GRID */
        h2 { text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 5px; font-size: 1.2rem; margin-bottom: 5px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-top: 5px; color: #444; }
        input { width: 100%; padding: 8px; border: 3px solid #000; font-family: 'Share Tech Mono'; font-weight: bold; }
        
        .ball-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
        .ball-item { aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 1px 1px 0 #000; }
        .ball-item.selected { border-color: #000; transform: scale(1.1); box-shadow: 0 0 0 2px #fff, 4px 4px 0 rgba(0,0,0,0.2); z-index: 10; }

        /* 1:1 PREVIEW MAP */
        #map-1to1 { width: 400px; height: 400px; background: #fff; border: var(--border); position: relative; overflow: hidden; }
        .prev-target { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: #ddd; border: 2px solid #999; top: 140px; left: 140px; }
        #prev-ball { position: absolute; border-radius: 50%; border: 3px solid #000; display: flex; align-items: center; justify-content: center; }

        .start-btn { padding: 15px 50px; background: #00ff88; border: var(--border); font-size: 2rem; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #000; text-transform: uppercase; }
        .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }

        /* ARENA */
        #arena-view { display: none; position: absolute; inset: 0; background: #fdfaf0; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        #arena { width: 800px; height: 800px; background: #fff; border: 8px solid #000; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.1); }
        .entity { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        #target-hp { font-family: 'Share Tech Mono'; text-align: center; width: 80%; word-break: break-all; color: #222; }
        .dmg { position: absolute; font-size: 2.5rem; color: #ff4757; font-weight: 900; -webkit-text-stroke: 1.5px #000; animation: float 1s forwards; pointer-events: none; }
        @keyframes float { 0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-100px);} }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="side-panel" id="panel-left">
        <h2>LABORATORY</h2>
        <label>Target HP (Supports ^)</label>
        <input type="text" id="hp-in" value="10^20">
        <label>Time Limit (s)</label>
        <input type="number" id="time-in" value="30">
        <label>Ball Size (px)</label>
        <input type="range" id="size-in" min="30" max="90" value="50" oninput="updatePreview()">
        <label>Choose Ball</label>
        <div class="ball-grid" id="roster"></div>
    </div>

    <div id="center-zone">
        <h1 style="letter-spacing: -2px;">SQUARE ARENA</h1>
        <div id="map-1to1">
            <div class="prev-target"></div>
            <div id="prev-ball"></div>
        </div>
        <button class="start-btn" onclick="startBattle()">START</button>
    </div>

    <div class="side-panel" id="panel-right">
        <h2>DIRECTOR</h2>
        <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="script-on" style="width:20px; height:20px;">
            <label style="color:#fff; margin:0;">Active Steering</label>
        </div>
        <label style="color:#aaa;">Kill Time Goal (s)</label>
        <input type="number" id="kill-goal" value="29">
        <p style="font-size:0.8rem; margin-top:20px; color:#888;">The Director ensures the ball doesn't kill the target too early or too late.</p>
    </div>
</div>

<div id="arena-view">
    <div id="timer-ui" style="font-size:2rem; font-weight:900; margin-bottom:10px;">0.0s</div>
    <div id="arena">
        <div id="target" class="entity" style="background:#eee; border:2px solid #ccc; width:200px; height:200px;"><div id="target-hp"></div></div>
        <div id="ball" class="entity" style="border:4px solid #000; color:#fff; text-shadow:1px 1px 0 #000;"></div>
    </div>
</div>

<script>
const BALLS = [
    { s: "1x", c: "#f1c40f", v: 1n, t: 'm' }, { s: "2x", c: "#f39c12", v: 2n, t: 'm' }, 
    { s: "3x", c: "#e67e22", v: 3n, t: 'm' }, { s: "4x", c: "#d35400", v: 4n, t: 'm' },
    { s: "5x", c: "#e74c3c", v: 5n, t: 'm' }, { s: "6x", c: "#c0392b", v: 6n, t: 'm' }, 
    { s: "7x", c: "#8e44ad", v: 7n, t: 'm' }, { s: "8x", c: "#9b59b6", v: 8n, t: 'm' },
    { s: "9x", c: "#2980b9", v: 9n, t: 'm' }, { s: "10x", c: "#3498db", v: 10n, t: 'm' },
    { s: "√", c: "#1abc9c", t: 'rt' }, { s: "x²", c: "#16a085", v: 2n, t: 'e' }, 
    { s: "x³", c: "#27ae60", v: 3n, t: 'e' }, { s: "x/2", c: "#7f8c8d", t: 'h' }, 
    { s: "x/y", c: "#34495e", t: 'rv' }, { s: "#", c: "#e84118", t: 'pr' },
    { s: "⚡️", c: "#fbc531", t: 'pw' }, { s: "!", c: "#c23616", t: 'fc' }, 
    { s: "?", c: "#8c7ae6", t: 'rn' }, { s: "Φ", c: "#e84393", t: 'f1' }, 
    { s: "Tb", c: "#fd79a8", t: 'f2' }, { s: "Qd", c: "#6c5ce7", t: 'f3' }, 
    { s: "???", c: "#b2bec3", t: 'gb' }, { s: "+1", c: "#555", v: 1n, t: 'a' }
];

const PRIMES = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n, 41n, 43n, 47n];
let selected = BALLS[1];
let game = { active: false, hp: 0n, time: 0, b: {}, t: {x:300, y:300, vx:4, vy:4, r:100} };

function init() {
    const grid = document.getElementById('roster');
    BALLS.forEach(b => {
        let div = document.createElement('div');
        div.className = 'ball-item';
        div.style.background = b.c;
        div.innerText = b.s;
        div.onclick = () => { 
            selected = b; 
            document.querySelectorAll('.ball-item').forEach(el=>el.classList.remove('selected'));
            div.classList.add('selected');
            updatePreview();
        };
        if(b === selected) div.classList.add('selected');
        grid.appendChild(div);
    });
    updatePreview();
}

function updatePreview() {
    let r = document.getElementById('size-in').value;
    let p = document.getElementById('prev-ball');
    p.style.width = p.style.height = (r*2)+"px";
    p.style.background = selected.c;
    p.style.left = (200-r)+"px"; p.style.top = (200-r)+"px";
    p.innerText = selected.s;
}

function fmt(n) {
    let s = n.toString();
    if(s.length < 9) return s;
    return s.substring(0,4) + "..." + s.substring(s.length-4) + " (" + s.length + ")";
}

function startBattle() {
    let raw = document.getElementById('hp-in').value;
    game.hp = raw.includes('^') ? BigInt(raw.split('^')[0]) ** BigInt(raw.split('^')[1]) : BigInt(raw);
    game.time = 0;
    game.active = true;
    
    let r = parseInt(document.getElementById('size-in').value);
    game.b = { x:50, y:50, vx:10, vy:10, r:r, hits:0, pwr:selected.v || 1n, hist:[0n, 1n, 1n, 2n] };
    
    document.getElementById('ui-layer').style.display = 'none';
    document.getElementById('arena-view').style.display = 'flex';
    
    let bEl = document.getElementById('ball');
    bEl.style.width = bEl.style.height = (r*2)+"px";
    bEl.style.background = selected.c;
    bEl.innerText = selected.s;

    requestAnimationFrame(loop);
}

function loop() {
    if(!game.active) return;
    game.time += 0.016;
    document.getElementById('timer-ui').innerText = game.time.toFixed(1) + "s";

    // Simple Steering
    if(document.getElementById('script-on').checked) {
        let dx = (game.t.x + 100) - (game.b.x + game.b.r);
        let dy = (game.t.y + 100) - (game.b.y + game.b.r);
        let dist = Math.sqrt(dx*dx + dy*dy);
        let force = (game.time < document.getElementById('kill-goal').value - 1) ? -0.5 : 0.8;
        game.b.vx += (dx/dist) * force; game.b.vy += (dy/dist) * force;
    }

    // Physics
    [game.b, game.t].forEach(o => {
        o.x += o.vx; o.y += o.vy;
        let lim = 800 - (o.r ? o.r*2 : 200);
        if(o.x < 0 || o.x > lim) o.vx *= -1;
        if(o.y < 0 || o.y > lim) o.vy *= -1;
    });

    // Collision
    let dx = (game.b.x + game.b.r) - (game.t.x + 100);
    let dy = (game.b.y + game.b.r) - (game.t.y + 100);
    let dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < (game.b.r + 100)) {
        handleHit();
        game.b.vx *= -1.05; game.b.vy *= -1.05; // Bounce & speed up
    }

    document.getElementById('ball').style.transform = `translate(${game.b.x}px, ${game.b.y}px)`;
    document.getElementById('target').style.transform = `translate(${game.t.x}px, ${game.t.y}px)`;
    document.getElementById('target-hp').innerText = fmt(game.hp);

    if(game.hp <= 0n) { game.active = false; alert("DESTROYED"); location.reload(); }
    if(game.time > document.getElementById('time-in').value) { game.active = false; alert("FAILED"); location.reload(); }
    
    requestAnimationFrame(loop);
}

function handleHit() {
    let d = 1n;
    game.b.hits++;
    let n = BigInt(game.b.hits);
    
    switch(selected.t) {
        case 'm': game.b.pwr *= selected.v; d = game.b.pwr; break;
        case 'e': game.b.pwr = game.b.pwr ** selected.v; d = game.b.pwr; break;
        case 'rt': d = game.hp - BigInt(Math.floor(Math.sqrt(Number(game.hp.toString().substring(0,14))))) * 10n**BigInt(Math.max(0, game.hp.toString().length-14)); break;
        case 'h': d = game.hp / 2n; break;
        case 'rv': d = game.hp - (game.hp / (n+1n)); break;
        case 'pr': d = game.b.pwr * (PRIMES[game.b.hits % 15]); game.b.pwr = d; break;
        case 'pw': d = n ** n; break;
        case 'fc': game.b.pwr *= n; d = game.b.pwr; break;
        case 'rn': d = BigInt(Math.floor(Math.random()*1000000)); break;
        case 'f1': d = game.b.hist[3] + game.b.hist[2]; break;
        case 'f2': d = game.b.hist[3] + game.b.hist[2] + game.b.hist[1]; break;
        case 'f3': d = game.b.hist[3] + game.b.hist[2] + game.b.hist[1] + game.b.hist[0]; break;
        case 'gb': d = game.b.hist[3] * (Math.random() > 0.5 ? 2n : 0n); break;
        case 'a': game.b.pwr += selected.v; d = game.b.pwr; break;
    }
    
    game.hp = (d >= game.hp) ? 0n : game.hp - d;
    game.b.hist.shift(); game.b.hist.push(d);

    let popup = document.createElement('div');
    popup.className = 'dmg'; popup.innerText = "-"+fmt(d);
    popup.style.left = game.b.x+"px"; popup.style.top = game.b.y+"px";
    document.getElementById('arena').appendChild(popup);
    setTimeout(()=>popup.remove(), 1000);
}

init();
</script>
</body>
</html>

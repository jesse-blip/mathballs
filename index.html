<!DOCTYPE html>
<html>
<head>
    <title>Math Simulation</title>
    <style>
        body { background: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        
        #stats { text-align: center; margin-bottom: 10px; }
        #dmg-display { font-size: 2.5rem; font-weight: bold; color: #333; margin: 5px; }

        /* Fixed Square Box Perimeters */
        #arena { 
            width: 400px; height: 400px; background: white; 
            border: 10px solid #222; position: relative; overflow: hidden; 
        }

        /* The Big Ball */
        #target {
            position: absolute; width: 100px; height: 100px; background: #bbb; 
            border-radius: 50%; border: 4px solid #444; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-weight: bold; text-align: center;
        }

        /* The Active Ball */
        #active-ball {
            position: absolute; width: 50px; height: 50px; border-radius: 50%; 
            border: 3px solid #000; color: white; font-weight: bold;
            display: none; align-items: center; justify-content: center;
        }

        #menu { margin-top: 20px; display: flex; gap: 10px; padding: 10px; background: #333; border-radius: 8px; }
        .menu-btn { width: 50px; height: 50px; border-radius: 50%; cursor: pointer; border: 2px solid white; color: white; font-weight: bold; }
        input { padding: 5px; text-align: center; width: 150px; border: 2px solid #333; border-radius: 4px; }
    </style>
</head>
<body>

<div id="stats">
    TARGET HP: <input type="number" id="hp-input" value="1000000" oninput="updateHP()">
    <div id="dmg-display">10</div>
</div>

<div id="arena">
    <div id="target">
        <div>BIG BALL</div>
        <div id="t-hp">HP: 1,000,000</div>
    </div>
    <div id="active-ball"></div>
</div>

<div id="menu">
    <button class="menu-btn" style="background:#ff5722" onclick="setBall(2, '#ff5722')">2x</button>
    <button class="menu-btn" style="background:#2196f3" onclick="setBall(3, '#2196f3')">3x</button>
    <button class="menu-btn" style="background:#4caf50" onclick="setBall(4, '#4caf50')">4x</button>
    <button class="menu-btn" style="background:#ffeb3b; color:black" onclick="setBall(5, '#ffeb3b')">5x</button>
    <button class="menu-btn" style="background:#9c27b0" onclick="setBall(6, '#9c27b0')">6x</button>
</div>

<script>
let damage = 10n;
const target = { x: 150, y: 150, dx: 2, dy: 2, size: 100 };
const ball = { x: 0, y: 0, dx: 0, dy: 0, size: 50, active: false, mult: 1n };

function updateHP() {
    const val = document.getElementById('hp-input').value;
    document.getElementById('t-hp').innerText = "HP: " + Number(val).toLocaleString();
}

function setBall(m, color) {
    ball.active = true;
    ball.mult = BigInt(m);
    ball.x = 20; ball.y = 20;
    ball.dx = 5; ball.dy = 5;
    
    const el = document.getElementById('active-ball');
    el.style.display = 'flex';
    el.style.background = color;
    el.innerText = m + 'x';
}

function run() {
    // Big Ball Movement
    target.x += target.dx; target.y += target.dy;
    if(target.x <= 0 || target.x >= 300) target.dx *= -1;
    if(target.y <= 0 || target.y >= 300) target.dy *= -1;
    
    const tEl = document.getElementById('target');
    tEl.style.left = target.x + 'px';
    tEl.style.top = target.y + 'px';

    if(ball.active) {
        ball.x += ball.dx; ball.y += ball.dy;
        
        // Arena Perimeters (accounting for ball size)
        if(ball.x <= 0 || ball.x >= 350) ball.dx *= -1;
        if(ball.y <= 0 || ball.y >= 350) ball.dy *= -1;

        // Collision Logic
        let dist = Math.hypot((ball.x+25) - (target.x+50), (ball.y+25) - (target.y+50));
        if(dist < 75) {
            damage *= ball.mult;
            ball.dx *= -1; ball.dy *= -1;
            
            // Update Stats
            const dStr = damage.toString();
            document.getElementById('dmg-display').innerText = dStr.length > 15 ? "10^" + dStr.length : dStr;
            
            // Deduct from HP Input visually
            let currentHP = BigInt(document.getElementById('hp-input').value);
            let remaining = currentHP - damage;
            document.getElementById('t-hp').innerText = "HP: " + (remaining > 0n ? remaining.toLocaleString() : "0");
        }

        const bEl = document.getElementById('active-ball');
        bEl.style.left = ball.x + 'px';
        bEl.style.top = ball.y + 'px';
    }

    requestAnimationFrame(run);
}

run();
</script>
</body>
</html>

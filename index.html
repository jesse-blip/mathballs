<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Square Arena: Shatter-Point Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfaf0; --hero-red: #d92d20; --target-gray: #cbcbcb;
            --accent-gold: #ffcc00; --border-thin: 2px solid #000;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: var(--bg); font-family: 'Roboto Condensed', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* --- SETUP PANEL --- */
        #setup-ui {
            width: 1000px; background: white; border: 8px solid #000; padding: 40px; 
            display: flex; gap: 30px; box-shadow: 15px 15px 0px #000; z-index: 100;
        }
        .config-col { flex: 1.2; display: flex; flex-direction: column; gap: 12px; }
        .preview-col { flex: 0.8; background: #eee; border: 4px dashed #ccc; position: relative; display: flex; align-items: center; justify-content: center; }
        
        h1 { font-size: 3rem; line-height: 0.9; margin-bottom: 10px; font-weight: 900; }
        .input-grp { display: flex; flex-direction: column; gap: 4px; }
        label { font-weight: 900; text-transform: uppercase; font-size: 0.8rem; }
        input { padding: 12px; border: 4px solid #000; font-size: 1.2rem; font-weight: 900; }
        
        .mode-switch { display: flex; gap: 10px; }
        .m-btn { flex: 1; padding: 12px; border: 4px solid #000; background: #fff; font-weight: 900; cursor: pointer; }
        .m-btn.active { background: var(--accent-gold); transform: translateY(-3px); box-shadow: 0 4px 0 #000; }

        .ball-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .ball-item { aspect-ratio: 1/1; border-radius: 50%; border: 3px solid transparent; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 10px; cursor: pointer; }
        .ball-item.active { border-color: #000; transform: scale(1.1); }

        .btn-start { background: #2ecc71; color: white; padding: 20px; border: 6px solid #000; font-size: 2rem; font-weight: 900; cursor: pointer; margin-top: 10px; }

        /* --- GAME ENGINE --- */
        #screen-game { display: none; flex-direction: column; align-items: center; width: 100%; }
        .game-title { width: 900px; text-align: center; font-size: 2.2rem; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; min-height: 80px;}

        #arena { width: 700px; height: 700px; background: #fff; border: var(--border-thin); position: relative; overflow: visible; }
        
        #target-ball { position: absolute; background: var(--target-gray); border-radius: 50%; border: 1px solid #444; display: flex; align-items: center; justify-content: center; z-index: 5; }
        #target-val { color: white; font-weight: 900; text-align: center; text-shadow: 2px 2px 0px #000; padding: 10%; word-break: break-all; line-height: 0.9; font-family: 'Share Tech Mono', monospace; }

        #hero-ball { position: absolute; border-radius: 50%; border: 3px solid #000; display: flex; align-items: center; justify-content: center; color: #000; font-size: 50px; font-weight: 900; z-index: 10; }

        .dmg-pop { position: absolute; font-weight: 900; font-size: 26px; color: #ff4d4d; -webkit-text-stroke: 1.2px #000; pointer-events: none; z-index: 100; word-break: break-all; max-width: 400px; line-height: 0.75; animation: risePop 2s ease-out forwards; }
        @keyframes risePop { 0% { opacity: 1; transform: scale(0.8); } 100% { opacity: 0; transform: translateY(-150px) scale(1.2); } }

        .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 80; }

        .stat-footer { width: 700px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-box { background: #000; color: var(--accent-gold); padding: 15px; text-align: center; border: 4px solid #000; }
        .stat-val { font-size: 1.4rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<div id="setup-ui">
    <div class="config-col">
        <h1>ARENA<br>LABORATORY</h1>
        <div class="mode-switch">
            <button id="mb-timer" class="m-btn active" onclick="setMode('timer')">TIMER</button>
            <button id="mb-stop" class="m-btn" onclick="setMode('stopwatch')">STOPWATCH</button>
        </div>
        <div class="input-grp"><label>HP (Use ^ for exponents)</label><input type="text" id="in-hp" value="10^126"></div>
        <div class="input-grp" id="timer-box"><label>Seconds</label><input type="number" id="in-time" value="60"></div>
        <div class="input-grp"><label>Hero Roster</label><div id="hero-grid" class="ball-grid"></div></div>
        <button class="btn-start" onclick="beginSim()">START BATTLE</button>
    </div>
    <div class="preview-col">
        <div style="background:#ccc; border-radius:50%; position:absolute; width:360px; height:360px;"></div>
        <div id="pre-h" style="background:var(--hero-red); border:3px solid #000; border-radius:50%; position:absolute; width:120px; height:120px; z-index:2; display:flex; align-items:center; justify-content:center; font-size:40px;">√</div>
    </div>
</div>

<div id="screen-game">
    <div id="game-title" class="game-title"></div>
    <div id="arena">
        <div id="target-ball"><div id="target-val"></div></div>
        <div id="hero-ball"></div>
    </div>
    <div class="stat-footer">
        <div class="stat-box"><span style="color:#fff; font-size:10px;">LAST HIT (RAW)</span><div id="stat-last" class="stat-val">---</div></div>
        <div class="stat-box"><span style="color:#fff; font-size:10px;">NEXT HIT (EST)</span><div id="stat-next" class="stat-val">---</div></div>
    </div>
</div>

<script>
/** * REPLICA ENGINE v6.0 - Shatter Dynamics
 */
const L_NAMES = ["", "Thousand", "Million", "Billion", "Trillion", "Quadrillion", "Quintillion", "Sextillion", "Septillion", "Octillion", "Nonillion", "Decillion", "Undecillion", "Duodecillion", "Tredecillion", "Quattuordecillion", "Quindecillion", "Sexdecillion", "Septendecillion", "Octodecillion", "Novemdecillion", "Vigintillion", "Unvigintillion", "Duovigintillion", "Tresvigintillion", "Quattuorvigintillion", "Quinvigintillion", "Sexvigintillion", "Septenvigintillion", "Octovigintillion", "Novemvigintillion", "Trigintillion", "Untrigintillion", "Duotrigintillion", "Trestrigintillion", "Quadragintillion", "Unquadragintillion", "Duoquadragintillion", "Tresquadragintillion", "Quattuorquadragintillion", "Quinquadragintillion", "Sexquadragintillion", "Septenquadragintillion", "Octoquadragintillion", "Novemquadragintillion", "Quinquagintillion", "Unquinquagintillion", "Duoquinquagintillion", "Tresquinquagintillion", "Quattuorquinquagintillion", "Quinquinquagintillion", "Sexquinquagintillion", "Septenquinquagintillion", "Octoquinquagintillion", "Novemquinquagintillion", "Sexagintillion", "Septuagintillion", "Octogintillion", "Nonagintillion", "Centillion"];
const S_NAMES = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Od", "Nd", "Vg", "Uvg", "Dvg", "Tvg", "Qvg", "Qivg", "Sxg", "Spg", "Ovg", "Nvg", "Tg", "Utg", "Dtg", "Ttg", "Qtg", "Uq", "Dq", "Tq", "Qq", "Qiq", "Sxq", "Spq", "Oq", "Nq", "Qing"];

let state = {
    active: false, mode: 'timer', hp: 0n, initHP: 0n, timer: 0, elapsed: 0, lastTs: 0,
    hero: { x: 50, y: 50, vx: 10, vy: 9, r: 60, type: 'root', val: 0n, label: '√', color: '#d92d20', pwr: 2n, name: 'Rooter' },
    target: { x: 250, y: 200, vx: -3, vy: 4, r: 180, mass: 35 }
};

const BALLS = [
    {n:"Rooter", t:"root", v:0n, l:"√", c:"#d92d20"}, {n:"Doubler", t:"mult", v:2n, l:"2x", c:"#e67e22"},
    {n:"Tripler", t:"mult", v:3n, l:"3x", c:"#f1c40f"}, {n:"Quadrupler", t:"mult", v:4n, l:"4x", c:"#2ecc71"},
    {n:"Quintupler", t:"mult", v:5n, l:"5x", c:"#1abc9c"}, {n:"Sextupler", t:"mult", v:6n, l:"6x", c:"#3498db"},
    {n:"Septupler", t:"mult", v:7n, l:"7x", c:"#9b59b6"}, {n:"Octupler", t:"mult", v:8n, l:"8x", c:"#34495e"},
    {n:"Nonupler", t:"mult", v:9n, l:"9x", c:"#7f8c8d"}, {n:"Decupler", t:"mult", v:10n, l:"10x", c:"#273c75"},
    {n:"Squarer", t:"exp", v:2n, l:"x²", c:"#44bd32"}, {n:"Cuber", t:"exp", v:3n, l:"x³", c:"#0097e6"},
    {n:"Halver", t:"half", v:0n, l:"x/2", c:"#718093"}, {n:"Quarter", t:"quarter", v:0n, l:"x/4", c:"#2f3640"},
    {n:"Reverser", t:"rev", v:0n, l:"x/y", c:"#8c7ae6"}
];

const SFX = {
    ctx: null,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    hit() { this.play(70, 0.4, 'sine', 0.4, 10); },
    boom() { this.play(150, 0.6, 'sawtooth', 0.8, 20); },
    play(f, v, t, d, s) {
        this.init(); const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, this.ctx.currentTime);
        if(s) o.frequency.exponentialRampToValueAtTime(s, this.ctx.currentTime + d);
        g.gain.setValueAtTime(v, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + d);
    }
};

function setMode(m) {
    state.mode = m;
    document.getElementById('mb-timer').className = m==='timer'?'m-btn active':'m-btn';
    document.getElementById('mb-stop').className = m==='stopwatch'?'m-btn active':'m-btn';
    document.getElementById('timer-box').style.display = m==='timer' ? 'flex' : 'none';
}

function buildGrid() {
    const g = document.getElementById('hero-grid');
    BALLS.forEach(b => {
        const d = document.createElement('div'); d.className = 'ball-item'; d.style.background = b.c; d.innerText = b.l;
        if(b.n === "Rooter") d.classList.add('active');
        d.onclick = () => {
            document.querySelectorAll('.ball-item').forEach(x=>x.classList.remove('active'));
            d.classList.add('active'); Object.assign(state.hero, { type: b.t, val: b.v, label: b.l, color: b.c, name: b.n });
            document.getElementById('pre-h').innerText = b.l; document.getElementById('pre-h').style.background = b.c;
        };
        g.appendChild(d);
    });
}

function format(n, full = false) {
    if (n === 0n) return "0";
    let s = n.toString();
    if (s.length >= 127 && !full) return (n / 10n**BigInt(s.length-1)).toString() + "e" + (s.length-1);
    let tier = Math.floor((s.length - 1) / 3);
    let names = full ? L_NAMES : S_NAMES;
    if (tier < names.length) return (n / 10n**BigInt(tier * 3)) + " " + names[tier];
    return (n / 10n**BigInt(s.length-1)).toString() + "e" + (s.length-1);
}

function explode(x, y, color, count=40) {
    SFX.boom();
    for(let i=0; i<count; i++) {
        const p = document.createElement('div'); p.className = 'particle';
        const size = Math.random()*15 + 5;
        p.style.width = p.style.height = size+"px"; p.style.background = color;
        p.style.left = x+"px"; p.style.top = y+"px";
        document.getElementById('arena').appendChild(p);
        const vx = (Math.random()-0.5)*25, vy = (Math.random()-0.5)*25;
        let px = x, py = y;
        let life = 1.0;
        const pLoop = () => {
            if(life <= 0) { p.remove(); return; }
            px += vx; py += vy; life -= 0.02;
            p.style.left = px+"px"; p.style.top = py+"px"; p.style.opacity = life;
            requestAnimationFrame(pLoop);
        };
        pLoop();
    }
}

function beginSim() {
    const raw = document.getElementById('in-hp').value;
    try { state.hp = raw.includes('^') ? BigInt(raw.split('^')[0])**BigInt(raw.split('^')[1]) : BigInt(raw); } catch(e) { state.hp = 1000n; }
    state.initHP = state.hp;
    state.timer = parseFloat(document.getElementById('in-time').value) * 1000;
    state.elapsed = 0;
    document.getElementById('setup-ui').style.display = 'none';
    document.getElementById('screen-game').style.display = 'flex';
    document.getElementById('hero-ball').style.background = state.hero.color;
    document.getElementById('hero-ball').innerText = state.hero.label;
    state.active = true; state.lastTs = performance.now(); loop();
}

function calcHit() {
    let d = 0n;
    if (state.hero.type === 'root') {
        let s = state.hp.toString();
        let rt = BigInt(Math.floor(Math.sqrt(Number(s.substring(0, 14))))) * 10n**BigInt(Math.max(0, s.length-14));
        d = state.hp - rt;
    } 
    else if (state.hero.type === 'mult' || state.hero.type === 'exp') d = state.hero.pwr;
    else if (state.hero.type === 'half') d = state.hp / 2n;
    else if (state.hero.type === 'quarter') d = (state.hp * 3n) / 4n;
    else if (state.hero.type === 'rev') d = state.hp - (state.hp / BigInt(state.hero.hits + 2));
    return d > 0n ? d : 1n;
}

function loop() {
    if (!state.active) return;
    const now = performance.now(), dt = (now - state.lastTs); state.lastTs = now;
    const header = document.getElementById('game-title');
    const targetStr = format(state.initHP, true);

    if (state.mode === 'timer') {
        state.timer -= dt;
        header.innerHTML = `Can ${state.hero.name} deal ${targetStr} damage in ${(Math.max(0, state.timer/1000)).toFixed(1)} seconds?`;
        if (state.timer <= 0) {
            state.active = false;
            explode(state.hero.x + state.hero.r, state.hero.y + state.hero.r, state.hero.color);
            setTimeout(() => location.reload(), 2000); return;
        }
    } else {
        state.elapsed += dt;
        header.innerHTML = `How long for ${state.hero.name} to deal ${targetStr} damage?<br>${(state.elapsed/1000).toFixed(1)} Seconds`;
    }

    // Motion
    state.hero.x += state.hero.vx; state.hero.y += state.hero.vy;
    state.target.x += state.target.vx; state.target.y += state.target.vy;

    const sz = 700;
    [state.hero, state.target].forEach(b => {
        if(b.x < 0 || b.x > sz - b.r*2) { b.vx *= -1; b.x = b.x < 0 ? 0 : sz - b.r*2; }
        if(b.y < 0 || b.y > sz - b.r*2) { b.vy *= -1; b.y = b.y < 0 ? 0 : sz - b.r*2; }
    });

    // Drawing
    const hEl = document.getElementById('hero-ball'), tEl = document.getElementById('target-ball');
    hEl.style.transform = `translate(${state.hero.x}px, ${state.hero.y}px)`; hEl.style.width = hEl.style.height = (state.hero.r*2)+"px";
    tEl.style.transform = `translate(${state.target.x}px, ${state.target.y}px)`; tEl.style.width = tEl.style.height = (state.target.r*2)+"px";

    const hpS = state.hp.toString();
    document.getElementById('target-val').innerText = hpS;
    
    // SMART FONT: Only wrap if digits > 8 and too large
    let charLen = hpS.length;
    let baseF = state.target.r * 0.95;
    if (charLen > 6) {
        baseF = (state.target.r * 2.2) / Math.sqrt(charLen * 1.5);
    }
    document.getElementById('target-val').style.fontSize = Math.min(baseF, state.target.r * 0.8) + "px";

    // Collision
    let dx = (state.hero.x + state.hero.r) - (state.target.x + state.target.r), dy = (state.hero.y + state.hero.r) - (state.target.y + state.target.r), dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < (state.hero.r + state.target.r)) {
        SFX.hit(); let hit = calcHit();
        const p = document.createElement('div'); p.className = 'dmg-pop'; p.innerText = hit.toString();
        p.style.left = state.hero.x + "px"; p.style.top = state.hero.y + "px";
        document.getElementById('arena').appendChild(p); setTimeout(() => p.remove(), 2000);

        state.hp = hit >= state.hp ? 0n : state.hp - hit;
        document.getElementById('stat-last').innerText = hit.toString().substring(0,15) + (hit.toString().length>15?"...":"");
        
        if(state.hero.type==='mult') state.hero.pwr *= state.hero.val;
        if(state.hero.type==='exp' && state.hero.pwr.toString().length < 500) state.hero.pwr = state.hero.pwr ** state.hero.val;
        state.hero.hits++;
        document.getElementById('stat-next').innerText = format(calcHit());

        let nx = dx/dist, ny = dy/dist, pV = 2 * (state.hero.vx*nx + state.hero.vy*ny - state.target.vx*nx - state.target.vy*ny) / (1 + state.target.mass);
        state.hero.vx -= pV * state.target.mass * nx; state.hero.vy -= pV * state.target.mass * ny;
        state.target.vx += pV * nx; state.target.vy += pV * ny;
        state.hero.x += nx * 5; state.hero.y += ny * 5;

        if (state.hp <= 0n) {
            state.active = false;
            explode(state.target.x + state.target.r, state.target.y + state.target.r, "#ccc", 100);
            setTimeout(() => location.reload(), 3000); return;
        }
    }
    requestAnimationFrame(loop);
}
buildGrid();
</script>
</body>
</html>

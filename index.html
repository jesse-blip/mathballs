<script>
let totalDamage = 0n;
const ballSpeed = 7;
const target = { x: 150, y: 150, dx: 1.5, dy: 1.5, radius: 50 };
const ball = { x: 0, y: 0, dx: 0, dy: 0, active: false, currentPower: 0n, multiplier: 0n, radius: 25 };

function resetAll() {
    totalDamage = 0n;
    document.getElementById('dmg-display').innerText = "0";
    target.x = 150; target.y = 150;
    target.dx = 1.5; target.dy = 1.5;

    const hpVal = document.getElementById('hp-input').value.replace(/,/g, '');
    try {
        document.getElementById('t-hp').innerText = BigInt(hpVal).toLocaleString();
    } catch(e) {
        document.getElementById('t-hp').innerText = "0";
    }
}

function setBall(m, color) {
    resetAll(); 
    ball.active = true;
    ball.multiplier = BigInt(m);
    ball.currentPower = BigInt(m); // Start at face value (e.g., 2)
    ball.x = 20; ball.y = 20;
    
    let angle = Math.random() * Math.PI * 2;
    ball.dx = Math.cos(angle) * ballSpeed;
    ball.dy = Math.sin(angle) * ballSpeed;
    
    const el = document.getElementById('active-ball');
    el.style.display = 'flex';
    el.style.background = color;
    el.innerText = m + "x";
    
    // Update display to show the starting power immediately
    document.getElementById('dmg-display').innerText = ball.currentPower.toString();
}

function run() {
    target.x += target.dx;
    target.y += target.dy;
    if(target.x <= 0 || target.x >= 300) target.dx *= -1;
    if(target.y <= 0 || target.y >= 300) target.dy *= -1;
    
    document.getElementById('target').style.left = target.x + 'px';
    document.getElementById('target').style.top = target.y + 'px';

    if(ball.active) {
        ball.x += ball.dx; ball.y += ball.dy;
        if(ball.x <= 0 || ball.x >= 350) ball.dx *= -1;
        if(ball.y <= 0 || ball.y >= 350) ball.dy *= -1;

        let dx = (ball.x + 25) - (target.x + 50);
        let dy = (ball.y + 25) - (target.y + 50);
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 75) {
            // FIX: Multiply the power, then update display with CURRENT power
            // We aren't adding to a "Total" anymore, just tracking the ball's growth
            let pStr = ball.currentPower.toString();
            
            // Update UI with the ball's current value
            document.getElementById('dmg-display').innerText = pStr.length > 15 ? "10^" + pStr.length : pStr;
            
            // Health Logic: Subtract current power from health
            const targetMaxHP = BigInt(document.getElementById('hp-input').value.replace(/,/g, ''));
            let remaining = targetMaxHP - ball.currentPower;
            let remStr = remaining > 0n ? remaining.toString() : "0";
            document.getElementById('t-hp').innerText = remStr.length > 12 ? "10^" + remStr.length : remaining.toLocaleString();

            // Prepare for next hit
            ball.currentPower = ball.currentPower * ball.multiplier;

            // Physics
            let nx = dx / distance; 
            let ny = dy / distance; 
            target.dx -= nx * 1.5; 
            target.dy -= ny * 1.5;
            let dot = ball.dx * nx + ball.dy * ny;
            ball.dx = (ball.dx - 2 * dot * nx);
            ball.dy = (ball.dy - 2 * dot * ny);
            ball.x += nx * 5; ball.y += ny * 5; // Anti-stuck
        }

        document.getElementById('active-ball').style.left = ball.x + 'px';
        document.getElementById('active-ball').style.top = ball.y + 'px';
    }
    requestAnimationFrame(run);
}
run();
</script>

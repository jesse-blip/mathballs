<!DOCTYPE html>
<html>
<head>
    <title>Bouncing Math Battle</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; margin: 0; overflow: hidden; text-align: center; }
        #ui { position: absolute; top: 10px; width: 100%; pointer-events: none; }
        .stat-box { background: rgba(0,0,0,0.7); border: 1px solid #333; padding: 10px; display: inline-block; pointer-events: auto; border-radius: 10px; }
        input { background: #000; color: #0f0; border: 1px solid #555; text-align: center; width: 150px; }
        #damage-text { font-size: 2.5rem; color: #00ffff; font-family: monospace; text-shadow: 0 0 10px #00ffff; margin: 10px; }
        canvas { display: block; }
        .error-screen { animation: shake 0.1s infinite; color: red !important; text-shadow: 0 0 20px red !important; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat-box">
        TARGET HP: <input type="text" id="target-hp" value="1000000000000"><br>
        <div id="damage-text">DAMAGE: 10</div>
        <div id="digit-count">Digits: 2</div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let damage = 10n;
let isError = false;

// The Big Ball (Target)
const target = { x: canvas.width/2, y: canvas.height/2, radius: 80, color: '#bc13fe' };

// The 5 Bouncing Balls
const ballTypes = [
    { val: 2, color: '#00d2ff', label: '2x' },
    { val: 3, color: '#ff00ff', label: '3x' },
    { val: 4, color: '#33ff00', label: '4x' },
    { val: 5, color: '#ffea00', label: '5x' },
    { val: 6, color: '#ff5722', label: '6x' }
];

class Ball {
    constructor(type) {
        this.type = type;
        this.radius = 30;
        this.x = Math.random() * (canvas.width - 60) + 30;
        this.y = Math.random() * (canvas.height - 60) + 30;
        this.dx = (Math.random() - 0.5) * 8;
        this.dy = (Math.random() - 0.5) * 8;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
        ctx.fillStyle = this.type.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.type.color;
        ctx.fill();
        ctx.closePath();
        
        ctx.fillStyle = "white";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.fillText(this.type.label, this.x, this.y + 6);
        ctx.shadowBlur = 0;
    }

    update() {
        if (isError) return;

        // Bounce off walls
        if (this.x + this.radius > canvas.width || this.x - this.radius < 0) this.dx *= -1;
        if (this.y + this.radius > canvas.height || this.y - this.radius < 0) this.dy *= -1;

        // Collision with Big Ball
        const dist = Math.hypot(this.x - target.x, this.y - target.y);
        if (dist < this.radius + target.radius) {
            this.handleHit();
            // Bounce away
            this.dx *= -1.1; // Speed up slightly on hit
            this.dy *= -1.1;
            // Push out to prevent getting stuck
            this.x += this.dx * 2;
            this.y += this.dy * 2;
        }

        this.x += this.dx;
        this.y += this.dy;
        this.draw();
    }

    handleHit() {
        damage *= BigInt(this.type.val);
        const dStr = damage.toString();
        const targetHp = BigInt(document.getElementById('target-hp').value.replace(/,/g,''));
        
        const txt = document.getElementById('damage-text');
        const cnt = document.getElementById('digit-count');

        if (damage >= targetHp) {
            isError = true;
            txt.innerText = "DAMAGE: ERROR";
            txt.classList.add('error-screen');
            cnt.innerText = "SYSTEM OVERLOAD: " + dStr.length + " DIGITS";
        } else {
            txt.innerText = dStr.length < 15 ? "DAMAGE: " + dStr : "DAMAGE: " + dStr.substring(0,10) + "...";
            cnt.innerText = "Digits: " + dStr.length;
        }
    }
}

const balls = ballTypes.map(t => new Ball(t));

function animate() {
    ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; // Trail effect
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Big Ball
    ctx.beginPath();
    ctx.arc(target.x, target.y, target.radius, 0, Math.PI*2);
    ctx.fillStyle = isError ? 'red' : target.color;
    ctx.shadowBlur = isError ? 50 : 30;
    ctx.shadowColor = isError ? 'red' : target.color;
    ctx.fill();
    ctx.closePath();

    balls.forEach(b => b.update());
    requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    target.x = canvas.width/2;
    target.y = canvas.height/2;
});
</script>
</body>
</html>

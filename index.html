<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Arena: 400-Line Ironclad Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* --- CSS ARCHITECTURE --- */
        :root {
            --bg-deep: #050505;
            --panel-bg: #111111;
            --accent-primary: #00f2ff;
            --accent-danger: #ff0055;
            --text-main: #e0e0e0;
            --border-ui: 2px solid #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { 
            background-color: var(--bg-deep); 
            font-family: 'Orbitron', sans-serif; 
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- DASHBOARD --- */
        #setup-dashboard {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex;
            padding: 30px;
            gap: 30px;
            z-index: 1000;
            border: 10px solid #000;
        }

        .side-panel {
            flex: 0 0 350px;
            background: var(--panel-bg);
            border: var(--border-ui);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        h1 { font-size: 1.2rem; letter-spacing: 3px; color: var(--accent-primary); border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 10px; }
        
        .input-block { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.7rem; text-transform: uppercase; color: #888; font-weight: 900; }
        input[type="text"], input[type="number"], select {
            background: #000;
            border: 1px solid #444;
            color: var(--accent-primary);
            padding: 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            outline: none;
        }

        /* --- HERO GRID --- */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            background: #000;
            border: 1px solid #222;
        }
        .hero-node {
            aspect-ratio: 1/1;
            border-radius: 4px;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            opacity: 0.6;
        }
        .hero-node.active { border-color: var(--accent-primary); opacity: 1; box-shadow: 0 0 15px var(--accent-primary); transform: scale(1.05); }

        /* --- SCRIPT ENGINE --- */
        .script-box {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 15px;
            border-left: 4px solid var(--accent-danger);
        }
        .grayed-out { opacity: 0.2; pointer-events: none; filter: grayscale(1); }

        /* --- ARENA --- */
        #preview-box {
            width: 600px;
            height: 600px;
            background: #000;
            border: 4px solid #222;
            position: relative;
            overflow: hidden;
        }

        #game-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #arena-title {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 2.2rem;
            font-weight: 900;
            max-width: 900px;
            text-transform: uppercase;
        }

        #arena {
            width: 750px;
            height: 750px;
            background: #0a0a0a;
            border: 8px solid #333;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .ball { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .hero-ball { border: 2px solid #fff; z-index: 10; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .target-ball { background: #222; border: 1px solid #444; color: #fff; z-index: 5; font-family: 'Share Tech Mono', monospace; text-align: center; line-height: 0.9; }

        .btn-start {
            padding: 20px 60px;
            font-size: 1.5rem;
            background: var(--accent-primary);
            color: #000;
            border: none;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .dmg-float {
            position: absolute;
            color: #ff0055;
            font-weight: 900;
            pointer-events: none;
            z-index: 100;
            font-size: 2rem;
            animation: riseFade 1s ease-out forwards;
        }

        @keyframes riseFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        .stats {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
        .stat-item {
            background: #111;
            padding: 15px 30px;
            border: 1px solid #222;
            text-align: center;
        }
        .stat-val { display: block; font-size: 1.5rem; color: var(--accent-primary); font-family: 'Share Tech Mono'; }
    </style>
</head>
<body>

<div id="setup-dashboard">
    <div class="side-panel">
        <h1>Laboratory</h1>
        <div class="input-block">
            <label>Target Vitality (Math Allowed)</label>
            <input type="text" id="inp-hp" value="10^63">
        </div>
        <div class="input-block">
            <label>Time Limit (Seconds)</label>
            <input type="number" id="inp-time" value="30">
        </div>
        <div class="input-block">
            <label>Select Your Weapon</label>
            <div id="hero-grid" class="hero-grid"></div>
        </div>
        <div class="input-block">
            <label>Hero Size</label>
            <input type="range" id="sl-hero" min="20" max="80" value="50">
        </div>
    </div>

    <div class="main-stage">
        <div id="preview-box"></div>
        <button class="btn-start" onclick="Engine.start()">INITIATE COMBAT</button>
    </div>

    <div class="side-panel">
        <h1 style="color:var(--accent-danger)">Logic Scripting</h1>
        <div class="script-box">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                <input type="checkbox" id="chk-enable-script" onchange="UI.toggleScripting()">
                <label style="color: #fff;">Enable Script Engine</label>
            </div>
            
            <div id="script-controls" class="grayed-out">
                <div style="display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); padding:10px; margin-bottom:15px; border:1px solid #444;">
                    <input type="checkbox" id="chk-lsh" onchange="UI.toggleLSH()">
                    <label style="color: var(--accent-primary); font-size: 0.65rem;">Last Second Heroics</label>
                </div>

                <div id="madlib-group">
                    <label>Victory Condition</label>
                    <select id="sl-script-type" onchange="UI.updateMadlib()">
                        <option value="time">Exact Time Window</option>
                        <option value="walls">Wall Contact Count</option>
                    </select>
                    <div id="madlib-time" style="margin-top:10px;">
                        Must die between <input type="number" id="sc-t1" style="width:60px; padding:2px;" value="28"> and <input type="number" id="sc-t2" style="width:60px; padding:2px;" value="30">s.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="game-view">
    <div id="arena-title"></div>
    <div id="arena"></div>
    <div class="stats">
        <div class="stat-item"><label>PREVIOUS HIT</label><span id="stat-prev" class="stat-val">0</span></div>
        <div class="stat-item"><label>NEXT PROJECTED</label><span id="stat-next" class="stat-val">0</span></div>
    </div>
</div>

<script>
/**
 * --- ENGINE ARCHITECTURE ---
 * Minimum 400 Lines Implementation
 */

// 1. DATA & CONSTANTS
const LARGE_NAMES = [
    "", "Thousand", "Million", "Billion", "Trillion", "Quadrillion", "Quintillion", 
    "Sextillion", "Septillion", "Octillion", "Nonillion", "Decillion", "Undecillion", 
    "Duodecillion", "Tredecillion", "Quattuordecillion", "Quindecillion", "Sexdecillion", 
    "Septendecillion", "Octodecillion", "Novemdecillion", "Vigintillion", "Unvigintillion", 
    "Duovigintillion", "Trestrigintillion", "Quattuorvigintillion", "Quinvigintillion", 
    "Sexvigintillion", "Septenvigintillion", "Octovigintillion", "Novemvigintillion", 
    "Trigintillion", "Untrigintillion", "Duotrigintillion", "Trestrigintillion", 
    "Quadragintillion", "Quinquagintillion", "Sexagintillion", "Septuagintillion", 
    "Octogintillion", "Nonagintillion", "Centillion"
];

const HERO_ROSTER = [
    { id: 'prim', n: "Primorum", sym: "#", c: "#9b59b6", desc: "Product of first n primes" },
    { id: 'pow', n: "Power", sym: "⚡️", c: "#f1c40f", desc: "n to the power of n" },
    { id: 'fact', n: "Factorial", sym: "!", c: "#e67e22", desc: "Standard factorial n!" },
    { id: 'rand', n: "Randomizer", sym: "?", c: "#1abc9c", desc: "Cumulative random x1-100" },
    { id: 'fib', n: "Fibonacci", sym: "Φ", c: "#3498db", desc: "Additive sequence" },
    { id: 'tri', n: "Tribonacci", sym: "Tb", c: "#2980b9", desc: "3-step additive" },
    { id: 'quad', n: "Quadrinacci", sym: "Qd", c: "#34495e", desc: "4-step additive" },
    { id: 'gamb', n: "Gamblinacci", sym: "???", c: "#d35400", desc: "Variable alpha additive" }
];

// 2. THE AUDIO CONTROLLER (Dampened)
const AudioSystem = {
    ctx: null,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playHit(freq, vol) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    },
    clack() { this.playHit(800, 0.02); }, // Very soft wall hit
    crunch() { this.playHit(150, 0.1); }  // Collision hit
};

// 3. THE NUMBER LEXICON (No Scientific Notation)
function formatLargeNumber(n, full = false) {
    if (n === 0n) return "0";
    let s = n.toString();
    let length = s.length;
    let tier = Math.floor((length - 1) / 3);
    
    if (tier === 0) return s;
    
    let name = LARGE_NAMES[tier] || "Infinity";
    let decimalPart = "";
    
    // For small view (abbr), show 1 decimal
    if (!full) {
        let lead = s.substring(0, length - (tier * 3));
        let next = s.substring(lead.length, lead.length + 2);
        return lead + "." + next + " " + name.substring(0, 3);
    }
    
    // For Title (Full Names)
    let lead = s.substring(0, length - (tier * 3));
    return lead + " " + name;
}

// 4. THE PHYSICS & GAME ENGINE
const Engine = {
    active: false,
    timer: 0,
    wallHits: 0,
    lastTs: 0,
    hp: 0n,
    maxHp: 0n,
    hero: null,
    target: null,
    history: [],
    primes: [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n, 41n, 43n, 47n, 53n, 59n, 61n, 67n, 71n, 73n, 79n, 83n, 89n, 97n],

    start() {
        const hpInp = document.getElementById('inp-hp').value;
        try {
            if(hpInp.includes('^')) {
                let parts = hpInp.split('^');
                this.hp = BigInt(parts[0]) ** BigInt(parts[1]);
            } else {
                this.hp = BigInt(hpInp);
            }
        } catch(e) { this.hp = 1000000n; }
        
        this.maxHp = this.hp;
        this.timer = 0;
        this.wallHits = 0;
        this.history = [0n, 1n, 1n, 2n]; // Seed for nacci sequences
        
        // Randomize or Scripted?
        const isScripted = document.getElementById('chk-enable-script').checked;
        
        this.hero = {
            x: isScripted ? 100 : Math.random() * 200,
            y: isScripted ? 100 : Math.random() * 200,
            vx: isScripted ? 12 : (Math.random() * 10 + 5),
            vy: isScripted ? 8 : (Math.random() * 10 + 5),
            r: parseInt(document.getElementById('sl-hero').value),
            hits: 0,
            data: JSON.parse(JSON.stringify(UI.selectedHero))
        };

        this.target = {
            x: isScripted ? 400 : (300 + Math.random() * 200),
            y: isScripted ? 300 : (200 + Math.random() * 200),
            vx: isScripted ? -3 : (Math.random() * 6 - 3),
            vy: isScripted ? 4 : (Math.random() * 6 - 3),
            r: 100
        };

        UI.hideDashboard();
        this.active = true;
        this.lastTs = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    },

    calculateDamage(n) {
        const type = this.hero.data.id;
        const hit = BigInt(n + 1);
        
        switch(type) {
            case 'prim':
                // Product of first n primes
                let prod = 1n;
                for(let i=0; i<n+1; i++) {
                    if(this.primes[i]) prod *= this.primes[i];
                    else prod *= 101n; // Fallback
                }
                return prod;
            case 'pow':
                return hit ** hit;
            case 'fact':
                let f = 1n;
                for(let i=1n; i<=hit; i++) f *= i;
                return f;
            case 'rand':
                let r = BigInt(Math.floor(Math.random() * 100) + 1);
                if(this.history.length === 0) this.history.push(10n);
                let lastR = this.history[this.history.length-1];
                let newR = lastR * r;
                this.history.push(newR);
                return newR;
            case 'fib':
                let fib = this.history[this.history.length-1] + this.history[this.history.length-2];
                this.history.push(fib);
                return fib;
            case 'tri':
                let tri = this.history[this.history.length-1] + this.history[this.history.length-2] + this.history[this.history.length-3];
                this.history.push(tri);
                return tri;
            case 'quad':
                let qd = this.history[this.history.length-1] + this.history[this.history.length-2] + this.history[this.history.length-3] + this.history[this.history.length-4];
                this.history.push(qd);
                return qd;
            case 'gamb':
                let a = 0.5 + Math.random() * 1.5;
                let g = BigInt(Math.floor(Number(this.history[this.history.length-1]) * a)) + this.history[this.history.length-2];
                this.history.push(g);
                return g;
            default: return 1n;
        }
    },

    loop(ts) {
        if(!this.active) return;
        const dt = (ts - this.lastTs) / 1000;
        this.lastTs = ts;
        this.timer += dt;

        // Sub-stepping physics for stability
        for(let i=0; i<4; i++) { this.updatePhysics(dt/4); }

        this.draw();
        this.checkBounds();

        const isLSH = document.getElementById('chk-lsh').checked && document.getElementById('chk-enable-script').checked;
        const limit = parseFloat(document.getElementById('inp-time').value);

        // UI Logic
        const title = document.getElementById('arena-title');
        if(isLSH) {
            let rem = Math.max(0, limit - this.timer);
            title.innerHTML = `Can <span style="color:${this.hero.data.c}">${this.hero.data.n}</span> deal ${formatLargeNumber(this.maxHp, true)} damage in ${rem.toFixed(1)}s?`;
            if(this.timer >= limit && this.hp > 0n) this.endGame(false);
        } else if(document.getElementById('chk-enable-script').checked) {
            title.innerText = `SCRIPT ACTIVE: ${this.wallHits} WALL HITS | ${this.timer.toFixed(1)}s`;
        } else {
            let rem = Math.max(0, limit - this.timer);
            title.innerHTML = `Time Attack: ${rem.toFixed(1)}s Remaining`;
            if(this.timer >= limit && this.hp > 0n) this.endGame(false);
        }

        if(this.hp <= 0n) this.endGame(true);
        else requestAnimationFrame((t) => this.loop(t));
    },

    updatePhysics(dt) {
        const h = this.hero;
        const t = this.target;

        h.x += h.vx; h.y += h.vy;
        t.x += t.vx; t.y += t.vy;

        // Wall collisions
        const bounds = 750;
        [h, t].forEach(b => {
            if(b.x < 0) { b.x = 0; b.vx *= -1; this.onWallHit(); }
            if(b.x > bounds - b.r*2) { b.x = bounds - b.r*2; b.vx *= -1; this.onWallHit(); }
            if(b.y < 0) { b.y = 0; b.vy *= -1; this.onWallHit(); }
            if(b.y > bounds - b.r*2) { b.y = bounds - b.r*2; b.vy *= -1; this.onWallHit(); }
        });

        // Circle collision
        let dx = (h.x + h.r) - (t.x + t.r);
        let dy = (h.y + h.r) - (t.y + t.r);
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < h.r + t.r) {
            this.onCollide(dx, dy, dist);
        }
    },

    onWallHit() {
        this.wallHits++;
        AudioSystem.clack();
    },

    onCollide(dx, dy, dist) {
        AudioSystem.crunch();
        let dmg = this.calculateDamage(this.hero.hits);
        
        // SCRIPTED LOGIC: Last Second Heroics
        const isLSH = document.getElementById('chk-lsh').checked && document.getElementById('chk-enable-script').checked;
        if(isLSH) {
            const limit = parseFloat(document.getElementById('inp-time').value);
            // If it's the final second, make the hit lethal
            if(this.timer >= limit - 0.8) {
                dmg = this.hp;
            } else {
                // Otherwise, prevent it from dying early
                if(dmg >= this.hp) dmg = this.hp / 2n;
            }
        }

        this.hp = dmg >= this.hp ? 0n : this.hp - dmg;
        this.hero.hits++;

        // Stats UI
        document.getElementById('stat-prev').innerText = formatLargeNumber(dmg);

        // Bounce physics
        let nx = dx / dist;
        let ny = dy / dist;
        let s = hV = (this.hero.vx * nx + this.hero.vy * ny);
        this.hero.vx -= 2 * hV * nx;
        this.hero.vy -= 2 * hV * ny;
        this.target.vx += hV * nx * 0.5;
        this.target.vy += hV * ny * 0.5;

        this.spawnDmg(this.hero.x, this.hero.y, dmg);
    },

    spawnDmg(x, y, v) {
        const el = document.createElement('div');
        el.className = 'dmg-float';
        el.innerText = "-" + formatLargeNumber(v);
        el.style.left = x + "px";
        el.style.top = y + "px";
        document.getElementById('arena').appendChild(el);
        setTimeout(() => el.remove(), 1000);
    },

    draw() {
        const hEl = document.getElementById('hero-ball-render');
        const tEl = document.getElementById('target-ball-render');
        const txt = document.getElementById('target-text');

        hEl.style.transform = `translate(${this.hero.x}px, ${this.hero.y}px)`;
        tEl.style.transform = `translate(${this.target.x}px, ${this.target.y}px)`;
        
        txt.innerText = this.hp.toString();
        // Dynamic font size for large numbers
        let len = this.hp.toString().length;
        txt.style.fontSize = Math.max(12, 40 - (len / 4)) + "px";
    },

    checkBounds() {
        // Bounds logic included in updatePhysics
    },

    endGame(win) {
        this.active = false;
        let finalWin = win;
        const isScripted = document.getElementById('chk-enable-script').checked;
        const isLSH = document.getElementById('chk-lsh').checked;

        // Custom script conditions (Not LSH)
        if(isScripted && !isLSH && win) {
            const type = document.getElementById('sl-script-type').value;
            if(type === 'time') {
                const t1 = parseFloat(document.getElementById('sc-t1').value);
                const t2 = parseFloat(document.getElementById('sc-t2').value);
                finalWin = (this.timer >= t1 && this.timer <= t2);
            }
        }

        alert(finalWin ? "OBJECTIVE CLEAR: TARGET ELIMINATED" : "MISSION FAILURE: TARGET SURVIVED");
        location.reload();
    }
};

// 5. UI CONTROLLER
const UI = {
    selectedHero: HERO_ROSTER[0],

    init() {
        const grid = document.getElementById('hero-grid');
        HERO_ROSTER.forEach(h => {
            const node = document.createElement('div');
            node.className = 'hero-node';
            node.style.background = h.c;
            node.innerText = h.sym;
            node.title = h.desc;
            node.onclick = () => {
                document.querySelectorAll('.hero-node').forEach(n => n.classList.remove('active'));
                node.classList.add('active');
                this.selectedHero = h;
            };
            if(h.id === 'prim') node.classList.add('active');
            grid.appendChild(node);
        });
    },

    toggleScripting() {
        const enabled = document.getElementById('chk-enable-script').checked;
        const box = document.getElementById('script-controls');
        enabled ? box.classList.remove('grayed-out') : box.classList.add('grayed-out');
    },

    toggleLSH() {
        const lsh = document.getElementById('chk-lsh').checked;
        const group = document.getElementById('madlib-group');
        lsh ? group.classList.add('grayed-out') : group.classList.remove('grayed-out');
    },

    updateMadlib() {
        // Handle visual changes for scripting madlibs
    },

    hideDashboard() {
        document.getElementById('setup-dashboard').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';
        
        const arena = document.getElementById('arena');
        arena.innerHTML = `
            <div id="hero-ball-render" class="ball hero-ball" style="width:${Engine.hero.r*2}px; height:${Engine.hero.r*2}px; background:${this.selectedHero.c}">${this.selectedHero.sym}</div>
            <div id="target-ball-render" class="ball target-ball" style="width:200px; height:200px;">
                <div id="target-text" style="word-break: break-all; padding: 20px;"></div>
            </div>
        `;
    }
};

UI.init();

</script>
</body>
</html>

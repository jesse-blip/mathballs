<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Arena: Sequence & Series</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a2e; --panel-light: #f4f4f9; --panel-dark: #16213e;
            --accent: #e94560; --border-thick: 4px solid #000;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg); font-family: 'Roboto Condensed', sans-serif; height: 100vh; overflow: hidden; color: #fff; }

        /* --- SETUP DASHBOARD --- */
        #setup-dashboard {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 100; display: flex; padding: 20px; gap: 20px; color: #000;
        }
        .col-config { flex: 0 0 300px; display: flex; flex-direction: column; gap: 15px; background: var(--panel-light); padding: 20px; border: var(--border-thick); box-shadow: 10px 10px 0 rgba(0,0,0,0.1); overflow-y: auto; }
        .col-arena { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ddd; border: var(--border-thick); position: relative; }
        .col-script { flex: 0 0 340px; display: flex; flex-direction: column; gap: 15px; background: var(--panel-dark); color: #fff; padding: 20px; border: var(--border-thick); box-shadow: 10px 10px 0 rgba(0,0,0,0.4); }
        
        h2 { text-transform: uppercase; font-weight: 900; border-bottom: 3px solid #000; padding-bottom: 5px; margin-bottom: 10px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.8rem; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 3px solid #000; font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; }
        
        .ball-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .ball-opt { aspect-ratio: 1/1; border-radius: 50%; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 900; cursor: pointer; transition: 0.1s; }
        .ball-opt.selected { border-color: #000; transform: scale(1.1); box-shadow: 0 0 0 2px #fff, 4px 4px 0 #000; z-index: 2; }

        .mad-lib { font-size: 1rem; line-height: 1.6; margin-bottom: 10px; }
        .mad-input { width: 60px; padding: 4px; border: 2px solid var(--accent); background: #0f3460; color: #fff; font-family: monospace; text-align: center; }
        .mad-select { padding: 4px; border: 2px solid var(--accent); background: #0f3460; color: #fff; font-weight: bold; }
        
        #preview-container { width: 700px; height: 700px; background: #fff; border: 2px solid #000; position: relative; overflow: hidden; }
        .btn-start { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #00ff88; color: #000; padding: 15px 50px; border: 4px solid #000; font-size: 2rem; font-weight: 900; cursor: pointer; z-index: 200; box-shadow: 0 5px 0 #000; }

        /* --- ARENA VIEW --- */
        #game-view { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: #fdfaf0; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: #000; }
        #arena-title { width: 950px; text-align: center; font-size: 2.2rem; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; line-height: 1.1; min-height: 100px; }
        #arena { width: 700px; height: 700px; background: #fff; border: 6px solid #000; position: relative; }
        
        .ball-render { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .b-target { background: #cbcbcb; border: 1px solid #555; z-index: 5; }
        .b-hero { border: 3px solid #000; font-weight: 900; z-index: 10; color: #000; }
        
        #target-text { color: #fff; font-weight: 900; text-align: center; text-shadow: 2px 2px 0 #000; padding: 8%; font-family: 'Share Tech Mono', monospace; line-height: 0.85; width: 100%; word-break: break-all; }
        #stats-bar { width: 700px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-card { background: #000; color: #fff; padding: 15px; border: 4px solid #000; text-align: center; }
        .stat-num { font-size: 1.6rem; font-weight: 900; color: #00ff88; display: block; }
    </style>
</head>
<body>

<div id="setup-dashboard">
    <div class="col-config">
        <h2>Laboratory</h2>
        <div class="input-group"><label>Target HP</label><input type="text" id="inp-hp" value="10^100"></div>
        <div id="basic-modes">
            <div class="input-group"><label>Mode</label>
                <select id="sel-mode" style="width:100%; padding:10px; border:3px solid #000; font-weight:900;" onchange="updateModeUI()">
                    <option value="timer">Time Attack</option>
                    <option value="stopwatch">Stopwatch</option>
                </select>
            </div>
            <div class="input-group" id="grp-time"><label>Time Limit (s)</label><input type="number" id="inp-time" value="30"></div>
        </div>
        <div class="input-group"><label>The Math Roster</label><div id="hero-grid" class="ball-grid"></div></div>
        <div class="input-group"><label>Hero Size</label><input type="range" id="sl-hero" min="30" max="100" value="60" oninput="updatePreview()"></div>
    </div>

    <div class="col-arena">
        <div id="preview-container">
            <div id="prev-target" class="ball-render b-target"></div>
            <div id="prev-hero" class="ball-render b-hero"></div>
        </div>
        <button class="btn-start" onclick="launchGame()">START BATTLE</button>
    </div>

    <div class="col-script">
        <h2 style="color:var(--accent); border-color:var(--accent);">Script Engine</h2>
        <div style="display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.1); padding:12px; border:2px solid #444;">
            <input type="checkbox" id="chk-script" style="width:22px; height:22px;" onchange="toggleScriptUI()"><label style="margin:0; color:#fff; font-size:1rem;">Enable Scripting</label>
        </div>
        
        <div id="script-options" style="opacity: 0.3; pointer-events: none;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px; background:rgba(0,255,136,0.1); padding:10px; border:1px solid #00ff88;">
                <input type="checkbox" id="chk-last-sec" style="width:18px; height:18px;" onchange="toggleLSH()"><label style="margin:0; color:#00ff88;">Last Second Heroics</label>
            </div>

            <div id="madlib-container">
                <div class="mad-lib">Target must die 
                    <select id="sl-cond-type" class="mad-select" onchange="updateScriptSubUI()">
                        <option value="time">at exact time</option>
                        <option value="wall">after wall hits</option>
                    </select>
                </div>
                <div id="cond-time"><div class="mad-lib">Between <input type="number" id="sc-t1" class="mad-input" value="28">s and <input type="number" id="sc-t2" class="mad-input" value="30">s.</div></div>
                <div id="cond-wall" style="display:none;"><div class="mad-lib">Within <input type="number" id="sc-delay" class="mad-input" value="2">s after hitting the wall <input type="number" id="sc-hits" class="mad-input" value="10"> times.</div></div>
            </div>
        </div>
    </div>
</div>

<div id="game-view">
    <div id="arena-title"></div>
    <div id="arena">
        <div id="target" class="ball-render b-target"><div id="target-text"></div></div>
        <div id="hero" class="ball-render b-hero"></div>
    </div>
    <div id="stats-bar">
        <div class="stat-card"><span style="font-size:10px; color:#888;">PREV HIT</span><span id="val-last" class="stat-num">---</span></div>
        <div class="stat-card"><span style="font-size:10px; color:#888;">NEXT HIT</span><span id="val-next" class="stat-num">---</span></div>
    </div>
</div>

<script>
// NEW ROSTER IMPLEMENTATION
const HEROES = [
    {n:"Primorum", t:"prim", l:"#", c:"#9b59b6", hist: [1n]},
    {n:"Power", t:"pow", l:"⚡️", c:"#f1c40f"},
    {n:"Factorial", t:"fact", l:"!", c:"#e67e22", hist: [1n]},
    {n:"Randomizer", t:"rand", l:"?", c:"#1abc9c", hist: [10n]},
    {n:"Fibonacci", t:"fib", l:"Φ", c:"#3498db", hist: [0n, 1n]},
    {n:"Tribonacci", t:"tri", l:"Tb", c:"#2980b9", hist: [0n, 0n, 1n]},
    {n:"Quadrinacci", t:"quad", l:"Qd", c:"#2c3e50", hist: [0n, 0n, 0n, 1n]},
    {n:"Gamblinacci", t:"gamb", l:"???", c:"#d35400", hist: [0n, 1n], a: 1.5}
];

const NAMES_FULL = ["", "Thousand", "Million", "Billion", "Trillion", "Quadrillion", "Quintillion", "Sextillion", "Septillion", "Octillion", "Nonillion", "Decillion", "Undecillion", "Duodecillion", "Tredecillion", "Quattuordecillion", "Quindecillion", "Sexdecillion", "Septendecillion", "Octodecillion", "Novemdecillion", "Vigintillion", "Unvigintillion", "Duovigintillion", "Trestrigintillion", "Quattuorvigintillion", "Quinvigintillion", "Sexvigintillion", "Septenvigintillion", "Octovigintillion", "Novemvigintillion", "Trigintillion", "Untrigintillion", "Duotrigintillion", "Trestrigintillion", "Quadragintillion", "Quinquagintillion", "Sexagintillion", "Septuagintillion", "Octogintillion", "Nonagintillion", "Centillion"];
const NAMES_ABBR = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Od", "Nd", "Vg", "Uvg", "Dvg", "Tvg", "Qvg", "Qivg", "Sxg", "Spg", "Ovg", "Nvg", "Tg", "Utg", "Dtg", "Ttg", "Qtg", "Uq", "Dq", "Tq", "Qq", "Qiq", "Sxq", "Spq", "Oq", "Nq", "Qing"];

let conf = { hero: JSON.parse(JSON.stringify(HEROES[0])), target: {r:180, mass:30}, mode: "timer", scriptEnabled: false, lsh: false };
let sim = { active: false, hp: 0n, initHP: 0n, elapsed: 0, wallHits: 0, lastWallTime: 0, lastTs: 0 };

const SFX = {
    ctx: null, init(){ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
    hit(){ this.play(120,'sine',0.1,0.2); }, clack(){ this.play(600,'square',0.03,0.05); }, boom(){ this.play(55,'sawtooth',0.8,0.3,1); },
    play(f,t,d,v,s=0){ this.init(); const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type=t; o.frequency.setValueAtTime(f, this.ctx.currentTime); if(s) o.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime+d); g.gain.setValueAtTime(v, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+d); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+d); }
};

function format(n, full = false) {
    if(n === 0n) return "0";
    let s = n.toString();
    let tier = Math.floor((s.length - 1) / 3);
    let arr = full ? NAMES_FULL : NAMES_ABBR;
    if (tier === 0) return s;
    let base = n / 10n**BigInt(tier * 3);
    return base.toString() + " " + (arr[tier] || "Cosmic");
}

function isPrime(num) {
    for(let i = 2, s = Math.sqrt(num); i <= s; i++) if(num % i === 0) return false;
    return num > 1;
}

function getNthPrime(n) {
    let count = 0; let num = 2;
    while (count < n) { if(isPrime(num)) count++; if(count < n) num++; }
    return BigInt(num);
}

function getDmg(h, n) {
    n = n + 1; // n is current hit count starting from 0
    switch(h.t) {
        case 'prim':
            let p = getNthPrime(n);
            h.hist[0] *= p;
            return h.hist[0];
        case 'pow':
            return BigInt(n) ** BigInt(n);
        case 'fact':
            h.hist[0] *= BigInt(n);
            return h.hist[0];
        case 'rand':
            let r = BigInt(Math.floor(Math.random() * 100) + 1);
            h.hist[0] *= r;
            return h.hist[0];
        case 'fib':
            let nextFib = h.hist[h.hist.length-1] + h.hist[h.hist.length-2];
            h.hist.push(nextFib);
            return nextFib;
        case 'tri':
            let nextTri = h.hist[h.hist.length-1] + h.hist[h.hist.length-2] + h.hist[h.hist.length-3];
            h.hist.push(nextTri);
            return nextTri;
        case 'quad':
            let nextQuad = h.hist[h.hist.length-1] + h.hist[h.hist.length-2] + h.hist[h.hist.length-3] + h.hist[h.hist.length-4];
            h.hist.push(nextQuad);
            return nextQuad;
        case 'gamb':
            let aVal = h.a; 
            let nextGamb = BigInt(Math.floor(Number(h.hist[h.hist.length-1]) * aVal)) + h.hist[h.hist.length-2];
            h.hist.push(nextGamb);
            return nextGamb;
        default: return 1n;
    }
}

function physicsStep(state, h, t, isSim) {
    h.x += h.vx; h.y += h.vy; t.x += t.vx; t.y += t.vy;
    let hitW = false; const sz = 700;
    [h, t].forEach(b => {
        if(b.x < 0 || b.x > sz-b.r*2) { b.vx*=-1; b.x = b.x<0?0:sz-b.r*2; hitW=true; }
        if(b.y < 0 || b.y > sz-b.r*2) { b.vy*=-1; b.y = b.y<0?0:sz-b.r*2; hitW=true; }
    });
    if(hitW) { state.wallHits++; state.lastWallTime = state.elapsed; if(!isSim) SFX.clack(); }
    
    let dx = (h.x+h.r)-(t.x+t.r), dy = (h.y+h.r)-(t.y+t.r), dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < h.r+t.r) {
        if(!isSim) SFX.hit();
        let dmg = getDmg(h, h.hits);
        
        if(!isSim && conf.scriptEnabled && conf.lsh) {
            let limit = parseFloat(document.getElementById('inp-time').value);
            if (state.elapsed >= limit - 0.8) dmg = state.hp; 
            else if (dmg >= state.hp) dmg = state.hp / 2n;
        }

        state.hp = dmg >= state.hp ? 0n : state.hp - dmg;
        if(!isSim) { 
            document.getElementById('val-last').innerText = format(dmg);
            spawnDmg(h.x, h.y, dmg);
        }
        h.hits++;
        let nx=dx/dist, ny=dy/dist, pV = 2*(h.vx*nx + h.vy*ny - t.vx*nx - t.vy*ny)/(1 + t.mass);
        h.vx -= pV*t.mass*nx; h.vy -= pV*t.mass*ny; t.vx += pV*nx; t.vy += pV*ny;
        h.x += nx*2; h.y += ny*2;
        if(state.hp <= 0n) return true;
    }
    return false;
}

function launchGame() {
    const rawHPStr = document.getElementById('inp-hp').value;
    sim.hp = rawHPStr.includes('^') ? BigInt(rawHPStr.split('^')[0])**BigInt(rawHPStr.split('^')[1]) : BigInt(rawHPStr);
    sim.initHP = sim.hp; sim.elapsed = 0; sim.wallHits = 0; sim.active = true; sim.lastTs = performance.now();
    
    conf.hero.hits = 0;
    // Reset history buffers for fresh run
    if(conf.hero.t === 'prim' || conf.hero.t === 'fact') conf.hero.hist = [1n];
    if(conf.hero.t === 'rand') conf.hero.hist = [10n];
    if(conf.hero.t === 'fib') conf.hero.hist = [0n, 1n];
    if(conf.hero.t === 'tri') conf.hero.hist = [0n, 0n, 1n];
    if(conf.hero.t === 'quad') conf.hero.hist = [0n, 0n, 0n, 1n];
    if(conf.hero.t === 'gamb') { conf.hero.hist = [0n, 1n]; conf.hero.a = 0.5 + Math.random() * 1.5; }

    if (!conf.scriptEnabled) {
        conf.hero.x = Math.random() * 200; conf.hero.y = Math.random() * 200;
        conf.target.x = 300 + Math.random() * 200; conf.target.y = 300 + Math.random() * 200;
        conf.hero.vx = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 5);
        conf.hero.vy = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 5);
        conf.target.vx = (Math.random() > 0.5 ? 1 : -1) * 4; conf.target.vy = (Math.random() > 0.5 ? 1 : -1) * 3;
    } else {
        conf.hero.x = 50; conf.hero.y = 50; conf.hero.vx = 12; conf.hero.vy = 10;
        conf.target.x = 350-conf.target.r; conf.target.y = 350-conf.target.r; conf.target.vx = -4; conf.target.vy = 3;
    }

    document.getElementById('setup-dashboard').style.display = 'none';
    document.getElementById('game-view').style.display = 'flex';
    document.getElementById('hero').style.background = conf.hero.c;
    document.getElementById('hero').innerText = conf.hero.l;
    document.getElementById('hero').style.width = document.getElementById('hero').style.height = (conf.hero.r*2)+"px";
    document.getElementById('target').style.width = document.getElementById('target').style.height = (conf.target.r*2)+"px";
    document.getElementById('hero').style.display = document.getElementById('target').style.display = 'flex';
    requestAnimationFrame(gameLoop);
}

function spawnDmg(x, y, v) {
    const e = document.createElement('div'); e.className = 'dmg-float'; e.innerText = v.toString();
    e.style.left = x+"px"; e.style.top = y+"px"; document.getElementById('arena').appendChild(e);
    setTimeout(()=>e.remove(), 1200);
}

function gameLoop(ts) {
    if(!sim.active) return;
    const dt = (ts - sim.lastTs)/1000; sim.lastTs = ts; sim.elapsed += dt;
    const killed = physicsStep(sim, conf.hero, conf.target, false);
    
    const h = document.getElementById('hero'), t = document.getElementById('target'), txt = document.getElementById('target-text');
    h.style.transform = `translate(${conf.hero.x}px, ${conf.hero.y}px)`;
    t.style.transform = `translate(${conf.target.x}px, ${conf.target.y}px)`;
    
    txt.innerText = sim.hp.toString();
    txt.style.fontSize = sim.hp.toString().length < 10 ? (conf.target.r*0.8)+"px" : Math.min((conf.target.r*2)/Math.sqrt(sim.hp.toString().length*1.5), conf.target.r*0.6)+"px";

    const title = document.getElementById('arena-title'), hName = `<span style="color:${conf.hero.c}">${conf.hero.n}</span>`, goal = format(sim.initHP, true);
    
    if (conf.scriptEnabled && !conf.lsh) {
        title.innerHTML = `Script: ${sim.wallHits} Wall Hits | ${sim.elapsed.toFixed(1)}s`;
    } else {
        if(conf.mode === 'timer' || conf.lsh) {
            let rem = parseFloat(document.getElementById('inp-time').value) - sim.elapsed;
            title.innerHTML = `Can ${hName} deal ${goal} damage in ${Math.max(0, rem).toFixed(1)}s?`;
            if(rem <= 0 && !killed) endGame(false);
        } else {
            title.innerHTML = `${hName} vs ${goal}<br>${sim.elapsed.toFixed(1)}s Elapsed`;
        }
    }

    // Next hit preview needs a non-destructive check, but since we modify history on call, we just approximate or show current
    document.getElementById('val-next').innerText = "Scaling...";
    if(killed) endGame(true); else requestAnimationFrame(gameLoop);
}

function endGame(victory) {
    sim.active = false; SFX.boom();
    let isWin = victory;
    if(conf.scriptEnabled && !conf.lsh && victory) {
        const type = document.getElementById('sl-cond-type').value;
        if(type === 'time') isWin = (sim.elapsed >= parseFloat(document.getElementById('sc-t1').value) && sim.elapsed <= parseFloat(document.getElementById('sc-t2').value));
        else isWin = (sim.wallHits >= parseInt(document.getElementById('sc-hits').value) && (sim.elapsed - sim.lastWallTime) <= parseFloat(document.getElementById('sc-delay').value));
    }
    const ball = victory ? document.getElementById('target') : document.getElementById('hero');
    const x = (victory ? conf.target.x+conf.target.r : conf.hero.x+conf.hero.r);
    const y = (victory ? conf.target.y+conf.target.r : conf.hero.y+conf.hero.r);
    ball.style.display = 'none';
    for(let i=0; i<50; i++) {
        const s = document.createElement('div'); s.className='shard'; s.style.width=s.style.height=(Math.random()*15+5)+"px";
        s.style.background = victory ? '#ccc' : conf.hero.c; s.style.left=x+"px"; s.style.top=y+"px";
        document.getElementById('arena').appendChild(s);
        const a=Math.random()*6.28, v=Math.random()*12; let vx=Math.cos(a)*v, vy=Math.sin(a)*v, l=1, px=x, py=y;
        const anim = () => { if(l<=0){s.remove();return;} px+=vx; py+=vy; l-=0.02; s.style.left=px+"px"; s.style.top=py+"px"; s.style.opacity=l; requestAnimationFrame(anim); }; anim();
    }
    setTimeout(() => { alert(isWin ? "GOAL ACHIEVED" : "MISSION FAILED"); location.reload(); }, 2000);
}

function toggleScriptUI() {
    conf.scriptEnabled = document.getElementById('chk-script').checked;
    const opt = document.getElementById('script-options');
    opt.style.opacity = conf.scriptEnabled ? "1" : "0.3";
    opt.style.pointerEvents = conf.scriptEnabled ? "all" : "none";
    document.getElementById('basic-modes').style.opacity = conf.scriptEnabled ? "0.4" : "1";
    toggleLSH();
}

function toggleLSH() {
    conf.lsh = document.getElementById('chk-last-sec').checked;
    const mad = document.getElementById('madlib-container');
    mad.style.opacity = (conf.lsh && conf.scriptEnabled) ? "0.2" : "1";
    mad.style.pointerEvents = (conf.lsh && conf.scriptEnabled) ? "none" : "all";
}

function updateModeUI() { conf.mode = document.getElementById('sel-mode').value; }
function updateScriptSubUI() {
    document.getElementById('cond-time').style.display = document.getElementById('sl-cond-type').value==='time'?'block':'none'; 
    document.getElementById('cond-wall').style.display = document.getElementById('sl-cond-type').value==='wall'?'block':'none'; 
}

function init() {
    const g = document.getElementById('hero-grid');
    HEROES.forEach((h, i) => {
        const d = document.createElement('div'); d.className = `ball-opt ${i===0?'selected':''}`;
        d.style.background = h.c; d.innerText = h.l;
        d.onclick = () => {
            document.querySelectorAll('.ball-opt').forEach(b => b.classList.remove('selected'));
            d.classList.add('selected'); 
            conf.hero = JSON.parse(JSON.stringify(h)); 
            updatePreview();
        };
        g.appendChild(d);
    });
    updatePreview();
}

init();
</script>
</body>
</html>

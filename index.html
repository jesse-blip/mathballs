    document.getElementById('cond-wall').style.display = document.getElementById('sl-cond-type').value==='wall'?'block':'none'; 
}

function init() {
    const g = document.getElementById('hero-grid');
    HEROES.forEach((h, i) => {
        const d = document.createElement('div'); d.className = `ball-opt ${i===0?'selected':''}`;
        d.style.background = h.c; d.innerText = h.l;
        d.onclick = () => {
            document.querySelectorAll('.ball-opt').forEach(b => b.classList.remove('selected'));
            d.classList.add('selected'); 
            conf.hero = JSON.parse(JSON.stringify(h)); 
            updatePreview();
        };
        g.appendChild(d);
    });
    updatePreview();
}

init();

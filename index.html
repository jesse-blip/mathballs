<!DOCTYPE html>
<html>
<head>
    <title>Math Ball Sandbox</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', monospace; text-align: center; padding-top: 50px; }
        .setup-box { background: #333; padding: 20px; border-radius: 10px; border: 2px solid #555; display: inline-block; margin-bottom: 20px; }
        input { background: #000; color: #0f0; border: 1px solid #555; padding: 8px; width: 200px; text-align: center; font-size: 1.2rem; }
        #damage-display { font-size: 3rem; color: #00ff00; margin: 30px 0; min-height: 100px; text-shadow: 0 0 10px #00ff00; }
        .ball-row { display: flex; justify-content: center; gap: 15px; }
        .ball { 
            width: 80px; height: 80px; border-radius: 50%; border: 4px solid white;
            background: #ff5722; color: white; cursor: pointer; font-size: 1.5rem; font-weight: bold;
            transition: transform 0.1s;
        }
        .ball:active { transform: scale(0.9); background: #e64a19; }
        .error { color: #ff0000 !important; text-shadow: 0 0 20px #ff0000; animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }
    </style>
</head>
<body>

    <div class="setup-box">
        <label>SET BIG BALL HEALTH:</label><br><br>
        <input type="text" id="target-hp" value="1000000000">
    </div>

    <div id="damage-display">DAMAGE: 10</div>
    <div id="digit-count" style="color: #888;">Digits: 2</div>

    <div class="ball-row">
        <button class="ball" onclick="hit(2)">2x</button>
        <button class="ball" onclick="hit(3)">3x</button>
        <button class="ball" onclick="hit(4)">4x</button>
        <button class="ball" onclick="hit(5)">5x</button>
        <button class="ball" onclick="hit(6)">6x</button>
    </div>

    <script>
        // "n" at the end of numbers tells JavaScript to use "Infinite Math" mode (BigInt)
        let damage = 10n; 

        function hit(multiplier) {
            // Get health from input and convert to BigInt
            let rawHp = document.getElementById("target-hp").value;
            let targetHp = BigInt(rawHp.replace(/,/g, '')); // Clean out commas if user types them

            // Multiply
            damage = damage * BigInt(multiplier);
            
            let dStr = damage.toString();
            let display = document.getElementById("damage-display");
            let count = document.getElementById("digit-count");

            // CHECK FOR ERROR (Target Destroyed)
            if (damage >= targetHp) {
                display.innerText = "DAMAGE: ERROR";
                display.classList.add("error");
                count.innerText = "BIG BALL DESTROYED AT " + dStr.length + " DIGITS";
            } else {
                // Formatting the display
                if (dStr.length < 15) {
                    display.innerText = "DAMAGE: " + dStr;
                } else {
                    display.innerText = "DAMAGE: " + dStr.substring(0, 12) + "...";
                }
                count.innerText = "Digits: " + dStr.length;
            }
        }
    </script>
</body>
</html>

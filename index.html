<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQUARE ARENA | OG MASTER BUILD</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0c29; --panel: #ffffff; --dark: #16213e; --accent: #e94560; --border: 4px solid #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: var(--bg); font-family: 'Roboto Condensed', sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        /* --- DASHBOARD --- */
        #dashboard { position: absolute; inset: 0; display: flex; background: #f0f0f0; padding: 25px; gap: 25px; z-index: 1000; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .panel { border: var(--border); background: var(--panel); box-shadow: 8px 8px 0 rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 20px; }
        
        #lab-panel { flex: 0 0 340px; overflow-y: auto; }
        #center-panel { flex: 1; align-items: center; justify-content: center; gap: 15px; background: #ddd; }
        #director-panel { flex: 0 0 340px; background: var(--dark); color: #fff; }

        h1 { font-size: 3rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; margin-bottom: 5px; }
        h2 { font-size: 1.4rem; text-transform: uppercase; border-bottom: 4px solid #000; margin-bottom: 10px; }
        label { display: block; font-weight: 900; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 4px; color: #333; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 3px solid #000; font-family: 'Share Tech Mono'; font-weight: bold; }
        
        /* 1:1 MAP & SLIDERS */
        #map-1to1 { width: 400px; height: 400px; background: #fff; border: 6px solid #000; position: relative; overflow: hidden; box-shadow: 10px 10px 0 rgba(0,0,0,0.1); }
        .prev-ent { position: absolute; border-radius: 50%; border: 3px solid #000; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; text-shadow: 1px 1px 0 #000; }
        #prev-target { background: #eee; border-color: #ccc; color: #888; text-shadow: none; }
        
        .map-controls { width: 400px; display: flex; flex-direction: column; gap: 8px; background: #fff; padding: 10px; border: var(--border); }
        .map-controls label { margin: 0; font-size: 0.7rem; display: flex; justify-content: space-between; }

        /* ROSTER */
        .roster { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #e0e0e0; padding: 8px; border: 2px solid #bbb; }
        .ball-slot { aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; text-shadow: 1px 1px 0 #000; font-weight: 900; }
        .ball-slot.active { border-color: #000; transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 5; }

        /* MODES */
        .mode-toggle { display: flex; gap: 5px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 8px; border: 3px solid #000; font-weight: 900; cursor: pointer; background: #fff; }
        .mode-btn.active { background: #000; color: #fff; }
        .grayed { opacity: 0.3; pointer-events: none; }

        .btn-start { padding: 12px 50px; background: #00ff88; border: 5px solid #000; font-size: 2rem; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #000; }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }

        /* --- ARENA --- */
        #game-view { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; background: #fdfaf0; z-index: 200; }
        #arena { width: 800px; height: 800px; background: #fff; border: 10px solid #000; position: relative; overflow: hidden; }
        .entity { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        #timer-ui { font-size: 4rem; font-weight: 900; margin-bottom: 10px; letter-spacing: -2px; }
        #target-hp { font-family: 'Share Tech Mono'; width: 90%; text-align: center; word-break: break-all; line-height: 0.8; }
        .dmg-pop { position: absolute; font-size: 2.5rem; color: var(--accent); font-weight: 900; -webkit-text-stroke: 1.5px #000; animation: float 1s forwards; pointer-events: none; z-index: 500; }
        @keyframes float { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

<div id="dashboard">
    <div class="panel" id="lab-panel">
        <h2>Laboratory</h2>
        <label>Target HP</label>
        <input type="text" id="hp-in" value="10^15">
        
        <label style="margin-top: 15px;">Game Mode</label>
        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-timer" onclick="UI.setMode('timer')">TIMER</button>
            <button class="mode-btn" id="btn-stop" onclick="UI.setMode('stopwatch')">STOPWATCH</button>
        </div>

        <div id="limit-box">
            <label>Time Limit (s)</label>
            <input type="number" id="time-in" value="30">
        </div>

        <label style="margin-top: 15px;">Arsenal</label>
        <div class="roster" id="roster-grid"></div>
    </div>

    <div class="panel" id="center-panel">
        <h1>Square Arena</h1>
        <div id="map-1to1">
            <div id="prev-target" class="prev-ent">T</div>
            <div id="prev-ball" class="prev-ent"></div>
        </div>
        <div class="map-controls">
            <label>Hero Size: <span id="val-hero">50</span>px <input type="range" id="size-hero" min="20" max="80" value="50" oninput="UI.sync()"></label>
            <label>Target Size: <span id="val-target">100</span>px <input type="range" id="size-target" min="50" max="150" value="100" oninput="UI.sync()"></label>
        </div>
        <button class="btn-start" onclick="Engine.start()">START</button>
    </div>

    <div class="panel" id="director-panel">
        <h2 style="color:var(--accent); border-color:var(--accent);">Director AI</h2>
        <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="ai-on" style="width:20px; height:20px;">
            <label style="color:#fff; margin:0;">Steering Engine</label>
        </div>
        <label style="color:#aaa; margin-top:10px;">Kill Time Target (s)</label>
        <input type="number" id="kill-at" value="29.5" step="0.1">
    </div>
</div>

<div id="game-view">
    <div id="timer-ui">00.00</div>
    <div id="arena">
        <div id="target" class="entity" style="background:#f5f5f5; border:3px solid #ddd;">
            <div id="target-hp"></div>
        </div>
        <div id="hero" class="entity" style="border:5px solid #000; color:#fff; text-shadow:1px 1px 0 #000;"></div>
    </div>
</div>

<script>
const BALLS = [
    { s: "1x", c: "#f1c40f", v: 1n, t: 'm' }, { s: "2x", c: "#f39c12", v: 2n, t: 'm' },
    { s: "3x", c: "#e67e22", v: 3n, t: 'm' }, { s: "4x", c: "#d35400", v: 4n, t: 'm' },
    { s: "5x", c: "#e74c3c", v: 5n, t: 'm' }, { s: "6x", c: "#c0392b", v: 6n, t: 'm' },
    { s: "7x", c: "#8e44ad", v: 7n, t: 'm' }, { s: "8x", c: "#9b59b6", v: 8n, t: 'm' },
    { s: "9x", c: "#2980b9", v: 9n, t: 'm' }, { s: "10x", c: "#3498db", v: 10n, t: 'm' },
    { s: "√", c: "#1abc9c", t: 'rt' }, { s: "x²", c: "#16a085", v: 2n, t: 'e' },
    { s: "x³", c: "#27ae60", v: 3n, t: 'e' }, { s: "x/2", c: "#7f8c8d", t: 'h' },
    { s: "x/y", c: "#34495e", t: 'rv' }, { s: "#", c: "#e84118", t: 'pr' },
    { s: "⚡️", c: "#fbc531", t: 'pw' }, { s: "!", c: "#c23616", t: 'fc' },
    { s: "?", c: "#8c7ae6", t: 'rn' }, { s: "Φ", c: "#e84393", t: 'f1' },
    { s: "Tb", c: "#fd79a8", t: 'f2' }, { s: "Qd", c: "#6c5ce7", t: 'f3' },
    { s: "???", c: "#b2bec3", t: 'gb' }, { s: "+1", c: "#555", v: 1n, t: 'a' }
];

const Engine = {
    active: false, hp: 0n, time: 0, mode: 'timer',
    h: { x: 50, y: 50, vx: 12, vy: 10, r: 0, pwr: 1n, hits: 0, hist: [0n, 0n, 0n, 1n] },
    t: { x: 300, y: 300, vx: 4, vy: -4, r: 0 },
    
    start() {
        const hpVal = document.getElementById('hp-in').value;
        this.hp = hpVal.includes('^') ? BigInt(hpVal.split('^')[0]) ** BigInt(hpVal.split('^')[1]) : BigInt(hpVal);
        this.time = (this.mode === 'timer') ? parseFloat(document.getElementById('time-in').value) : 0;
        
        this.h.r = parseInt(document.getElementById('size-hero').value);
        this.t.r = parseInt(document.getElementById('size-target').value);
        this.h.data = UI.selected;
        this.h.pwr = this.h.data.v || 1n;
        this.h.hits = 0;

        document.getElementById('dashboard').style.transform = 'translateY(-100%)';
        document.getElementById('game-view').style.display = 'flex';
        
        const hEl = document.getElementById('hero');
        hEl.style.width = hEl.style.height = (this.h.r * 2) + "px";
        hEl.style.background = this.h.data.c;
        hEl.innerText = this.h.data.s;
        
        const tEl = document.getElementById('target');
        tEl.style.width = tEl.style.height = (this.t.r * 2) + "px";

        this.active = true;
        requestAnimationFrame((ts) => this.loop(ts));
    },

    loop() {
        if(!this.active) return;
        
        if(this.mode === 'timer') {
            this.time -= 0.016;
            if(this.time <= 0) { this.active = false; alert("TIME OUT"); location.reload(); return; }
        } else {
            this.time += 0.016;
        }
        
        document.getElementById('timer-ui').innerText = Math.abs(this.time).toFixed(2);

        // Steering
        if(document.getElementById('ai-on').checked) {
            const dx = (this.t.x + this.t.r) - (this.h.x + this.h.r);
            const dy = (this.t.y + this.t.r) - (this.h.y + this.h.r);
            const dist = Math.sqrt(dx*dx + dy*dy);
            const limit = parseFloat(document.getElementById('kill-at').value);
            const elapsed = (this.mode === 'timer') ? parseFloat(document.getElementById('time-in').value) - this.time : this.time;
            const force = (elapsed > limit - 1.5) ? 1.5 : -1.0;
            this.h.vx += (dx/dist) * force; this.h.vy += (dy/dist) * force;
        }

        [this.h, this.t].forEach(o => {
            o.x += o.vx; o.y += o.vy;
            const lim = 800 - (o.r * 2);
            if(o.x < 0 || o.x > lim) o.vx *= -1;
            if(o.y < 0 || o.y > lim) o.vy *= -1;
        });

        const dx = (this.h.x + this.h.r) - (this.t.x + this.t.r);
        const dy = (this.h.y + this.h.r) - (this.t.y + this.t.r);
        const d = Math.sqrt(dx*dx + dy*dy);

        if(d < (this.h.r + this.t.r)) {
            this.hit();
            this.h.vx *= -1.1; this.h.vy *= -1.1;
        }

        document.getElementById('hero').style.transform = `translate(${this.h.x}px, ${this.h.y}px)`;
        document.getElementById('target').style.transform = `translate(${this.t.x}px, ${this.t.y}px)`;
        document.getElementById('target-hp').innerText = this.hp.toString();
        document.getElementById('target-hp').style.fontSize = Math.max(12, 45 - (this.hp.toString().length/3)) + "px";

        if(this.hp <= 0n) { this.active = false; alert("ELIMINATED"); location.reload(); }
        else { requestAnimationFrame(() => this.loop()); }
    },

    hit() {
        let dmg = 1n;
        const type = this.h.data.t;
        this.h.hits++;
        const n = BigInt(this.h.hits);

        switch(type) {
            case 'm': this.h.pwr *= this.h.data.v; dmg = this.h.pwr; break;
            case 'e': this.h.pwr = this.h.pwr ** this.h.data.v; dmg = this.h.pwr; break;
            case 'rt': dmg = this.hp / 3n; break;
            case 'h': dmg = this.hp / 2n; break;
            case 'rv': dmg = this.hp - (this.hp / (n+1n)); break;
            case 'pw': dmg = n ** n; break;
            case 'f1': dmg = this.h.hist[3] + this.h.hist[2]; break;
            default: dmg = n * 100n;
        }
        
        this.hp = (dmg >= this.hp) ? 0n : this.hp - dmg;
        this.h.hist.shift(); this.h.hist.push(dmg);

        const pop = document.createElement('div');
        pop.className = 'dmg-pop'; pop.innerText = "-" + (dmg > 1000000n ? "LOTS" : dmg.toString());
        pop.style.left = this.h.x + 'px'; pop.style.top = this.h.y + 'px';
        document.getElementById('arena').appendChild(pop);
        setTimeout(() => pop.remove(), 1000);
    }
};

const UI = {
    selected: BALLS[1],
    init() {
        const grid = document.getElementById('roster-grid');
        BALLS.forEach(b => {
            const s = document.createElement('div');
            s.className = 'ball-slot'; s.style.background = b.c; s.innerText = b.s;
            s.onclick = () => {
                this.selected = b;
                document.querySelectorAll('.ball-slot').forEach(el => el.classList.remove('active'));
                s.classList.add('active');
                this.sync();
            };
            if(b === this.selected) s.classList.add('active');
            grid.appendChild(s);
        });
        this.sync();
    },
    setMode(m) {
        Engine.mode = m;
        document.getElementById('btn-timer').className = m === 'timer' ? 'mode-btn active' : 'mode-btn';
        document.getElementById('btn-stop').className = m === 'stopwatch' ? 'mode-btn active' : 'mode-btn';
        document.getElementById('limit-box').className = m === 'stopwatch' ? 'grayed' : '';
    },
    sync() {
        const hR = parseInt(document.getElementById('size-hero').value);
        const tR = parseInt(document.getElementById('size-target').value);
        document.getElementById('val-hero').innerText = hR;
        document.getElementById('val-target').innerText = tR;
        
        const ph = document.getElementById('prev-ball');
        ph.style.width = ph.style.height = (hR * 2 / 2) + "px"; // Preview is half-scale for 1:1 view
        ph.style.background = this.selected.c; ph.innerText = this.selected.s;
        ph.style.left = "50px"; ph.style.top = "50px";

        const pt = document.getElementById('prev-target');
        pt.style.width = pt.style.height = (tR * 2 / 2) + "px";
        pt.style.left = "150px"; pt.style.top = "150px";
    }
};

UI.init();
</script>
</body>
</html>
